}
function chTramoDelDia(plantilla, fechaISO) {
  if (!plantilla || !plantilla.dias) return null;
  const t = plantilla.dias[chDiaSemana(fechaISO)];
  if (!t || !t.ini || !t.fin) return null;
  const min = chMinutos(t.fin) - chMinutos(t.ini);
  return min > 0 ? { ini: t.ini, fin: t.fin, min } : null;
}

  return CH_DIAS.reduce((s, [k]) => { const t = plantilla.dias && plantilla.dias[k]; const m = t && t.ini && t.fin ? chMinutos(t.fin) - chMinutos(t.ini) : 0; return s + (m > 0 ? m : 0); }, 0);
}
function chResumenPlantilla(p) {
  const partes = CH_DIAS.filter(([k]) => p.dias && p.dias[k] && p.dias[k].ini && p.dias[k].fin).map(([k, n]) => n.slice(0, 2) + ' ' + p.dias[k].ini + '–' + p.dias[k].fin);

// Días del mes con turno (no festivos) hasta hoy, para un trabajador.
function chTeoricoMes(usuarioId, mes) {
  const plantilla = chPlantillaDe(usuarioId);
  const res = { min: 0, dias: [] };
  if (!plantilla) return res;
  const [a, m] = mes.split('-').map(Number);
  const ultimo = new Date(a, m, 0).getDate();
  const hoy = chFechaDe(Date.now());
  for (let d = 1; d <= ultimo; d++) {
    const f = mes + '-' + String(d).padStart(2, '0');
    if (f > hoy) break;
    if (f < chAlta(usuarioId)) continue;
    if (chFestivo(f)) continue;
    if (chConfig.ausencias && chConfig.ausencias.some(a => a.usuarioId === usuarioId && a.desde <= f && f <= a.hasta)) continue;
    const t = chTramoDelDia(plantilla, f);

// ---------- Correcciones de fichajes con registro (auditoría) ----------
function chTsDe(fechaISO, hhmm) { const [a, m, d] = fechaISO.split('-').map(Number); const [h, mi] = hhmm.split(':').map(Number); return new Date(a, m - 1, d, h, mi).getTime(); }
// Aplica un cambio sobre un fichaje (o crea uno nuevo) y deja constancia en ch_auditoria.
function chCorregirFichaje({ fichaje, usuarioId, nombre, fecha, tipo, nuevaHora, motivo }) {
  const autor = sesionActual ? { id: sesionActual.id, nombre: sesionActual.nombre } : { id: 'admin', nombre: 'Administrador' };
  const ahora = Date.now();
  let accion, antes = null, despues = null, ref, datos;
  if (fichaje && !nuevaHora) {
    accion = 'anular'; antes = { tipo: fichaje.tipo, ts: fichaje.ts };
    datos = Object.assign({}, fichaje, { anulado: true, anuladoEn: ahora, anuladoPor: autor.nombre, motivoAnulacion: motivo });
    ref = coleccionFichajes().doc(fichaje.id);
  } else if (fichaje) {
    const ts = chTsDe(fecha, nuevaHora);
    if (ts === fichaje.ts) return Promise.resolve(null);
    accion = 'modificar'; antes = { tipo: fichaje.tipo, ts: fichaje.ts }; despues = { tipo: fichaje.tipo, ts };
    datos = Object.assign({}, fichaje, { ts, mes: chMesDe(ts), fecha: chFechaDe(ts), modificado: true, tsOriginal: fichaje.tsOriginal || fichaje.ts, modificadoEn: ahora, modificadoPor: autor.nombre });
    ref = coleccionFichajes().doc(fichaje.id);
  } else if (nuevaHora) {
    const ts = chTsDe(fecha, nuevaHora);
    accion = 'crear'; despues = { tipo, ts };
    datos = { usuarioId, nombre, tipo, ts, mes: chMesDe(ts), fecha: chFechaDe(ts), origen: 'manual', creadoPor: autor.nombre, creadoEn: ahora, tsServidor: firebase.firestore.FieldValue.serverTimestamp() };
    ref = coleccionFichajes().doc('man_' + ahora + '_' + Math.random().toString(36).slice(2, 7));
  } else return Promise.resolve(null);
  delete datos.id;
  if (datos.tsServidor && datos.tsServidor.toMillis) datos.tsServidor = datos.tsServidor.toMillis();
  return ref.set(datos).then(() => coleccionAuditoria().add({
    ts: ahora, mes: chMesDe((despues || antes).ts), autorId: autor.id, autorNombre: autor.nombre,
    fichajeId: ref.id, usuarioId: usuarioId || fichaje.usuarioId, trabajador: nombre || fichaje.nombre,
    accion, antes, despues, motivo,
  }));
}

function chValidarDNI(v) {
  v = (v || '').toUpperCase().replace(/[\s-]/g, '');
  const m = v.match(/^([XYZ]?)(\d{7,8})([A-Z])$/);
  if (!m) return false;
  const num = Number(({ X: '0', Y: '1', Z: '2' }[m[1]] || '') + m[2]);
  return 'TRWAGMYFPDXBNJZSQVHLCKE'[num % 23] === m[3];
}
function chValidarIBAN(v) {
  v = (v || '').toUpperCase().replace(/\s/g, '');
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(v)) return false;
  const r = (v.slice(4) + v.slice(0, 4)).replace(/[A-Z]/g, c => String(c.charCodeAt(0) - 55));
  let resto = 0; for (const d of r) resto = (resto * 10 + Number(d)) % 97;
  return resto === 1;
}
function chFormatearIBAN(v) { return (v || '').toUpperCase().replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim(); }

function chRenderFichajesAdmin(root) {
  if (!chMesVista) chMesVista = chMesDe(Date.now());
  const trabajadores = accessControl.usuarios.filter(u => u.rol === 'trabajador');

  const selUsuario = selectEl([{ value: '', label: 'Todos' }].concat(trabajadores.map(u => ({ value: u.id, label: u.nombre }))), chFiltroUsuario, v => { chFiltroUsuario = v; renderControlHorario(); });
  panel.appendChild(el('div', { class: 'grid' }, field('Mes', selMes), field('Trabajador', selUsuario)));
  panel.appendChild(el('div', { class: 'toolbar' },
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { chMesVista = chMesAnterior(chMesVista); renderControlHorario(); } }, '◀ Mes anterior'),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { chMesVista = chMesDe(Date.now()); renderControlHorario(); } }, 'Mes actual'),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => renderControlHorario() }, '🔄 Recargar'),
  ));

  panel.appendChild(zona);
  root.appendChild(panel);

  chCargarMes(chMesVista, chFiltroUsuario || null).then(fichajes => {
    zona.innerHTML = '';
    const conHorario = trabajadores.filter(u => (!chFiltroUsuario || u.id === chFiltroUsuario) && chPlantillaDe(u.id));

    const tramos = chEmparejar(fichajes);
    const totales = {};
    conHorario.forEach(u => { totales[u.id] = { nombre: u.nombre, ms: 0, incompletos: 0, sinGps: 0 }; });
    tramos.forEach(t => {
      const ref = t.entrada || t.salida;
      const tot = totales[ref.usuarioId] = totales[ref.usuarioId] || { nombre: ref.nombre, ms: 0, incompletos: 0, sinGps: 0 };
      if (t.entrada && t.salida) tot.ms += t.salida.ts - t.entrada.ts; else tot.incompletos++;
      [t.entrada, t.salida].forEach(f => { if (f && f.origen !== 'manual' && (f.lat === undefined || f.lat === null)) tot.sinGps++; });
    });
    const hoyISO = chFechaDe(Date.now());
    const tbRes = el('tbody');
    Object.keys(totales).map(uid => Object.assign({ uid }, totales[uid])).sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(t => {
      const plantilla = chPlantillaDe(t.uid);
      const teo = chTeoricoMes(t.uid, chMesVista);
      const diasConFichaje = new Set(fichajes.filter(f => f.usuarioId === t.uid && !f.anulado).map(f => chFechaDe(f.ts)));
      const ausencias = teo.dias.filter(f => f < hoyISO && !diasConFichaje.has(f));

      tbRes.appendChild(el('tr', {},
        el('td', {}, el('b', {}, t.nombre), el('div', { class: 'sub', style: 'font-size:12px;' }, plantilla ? plantilla.nombre : 'Sin horario')),
        el('td', {}, chDuracion(t.ms)),
        el('td', {}, plantilla ? chDuracion(teo.min * 60000) : '—'),
        el('td', { style: plantilla ? ('font-weight:700;color:' + (difMin < 0 ? '#B3261E' : '#1E5B3C') + ';') : '' }, plantilla ? (difMin < 0 ? '− ' : '+ ') + chDuracion(Math.abs(difMin) * 60000) : '—'),
        el('td', {}, incid.length ? incid : '—'),
        el('td', {}, t.sinGps ? t.sinGps + ' sin GPS' : '—'),
      ));
    });
    zona.appendChild(el('h3', { style: 'margin:6px 0;' }, 'Resumen de ' + chNombreMes(chMesVista)));
    zona.appendChild(el('div', { style: 'overflow-x:auto;' }, el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Trabajador'), el('th', {}, 'Fichadas'), el('th', {}, 'Teóricas'), el('th', {}, 'Diferencia'), el('th', {}, 'Incidencias'), el('th', {}, 'Ubicación'))), tbRes)));
    zona.appendChild(el('div', { class: 'sub', style: 'margin-top:6px;font-size:12px;' }, 'Teóricas = horas de su plantilla en los días ya pasados del mes (incluido hoy), sin contar festivos.'));
    const editor = el('div', { style: 'margin-top:12px;' });
    const recargar = () => renderControlHorario();
    zona.appendChild(el('div', { class: 'toolbar', style: 'margin-top:12px;' }, el('button', { class: 'btn btn-ghost btn-sm', onclick: () => chEditorNuevo(trabajadores, editor, recargar) }, '➕ Añadir fichaje a mano')));
    zona.appendChild(editor);
    const zonaAud = el('div');
    chCargarAuditoriaMes(chMesVista).then(aud => {
      aud = aud.filter(a => !chFiltroUsuario || a.usuarioId === chFiltroUsuario);
      if (!aud.length) return;
      zonaAud.appendChild(el('h3', { style: 'margin:16px 0 6px;' }, '📝 Registro de correcciones (' + aud.length + ')'));
      const tba = el('tbody');
      aud.forEach(a => tba.appendChild(el('tr', {},
        el('td', {}, fmtFechaDMYShell(chFechaDe(a.ts)) + ' ' + chHora(a.ts)),
        el('td', {}, a.trabajador),
        el('td', {}, chTextoCambio(a)),
        el('td', {}, a.motivo),
        el('td', {}, a.autorNombre))));
      zonaAud.appendChild(el('div', { style: 'overflow-x:auto;' }, el('table', { style: 'width:100%;' }, el('thead', {}, el('tr', {}, el('th', {}, 'Cuándo'), el('th', {}, 'Empleado'), el('th', {}, 'Cambio'), el('th', {}, 'Motivo'), el('th', {}, 'Quién'))), tba)));
    }).catch(() => {});
    if (!tramos.length) { zona.appendChild(zonaAud); return; }

    const tb = el('tbody');
    tramos.forEach(t => {
      const ref = t.entrada || t.salida;
      const relojRaro = [t.entrada, t.salida].some(f => f && f.tsServidor && f.tsServidor.toMillis && Math.abs(f.tsServidor.toMillis() - f.ts) > 5 * 60000);
      tb.appendChild(el('tr', {},
        el('td', {}, fmtFechaDMYShell(chFechaDe(ref.ts)), chFestivo(chFechaDe(ref.ts)) ? el('div', { class: 'sub', style: 'font-size:11px;' }, '🎉 ' + chFestivo(chFechaDe(ref.ts)).nombre) : null),
        el('td', {}, ref.nombre),
        el('td', {}, t.entrada ? chHora(t.entrada.ts) : el('span', { style: 'color:#B3261E;' }, 'falta')),
        el('td', {}, t.entrada ? chEnlaceMapa(t.entrada) : ''),
        el('td', {}, t.salida ? chHora(t.salida.ts) : el('span', { style: 'color:#B3261E;' }, 'falta')),
        el('td', {}, t.salida ? chEnlaceMapa(t.salida) : ''),
        el('td', {}, (t.entrada && t.salida ? chDuracion(t.salida.ts - t.entrada.ts) : '—') + (relojRaro ? ' ⚠️' : '') + ([t.entrada, t.salida].some(f => f && (f.modificado || f.origen === 'manual')) ? ' ✏️' : '')),
        el('td', {}, el('button', { class: 'btn btn-ghost btn-sm', title: 'Corregir', onclick: () => chEditorTramo(t, editor, recargar) }, '✏️')),
      ));
    });
    zona.appendChild(el('h3', { style: 'margin:16px 0 6px;' }, 'Detalle de fichajes'));
    zona.appendChild(el('div', { style: 'overflow-x:auto;' }, el('table', {}, el('thead', {}, el('tr', {},
      el('th', {}, 'Fecha'), el('th', {}, 'Trabajador'), el('th', {}, 'Entrada'), el('th', {}, 'Ubicación'), el('th', {}, 'Salida'), el('th', {}, 'Ubicación'), el('th', {}, 'Horas'), el('th', {}, ''))), tb)));
    zona.appendChild(el('div', { class: 'sub', style: 'margin-top:8px;font-size:12px;' }, '⚠️ = la hora del móvil no coincidía con la del servidor al fichar (más de 5 min). ✏️ en las horas = fichaje corregido o añadido a mano (ver registro de correcciones).'));

function arrancarAppLocal() {
  if (esVistaTiendaOnline()) {
    renderTiendaOnline();
    return;
  }
  if (esVistaPublicaTaller()) {
    renderVistaPublicaTaller();
    return;
  }
  if (esVistaPublica()) {
    renderVistaPublica();
    return;
  }
  const hadClubAhora = !!clubGlobal.nombre;
  syncClubIntoModules();
  if (accesoActivo() && !sesionActual) {
    mostrarLogin();
  } else if (esTrabajador()) {
    showSection('fichar');
  } else if (!hadClubAhora) {
    currentSection = 'onboarding';
    renderOnboarding();
    document.getElementById('onboardingScreen').style.display = 'block';
    renderShellHeader();
  } else {
    showSection('home');
  }
}

function arranqueLegado() {
  marcarEstadoNube('☁️ Conectando…');
  const refInicial = esVistaPublica() ? docPublico() : docNube();
  refInicial.get().then(doc => {
    // Mientras no exista la copia pública (justo tras publicar esta versión), las páginas públicas usan el documento general.
    if (esVistaPublica() && !doc.exists) return docNube().get().then(d2 => ({ doc: d2, ref: docNube() }));
    return { doc, ref: refInicial };
  }).then(({ doc, ref: refDatos }) => {
    if (doc.exists) {
      aplicarDatosDeNube(doc.data());
      marcarEstadoNube('☁️ Sincronizado');
    } else {
      marcarEstadoNube('☁️ Sincronizado');
    }
    sincronizacionInicialLista = true;
    if (!doc.exists && clubGlobal.nombre) programarSyncNube();
    if (!esVistaPublica() && doc.exists) subirCopiaPublica();
    (esVistaPublica() ? Promise.resolve() : chCargarPins()).then(arrancarAppLocal, arrancarAppLocal);
    if (!esVistaPublica()) cargarRecibosDeNube().then(() => {
      const pagosScreen = document.getElementById('pagosScreen');
      if (pagosScreen && pagosScreen.style.display !== 'none') PagosApp.render();
    });
    cargarFotosTallerDeNube().then(() => {
      const tallerScreen = document.getElementById('tallerScreen');
      if (tallerScreen && tallerScreen.style.display !== 'none') { TallerApp.render(); renderShellHeader(); }
      if (esVistaPublicaTaller()) renderVistaPublicaTaller();
      if (esVistaTiendaOnline()) renderTiendaOnline();
    });
    if (esVistaPublica()) {
      let timerVistaPublica = null;
      refDatos.onSnapshot(snap => {
        if (!snap.exists) return;
        clearTimeout(timerVistaPublica);
        const intentarActualizar = () => {
          const activo = document.activeElement;
          const ocupado = activo && (activo.tagName === 'SELECT' || activo.tagName === 'INPUT');
          if (ocupado) { timerVistaPublica = setTimeout(intentarActualizar, 1500); return; }
          aplicarDatosDeNube(snap.data());
          if (esVistaPublicaTaller()) renderVistaPublicaTaller();
          else if (esVistaTiendaOnline()) renderTiendaOnline();
          else renderVistaPublica();
        };
        timerVistaPublica = setTimeout(intentarActualizar, 1500);
      });
    }
  }).catch(err => {
    console.warn('No se pudo conectar a la nube, usando datos guardados en este dispositivo:', err);
    marcarEstadoNube('⚠️ Nube: ' + (err && err.code ? err.code : (err && err.message) || 'error desconocido'));
    sincronizacionInicialLista = true;
    arrancarAppLocal();
  });
}
if (firebaseDisponible) {
  if (!esVistaPublica() && authDisponible) arranqueConCuentas(arranqueLegado);
  else arranqueLegado();
} else {
  arrancarAppLocal();
}

// ===== Aviso de nueva versión (evita quedarse con la versión antigua en caché) =====
function mostrarAvisoNuevaVersion() {
  if (document.getElementById('avisoNuevaVersion')) return;
  document.body.appendChild(el('div', { id: 'avisoNuevaVersion', style: 'position:fixed;left:12px;right:12px;bottom:12px;z-index:100;background:#E8B924;color:#0F2A1E;padding:12px 14px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700;' },
    el('span', {}, '🔄 Hay una versión nueva de la app.'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: () => location.reload() }, 'Actualizar ahora'),
  ));
}
(function comprobarNuevaVersion() {
  const meta = document.querySelector('meta[name="build-id"]');
  const actual = meta ? meta.content : '';
  if (!actual || actual === '__BUILD_ID__' || location.protocol === 'file:') return;
  async function buscar() {
    try {
      const r = await fetch(location.pathname + '?chk=' + Date.now(), { cache: 'no-store' });
      const t = await r.text();
      const m = t.match(/<meta name="build-id" content="([^"]*)"/);
      if (!m || m[1] === actual || m[1] === '__BUILD_ID__') return;
      await fetch(location.pathname, { cache: 'reload' }).catch(() => {});
      if (esVistaPublica()) {
        if (sessionStorage.getItem('buildRecargada') !== m[1]) { sessionStorage.setItem('buildRecargada', m[1]); location.reload(); }
      } else {
        mostrarAvisoNuevaVersion();
      }
    } catch (e) {}
  }
  setTimeout(buscar, 3000);
  setInterval(buscar, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) buscar(); });
})();
</script>

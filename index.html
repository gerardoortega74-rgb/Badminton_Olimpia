.brand h1{font-size:clamp(22px,4.5vw,40px);margin:0;letter-spacing:.3px;font-weight:800;line-height:1.15;}
.brand small{display:block;color:#CFE8DA;font-weight:400;font-size:clamp(12px,1.6vw,16px);}
nav.tabs{display:flex;gap:4px;background:var(--court-dark) linear-gradient(to left, rgba(0,0,0,0.4), rgba(0,0,0,0) 28px) right center no-repeat;background-size:34px 100%;padding:6px 14px;overflow-x:auto;}
nav.tabs button{border:none;background:transparent;color:#CFE8DA;padding:10px 13px;font-size:12.5px;font-weight:600;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;}
nav.tabs button.active{background:var(--bg);color:var(--court-dark);}
#tallerSidebarBrand, #tallerSidebarFooter{display:none;}
@media (min-width: 860px) {
  body.taller-sidebar-on header.app-header,
  body.taller-sidebar-on main{ margin-left:196px; transition:margin-left .15s ease; }
  body.taller-sidebar-on header.app-header{
    min-height:0 !important;padding:10px 16px !important;background:var(--court-dark);
  }
  body.taller-sidebar-on header.app-header::before,
  body.taller-sidebar-on header.app-header::after{ display:none !important; }
  body.taller-sidebar-on header.app-header .brand{ display:none !important; }

  #tallerScreen nav.tabs#tallerTabsNav{
    display:none;
  }
  body.taller-sidebar-on #tallerScreen nav.tabs#tallerTabsNav{
    display:flex;flex-direction:column;width:196px;
    position:fixed;left:0;top:0;bottom:0;z-index:40;margin:0 !important;
    padding:0;gap:0;overflow-y:auto;overflow-x:visible;
    background:linear-gradient(195deg,#123A52 0%,#071D2C 100%);
    box-shadow:6px 0 28px rgba(0,0,0,0.25);
  }
  body.taller-sidebar-on #tallerSidebarBrand{
    display:flex;align-items:center;gap:9px;padding:16px 14px 13px;
    border-bottom:1px solid rgba(255,255,255,0.09);margin-bottom:6px;
  }
  #tallerSidebarBrand img, #tallerSidebarBrand .ph{
    width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0;
    background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  #tallerSidebarBrand b{color:#fff;font-size:12.5px;display:block;line-height:1.25;}
  #tallerSidebarBrand small{color:#8FAFC2;font-size:9.5px;}
  #tallerScreen nav.tabs#tallerTabsNav button{
    text-align:left;border-radius:0;padding:9px 13px;white-space:normal;font-size:12.5px;
    display:flex;align-items:center;gap:9px;background:transparent;color:#C3D6E1;
    font-weight:600;position:relative;margin:0 7px 2px;border-radius:9px;
    transition:background .12s ease;
  }
  #tallerScreen nav.tabs#tallerTabsNav button:hover{background:rgba(255,255,255,0.06);color:#fff;}
  #tallerScreen nav.tabs#tallerTabsNav .tab-icon{
    width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.08);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  #tallerScreen nav.tabs#tallerTabsNav .tab-label{flex:1;}
  #tallerScreen nav.tabs#tallerTabsNav button.active{
    background:var(--gold);color:var(--court-dark);font-weight:800;
    box-shadow:0 4px 14px rgba(232,185,36,0.35);
  }
  #tallerScreen nav.tabs#tallerTabsNav button.active .tab-icon{background:rgba(15,46,68,0.16);}
  #tallerScreen nav.tabs#tallerTabsNav button:last-child{
    margin-top:10px;padding-top:11px;
    border-top:1px solid rgba(255,255,255,0.09);
  }
  body.taller-sidebar-on #tallerSidebarFooter{
    display:block;margin-top:auto;padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,0.09);
    color:#7E9BAC;font-size:10px;
  }
}

.panel h3{font-size:14px;color:var(--court-dark);margin:16px 0 6px;}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
label{display:block;font-size:12px;font-weight:700;color:var(--court-dark);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:9px 10px;border:1px solid #D8D5CB;border-radius:7px;font-size:14px;background:#FBFAF7;font-family:inherit;
}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.field{margin-bottom:10px;}
.btn{border:none;border-radius:7px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--court);color:#fff;}
.btn-primary:hover{background:var(--court-dark);}
.btn-gold{background:var(--gold);color:var(--court-dark);}
.btn-gold:hover{background:var(--gold-dark);}
.btn-ghost{background:transparent;color:var(--court);border:1px solid var(--court);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;max-width:100%;background:linear-gradient(to left, rgba(0,0,0,0.16), rgba(0,0,0,0) 26px) right center no-repeat;background-size:32px 100%;}
body.solo-lectura input:not([type=file]), body.solo-lectura select, body.solo-lectura textarea{pointer-events:none;background:#ECE9DE;opacity:0.75;}
body.solo-lectura .btn-danger{display:none !important;}
.lectura-banner{background:#7A5B00;color:#fff;text-align:center;padding:8px;font-size:12.5px;font-weight:700;}
.login-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:360px;margin:40px auto;}
.login-userbtn{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:8px;border:1px solid #E4E1D6;background:#FBFAF7;font-size:14px;font-weight:700;color:var(--court-dark);cursor:pointer;}
.login-userbtn:hover{border-color:var(--gold);}
th,td{padding:7px 8px;border-bottom:1px solid #ECE9DE;text-align:left;vertical-align:top;}
th{background:#F5F3EB;color:var(--court-dark);font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
.chip{display:inline-block;background:var(--court);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
.chip-gold{background:var(--gold);color:var(--court-dark);}
.chip-muted{background:#DEDBD0;color:var(--muted);}
.card{border:1px solid #E4E1D6;border-radius:var(--radius);padding:12px;margin-bottom:10px;}
#tallerScreen .panel,#tallerPublicoScreen .panel{background-color:rgba(255,255,255,.72);}
#tallerScreen .card,#tallerPublicoScreen .card{background-color:rgba(255,255,255,.5);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card-title{font-weight:700;color:var(--court-dark);font-size:14px;}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted);font-size:14px;}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;}
.msg-warn{background:#FBF1D9;color:#7A5B00;border:1px solid #F0D98A;}
.msg-ok{background:#E4F3E9;color:#1E5B3C;border:1px solid #B7DEC5;}
.msg-info{background:var(--info-bg);color:var(--info);border:1px solid #BBD6EE;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat-card{background:var(--court);color:#fff;border-radius:var(--radius);padding:14px;}
.stat-card .num{font-size:24px;font-weight:800;color:var(--gold);}
.stat-card .lab{font-size:11.5px;color:#CFE8DA;text-transform:uppercase;}
footer.hint{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
.phase-bar{display:flex;border-radius:8px;overflow:hidden;margin-bottom:6px;height:34px;box-shadow:var(--shadow);}
.phase-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.source-note{font-size:11.5px;color:var(--muted);margin-top:14px;border-top:1px dashed #DDD8C9;padding-top:10px;}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.day-box{border:1px solid #E4E1D6;border-radius:8px;padding:10px;background:#FBFAF7;}
.day-box h4{margin:0 0 6px;font-size:12.5px;color:var(--court-dark);text-transform:uppercase;}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.group-box{border:1px solid #E4E1D6;border-radius:var(--radius);overflow:hidden;}
.group-box h3{margin:0;background:var(--court);color:#fff;padding:8px 12px;font-size:13px;}
.group-box .content{padding:10px;}
.match-card{border:1px solid #E4E1D6;border-radius:8px;padding:10px;margin-bottom:8px;background:#FBFAF7;}
.match-card.done{border-color:var(--ok);background:#F1F8F4;}
.match-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;font-weight:700;}
.match-players{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;}
.match-players .vs{color:var(--muted);font-weight:400;font-size:12px;}
.sched-grid{display:grid;border:1px solid #E4E1D6;border-radius:var(--radius);overflow-x:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(to left, rgba(0,0,0,0.16), rgba(0,0,0,0) 26px) right center no-repeat;background-size:32px 100%;}
.sched-row{display:grid;grid-template-columns:70px repeat(var(--ncourts,1),minmax(120px,1fr));border-bottom:1px solid #ECE9DE;width:max-content;min-width:100%;}
.sched-row:last-child{border-bottom:none;}
.sched-time{background:#F5F3EB;padding:8px;font-size:12px;font-weight:700;color:var(--court-dark);display:flex;align-items:center;position:sticky;left:0;z-index:1;}
.sched-cell{padding:8px;border-left:1px solid #ECE9DE;font-size:12px;min-height:52px;}
.sched-match{background:var(--court);color:#fff;border-radius:6px;padding:6px 8px;font-size:11.5px;line-height:1.35;}
.sched-match.ko{background:var(--gold);color:var(--court-dark);}
.bracket{display:flex;gap:26px;overflow-x:auto;padding:10px 4px 20px;}
.bracket-round{display:flex;flex-direction:column;justify-content:space-around;gap:16px;min-width:180px;}
.bracket-round h4{font-size:11px;color:var(--muted);text-transform:uppercase;margin:0 0 4px;}
.bracket-match{border:1px solid #E4E1D6;border-radius:8px;background:#FBFAF7;font-size:12.5px;overflow:hidden;}
.bracket-match .p{padding:6px 8px;border-bottom:1px solid #ECE9DE;display:flex;justify-content:space-between;}
.bracket-match .p:last-child{border-bottom:none;}
.bracket-match .p.winner{background:#EAF5EE;font-weight:700;}
.modal-bg{position:fixed;inset:0;background:rgba(15,42,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto;}
.modal h3{margin-top:0;color:var(--court-dark);}
.set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.set-row input{width:70px;text-align:center;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:6px;}

.home-card:hover{border-color:var(--gold);}
.home-card .icon{font-size:32px;margin-bottom:10px;}
.home-card h3{margin:0 0 6px;color:var(--court-dark);font-size:16px;}
.home-card p{margin:0;color:var(--muted);font-size:13px;}
.club-banner{background:linear-gradient(135deg,var(--court) 0%,var(--court-dark) 100%);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:relative;overflow:hidden;}
.club-banner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(232,185,36,.25),transparent 55%);pointer-events:none;}
.club-banner .info{position:relative;z-index:1;}
.club-banner .info b{color:#fff;font-size:17px;}
.club-banner .info > div > div{color:#CFE8DA;font-size:13px;}
.club-banner > button{position:relative;z-index:1;color:#fff;border-color:rgba(255,255,255,.6);}
.club-banner .info{font-size:13.5px;color:var(--court-dark);display:flex;align-items:center;gap:14px;}
.club-banner .info b{font-size:19px;}
.club-banner .logo-big{width:64px;height:64px;border-radius:12px;object-fit:cover;box-shadow:var(--shadow);flex-shrink:0;}
.club-banner .logo-big-emoji{width:64px;height:64px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.home-group-big{width:100%;min-height:150px;padding:22px 28px;cursor:pointer;box-sizing:border-box;}
.home-group-big .logo-big,.home-group-big .logo-big-emoji{width:84px;height:84px;font-size:42px;}
.home-group-big .info{gap:20px;}
.home-group-big .info b{font-size:clamp(20px,4.2vw,34px);line-height:1.15;display:block;}
.home-group-big .info > div > div:last-child{font-size:clamp(12px,2vw,15px);}
.home-group-big:hover{box-shadow:0 4px 16px rgba(15,46,68,0.28);transform:translateY(-1px);transition:all .15s;}

.acta-hoja .acta-set{border:1px solid #999;border-radius:6px;padding:10px 12px;margin-bottom:10px;}
.acta-hoja .acta-set-titulo{font-weight:700;font-size:12px;text-transform:uppercase;color:#555;margin-bottom:8px;}
.acta-hoja .acta-set-fila{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:8px;}
.acta-hoja .acta-set-fila:last-child{margin-bottom:0;}
.acta-hoja .acta-nombre{flex:1;min-width:0;word-break:break-word;font-size:15px;}
.acta-hoja .acta-set .hueco, .acta-hoja .acta-linea .hueco{border-bottom:1px solid #000;width:64px;flex-shrink:0;display:inline-block;height:28px;}
.acta-hoja .acta-firma{margin-top:40px;display:flex;justify-content:space-between;}
.acta-hoja .acta-firma div{border-top:1px solid #000;width:220px;text-align:center;padding-top:6px;font-size:12px;}

main, header.app-header > *, footer.hint{ position:relative; z-index:1; }
body::before{display:none !important;}
header.app-header::before{display:none !important;}
.panel, .home-card{background-image:none !important;}
.brand-badge img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
.logo-preview{ width:72px; height:72px; border-radius:12px; object-fit:cover; border:1px solid #E4E1D6; background:#FBFAF7; }
.logo-drop{ border:2px dashed #D8D5CB; border-radius:10px; padding:16px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer; }
.logo-drop:hover{ border-color:var(--gold); }

.fichas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:10px;}
.ficha-card{border:1px solid #E4E1D6;border-radius:var(--radius);padding:14px;background:#FBFAF7;}
.ficha-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.ficha-title{margin:0 0 8px;font-size:15px;color:var(--court-dark);}
.ficha-objetivo{font-size:13px;margin-bottom:8px;line-height:1.4;}
.ficha-material{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.ficha-subhead{font-size:12px;font-weight:700;color:var(--court-dark);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 4px;}
.ficha-pasos{margin:0 0 8px;padding-left:20px;}
.ficha-pasos li{font-size:13px;margin-bottom:6px;line-height:1.4;}
.ficha-errores{margin:0 0 10px;padding-left:20px;}
.ficha-errores li{font-size:12.5px;margin-bottom:4px;line-height:1.35;color:#7A5B00;}
.ficha-video{margin-top:6px;display:inline-flex;}
.ficha-diagram{background:#F2F1EA;border-radius:8px;padding:6px;margin-bottom:10px;}
.grip-photos{display:flex;gap:6px;}
.grip-photos img{flex:1 1 0;min-width:0;width:100%;height:110px;object-fit:cover;border-radius:6px;border:1px solid #E4E1D6;display:block;}
.ficha-diagram svg{width:100%;height:auto;max-height:150px;display:block;}
@media print {
  header.app-header, nav.tabs, .no-print, footer.hint, .btn { display: none !important; }
  body::before, header.app-header::before { display: none !important; }
  main { padding: 0 !important; max-width: 100% !important; }
  .panel { box-shadow: none !important; border: 1px solid #ccc; page-break-inside: avoid; }
  .fichas-grid { display: block !important; }
  .ficha-card { border: 1px solid #999 !important; page-break-inside: avoid; margin-bottom: 14px; break-inside: avoid; }
  .ficha-video { display: none !important; }
  body { background: #fff !important; }
}

/* ===== Pantalla de fichaje ===== */
.fx-wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.fx-hero{position:relative;overflow:hidden;border-radius:22px;background:var(--court-dark);color:#fff;padding:22px 18px 26px;text-align:center;isolation:isolate;}
.fx-hero svg.fx-pista{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55;}
.fx-hola{font-size:15px;color:#C9D6E2;}
.fx-reloj{font-family:'Barlow Condensed',-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;font-size:92px;line-height:.95;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:6px 0 2px;}
.fx-reloj small{font-size:34px;font-weight:600;color:var(--gold);margin-left:4px;vertical-align:top;}
.fx-fecha{font-size:14px;color:#C9D6E2;}
.fx-estado{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;}
.fx-estado.dentro{background:var(--gold);color:var(--court-dark);}
.fx-turno{margin:16px auto 0;max-width:330px;text-align:left;}
.fx-turno-txt{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;color:#E6EDF3;}
.fx-barra{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:4px;}
.fx-barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--gold);}
.fx-barra b{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-sizing:border-box;}
.fx-turno-nota{font-size:13px;color:#C9D6E2;margin-top:14px;}
.fx-boton{margin:22px auto 0;width:156px;height:156px;border-radius:50%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Barlow Condensed',-apple-system,sans-serif;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .12s ease;}
.fx-boton:active{transform:scale(.96);}
.fx-boton:focus-visible{outline:3px solid #fff;outline-offset:4px;}
.fx-boton .fx-b1{font-size:34px;font-weight:700;letter-spacing:.5px;}
.fx-boton .fx-b2{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;font-weight:600;opacity:.75;}
.fx-boton.entrada{background:var(--gold);color:var(--court-dark);box-shadow:0 0 0 8px rgba(232,185,36,.22);}
.fx-boton.salida{background:#fff;color:var(--court-dark);box-shadow:0 0 0 8px rgba(255,255,255,.18);}
.fx-boton[disabled]{opacity:.7;cursor:default;}
.fx-boton.entrada::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--gold);animation:fxPulso 2.4s ease-out infinite;}
@keyframes fxPulso{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx-boton.entrada::after{animation:none;display:none}}
.fx-aviso{margin-top:16px;padding:10px 12px;border-radius:12px;font-size:14px;text-align:left;}
.fx-aviso.ok{background:#E4F3E9;color:#1E5B3C;animation:fxEntra .35s ease-out;}
.fx-aviso.mal{background:#FBE4E2;color:var(--danger);}
@keyframes fxEntra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fx-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
.fx-card h3{margin:0;font-size:16px;}
.fx-pad{padding:14px 16px;}
.fx-mapa{height:210px;background:#DDE5EC;position:relative;}
.fx-mapa-vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:14px;}
.fx-mapa-pie{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;}
.fx-punto{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;}
.fx-punto.ok{background:#2D9B5F;box-shadow:0 0 0 4px rgba(45,155,95,.18);}
.fx-punto.mal{background:var(--danger);}
.fx-yo{width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 2px var(--court-dark),0 2px 6px rgba(0,0,0,.35);}
.fx-semana{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.fx-semana .fx-num{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--court-dark);}
.fx-semana .fx-de{color:var(--muted);font-size:14px;}
.fx-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;}
.fx-dia{text-align:center;font-size:11px;color:var(--muted);}
.fx-dia span{display:block;height:34px;border-radius:6px;background:#EEF1F4;margin-bottom:3px;position:relative;overflow:hidden;}
.fx-dia span i{position:absolute;left:0;right:0;bottom:0;background:var(--court);}
.fx-dia.hoy{color:var(--court-dark);font-weight:700;}
.fx-dia.libre span{background:repeating-linear-gradient(45deg,#F3F4F6,#F3F4F6 4px,#E9ECEF 4px,#E9ECEF 8px);}
.fx-linea{list-style:none;margin:8px 0 0;padding:0;}
.fx-linea li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #EEF0F2;font-size:14px;}
.fx-linea li:first-child{border-top:0;}
.fx-linea .fx-ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
.fx-linea .fx-ico.entrada{background:#FBF1D2;color:#8A6400;}
.fx-linea .fx-ico.salida{background:#E3ECF3;color:var(--court);}
.fx-linea .fx-hora{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;min-width:52px;}
.fx-linea .fx-dia-txt{color:var(--muted);font-size:13px;margin-left:auto;text-align:right;}
.fx-pedir summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.fx-pedir summary::-webkit-details-marker{display:none;}
.fx-pedir summary::after{content:"+";font-size:22px;color:var(--court);font-weight:400;}
.fx-pedir[open] summary::after{content:"–";}
.fx-pedir .fx-pedir-cuerpo{padding:0 16px 14px;}
.fx-nota{font-size:12px;color:var(--muted);text-align:center;padding:0 10px 6px;}
/* Confirmación */
.fx-velo{position:fixed;inset:0;background:rgba(15,46,68,.55);z-index:9999;display:flex;align-items:flex-end;justify-content:center;}
.fx-hoja{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));animation:fxSube .22s ease-out;}
@keyframes fxSube{from{transform:translateY(100%)}to{transform:none}}
.fx-hoja h3{margin:0 0 4px;font-size:20px;}
.fx-hoja .fx-hoja-hora{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:700;color:var(--court-dark);}
.fx-hoja .fx-alerta{background:#FFF4D6;color:#6B4E00;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px;font-weight:600;}
.fx-hoja .fx-acciones{display:flex;gap:10px;margin-top:16px;}
.fx-hoja .fx-acciones button{flex:1;padding:15px;border-radius:14px;font-size:16px;font-weight:700;border:0;cursor:pointer;}
.fx-hoja .fx-si{background:var(--court-dark);color:#fff;}
.fx-hoja .fx-no{background:#EEF1F4;color:var(--ink);}

<script>
window.TorneoApp = (function () {
const MODALIDADES_DEF = [
  { id: 'IM', name: 'Individual Masculino', kind: 'single' },
  { id: 'IF', name: 'Individual Femenino', kind: 'single' },
  { id: 'DM', name: 'Dobles Masculino', kind: 'double' },
  { id: 'DF', name: 'Dobles Femenino', kind: 'double' },
  { id: 'DX', name: 'Dobles Mixto', kind: 'double' },
];
const EDADES_DEF = [
  { id: 'sub9', name: 'Sub9' },
  { id: 'sub11', name: 'Sub11' },
  { id: 'sub13', name: 'Sub13' },
  { id: 'sub15', name: 'Sub15' },
  { id: 'sub17', name: 'Sub17' },
  { id: 'sub19', name: 'Sub19' },
  { id: 'absoluto', name: 'Absoluto/Sénior' },
];
const NIVELES_DEF = [
  { id: 'catA', name: 'Categoría A' },
  { id: 'catB', name: 'Categoría B' },
  { id: 'catC', name: 'Categoría C' },
];
const SENIOR_DEF = [
  { id: 'sr35', name: 'Senior 35+', minEdad: 35 },
  { id: 'sr40', name: 'Senior 40+', minEdad: 40 },
  { id: 'sr45', name: 'Senior 45+', minEdad: 45 },
  { id: 'sr50', name: 'Senior 50+', minEdad: 50 },
  { id: 'sr55', name: 'Senior 55+', minEdad: 55 },
  { id: 'sr60', name: 'Senior 60+', minEdad: 60 },
  { id: 'sr65', name: 'Senior 65+', minEdad: 65 },
  { id: 'sr70', name: 'Senior 70+', minEdad: 70 },
];
const CATEGORY_DEFS = [];
MODALIDADES_DEF.forEach(mod => {
  EDADES_DEF.forEach(edad => {
    CATEGORY_DEFS.push({ id: mod.id + '_' + edad.id, name: mod.name + ' ' + edad.name, kind: mod.kind, modalidadId: mod.id, edadId: edad.id, nivelTipo: 'edad' });
  });
  NIVELES_DEF.forEach(niv => {
    CATEGORY_DEFS.push({ id: mod.id + '_' + niv.id, name: mod.name + ' ' + niv.name, kind: mod.kind, modalidadId: mod.id, edadId: niv.id, nivelTipo: 'nivel' });
  });
  SENIOR_DEF.forEach(sr => {
    CATEGORY_DEFS.push({ id: mod.id + '_' + sr.id, name: mod.name + ' ' + sr.name, kind: mod.kind, modalidadId: mod.id, edadId: sr.id, nivelTipo: 'senior' });
  });
});

function defaultCategoryState(def) {
  return {
    id: def.id,
    name: def.name,
    kind: def.kind,
    modalidadId: def.modalidadId,
    edadId: def.edadId,
    nivelTipo: def.nivelTipo,
    enabled: false,
    numGroups: 2,
    qualifiersPerGroup: 2,
    eliminatoriaDirecta: false,
    players: [],
    groups: null,
    matches: [],
    knockout: null,
  };
}

function loadState() {
  return {
    meta: { title: '', date: '' },
    config: {
      courts: 4,
      matchMinutes: 25,
      bufferMinutes: 5,
      restMinutes: 10,
      startTime: '09:00',
    },
    categories: CATEGORY_DEFS.map(defaultCategoryState),
  };
}
function normalizarCategorias(st) {
  if (!st) return st;
  if (!st.categories || !Array.isArray(st.categories)) { st.categories = CATEGORY_DEFS.map(defaultCategoryState); return st; }
  const existentesPorId = {};
  st.categories.forEach(c => { if (c && c.id) existentesPorId[c.id] = c; });
  ['IM', 'IF', 'DM', 'DF', 'DX'].forEach(idAntiguo => {
    const vieja = existentesPorId[idAntiguo];
    const idNueva = idAntiguo + '_absoluto';
    if (vieja && !existentesPorId[idNueva]) {
      const def = CATEGORY_DEFS.find(d => d.id === idNueva);
      if (def) existentesPorId[idNueva] = Object.assign({}, vieja, { id: idNueva, name: def.name, modalidadId: def.modalidadId, edadId: def.edadId, nivelTipo: def.nivelTipo });
    }
  });
  st.categories = CATEGORY_DEFS.map(def => existentesPorId[def.id] || defaultCategoryState(def));
  if (!st.config) st.config = { courts: 4, matchMinutes: 25, bufferMinutes: 5, restMinutes: 10, startTime: '09:00' };
  if (st.config.restMinutes == null) st.config.restMinutes = 10;
  if (!st.meta) st.meta = { title: '', date: '' };
  return st;
}

let state = loadState();
let activeTab = 'config';
let uidCounter = 1;
function uid(prefix) { return prefix + '_' + (uidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }

function getCategory(catId) { return state.categories.find(c => c.id === catId); }
function fmtFechaDMY(s) {
  if (!s) return '—';
  const partes = String(s).slice(0, 10).split('-');
  if (partes.length !== 3) return s;
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}
function nombreCompletoJ(j) {
  if (!j) return '';
  const apellidos = (j.apellido1 || j.apellido2) ? ((j.apellido1 || '') + ' ' + (j.apellido2 || '')).trim() : (j.apellidos || '');
  return (j.nombre + ' ' + apellidos).trim();
}
function fechaISOaDDMMAAAA(iso) {
  const s = String(iso || '').trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : s;
}
function fechaDDMMAAAAaISO(valor) {
  if (valor === null || valor === undefined || valor === '') return '';
  // Ya viene como objeto Date (Excel a veces lo entrega así si la celda tiene formato fecha)
  if (valor instanceof Date && !isNaN(valor)) {
    return valor.getFullYear() + '-' + String(valor.getMonth() + 1).padStart(2, '0') + '-' + String(valor.getDate()).padStart(2, '0');
  }
  const s = String(valor).trim();
  // Ya viene en AAAA-MM-DD (por si usan una plantilla antigua, o lo escriben así igualmente)
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  // Formato esperado DD/MM/AAAA (o con guiones DD-MM-AAAA)
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  // Numero de serie de Excel (celda formateada como fecha y leida como numero)
  if (/^\d+(\.\d+)?$/.test(s)) {
    const d = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
    if (!isNaN(d)) return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  return s;
}
function generarPlantillaExcelExterno() {
  if (typeof XLSX === 'undefined') { alert('No se ha podido cargar el generador de Excel. Comprueba tu conexión a internet e inténtalo de nuevo.'); return; }
  const datos = [
    ['Modalidad', 'Sistema de categoría', 'Nombre', 'Apellidos', 'Fecha nacimiento (DD/MM/AAAA)', 'Sexo (M/F)', 'Club', 'Teléfono', 'Email', 'Nombre pareja (solo dobles)', 'Apellidos pareja (solo dobles)', 'Fecha nacimiento pareja (solo dobles)', 'Sexo pareja (solo dobles)'],
    ['Individual Masculino', 'Por edad', 'Juan', 'Pérez López', '10/04/2013', 'M', 'CB Ejemplo', '600111222', 'juan@ejemplo.com', '', '', '', ''],
    ['Dobles Mixto', 'Por edad', 'Ana', 'García Ruiz', '20/02/1998', 'F', 'CB Ejemplo', '600333444', 'ana@ejemplo.com', 'Luis', 'Martín Soto', '05/11/1996', 'M'],
    ['Individual Masculino', 'Categoría A', 'Pedro', 'Ruiz Gómez', '01/01/1990', 'M', 'CB Ejemplo', '600555666', 'pedro@ejemplo.com', '', '', '', ''],
    ['Individual Femenino', 'Categoría C', 'Marta', 'Soto Díaz', '15/06/1985', 'F', 'CB Ejemplo', '600777888', 'marta@ejemplo.com', '', '', '', ''],
  ];
  const ws = XLSX.utils.aoa_to_sheet(datos);
  ws['!cols'] = [{ wch: 20 }, { wch: 16 }, { wch: 14 }, { wch: 18 }, { wch: 24 }, { wch: 12 }, { wch: 20 }, { wch: 14 }, { wch: 22 }, { wch: 20 }, { wch: 20 }, { wch: 26 }, { wch: 14 }];
  const instrucciones = XLSX.utils.aoa_to_sheet([
    ['Instrucciones para rellenar esta plantilla'],
    [''],
    ['1. Una fila por jugador (o por pareja, en categorías de dobles).'],
    ['2. En "Modalidad" escribe exactamente uno de estos nombres:'],
    ['   Individual Masculino / Individual Femenino / Dobles Masculino / Dobles Femenino / Dobles Mixto'],
    ['3. En "Sistema de categoría" escribe exactamente uno de estos:'],
    ['   Por edad   (la app calcula sola la categoría de edad exacta a partir de la fecha de nacimiento)'],
    ['   Categoría A'],
    ['   Categoría B'],
    ['   Categoría C'],
    ['4. La fecha de nacimiento es MUY IMPORTANTE si el sistema es "Por edad": sin ella no se puede calcular la categoría correcta. Formato DD/MM/AAAA, por ejemplo 10/04/2013.'],
    ['5. En categorías de dobles, rellena también los datos de la pareja en la misma fila.'],
    ['6. Teléfono y email son opcionales, pero si los rellenas quedan guardados en la ficha del participante, sin tener que volver a teclearlos después.'],
    ['7. Borra las filas de ejemplo de la hoja "Participantes" antes de enviarnos el archivo.'],
    ['8. No cambies los nombres de las columnas ni el nombre de la hoja "Participantes".'],
  ]);
  instrucciones['!cols'] = [{ wch: 90 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, instrucciones, 'Instrucciones');
  XLSX.utils.book_append_sheet(wb, ws, 'Participantes');
  const nombreArchivo = 'plantilla_participantes_' + (clubGlobal.nombre || 'torneo').replace(/[^a-z0-9]+/gi, '_').toLowerCase() + '.xlsx';
  XLSX.writeFile(wb, nombreArchivo);
}
function resolverCategoriaExterna(modalidadTexto, sistemaTexto, fechaNacimiento) {
  const modalidad = String(modalidadTexto || '').trim().toLowerCase();
  const sistema = String(sistemaTexto || 'por edad').trim().toLowerCase();
  const modDef = MODALIDADES_DEF.find(m => m.name.toLowerCase() === modalidad);
  if (!modDef) return null;
  if (sistema === 'categoría a' || sistema === 'categoria a') return getCategory(modDef.id + '_catA');
  if (sistema === 'categoría b' || sistema === 'categoria b') return getCategory(modDef.id + '_catB');
  if (sistema === 'categoría c' || sistema === 'categoria c') return getCategory(modDef.id + '_catC');
  const edadId = window.calcularCategoria ? window.calcularCategoria(fechaNacimiento) : '';
  return edadId ? getCategory(modDef.id + '_' + edadId) : null;
}
function importarParticipantesExternos(file) {
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('No se ha podido cargar el lector de Excel. Comprueba tu conexión a internet e inténtalo de nuevo.'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheetName = workbook.SheetNames.find(n => n.toLowerCase().includes('particip')) || workbook.SheetNames[workbook.SheetNames.length - 1];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      let anadidos = 0, saltados = 0;
      const motivos = [];
      rows.forEach((row, idx) => {
        const modalidadTexto = row['Modalidad'] || '';
        const sistemaTexto = row['Sistema de categoría'] || row['Sistema de categoria'] || 'Por edad';
        const fechaNacimiento = fechaDDMMAAAAaISO(row['Fecha nacimiento (DD/MM/AAAA)'] !== undefined && row['Fecha nacimiento (DD/MM/AAAA)'] !== '' ? row['Fecha nacimiento (DD/MM/AAAA)'] : (row['Fecha nacimiento (AAAA-MM-DD)'] || row['Fecha nacimiento'] || ''));
        const nombre = String(row['Nombre'] || '').trim();
        const apellidos = String(row['Apellidos'] || '').trim();
        const sexo = String(row['Sexo (M/F)'] || row['Sexo'] || '').trim().toUpperCase();
        const club = String(row['Club'] || '').trim() || 'Independiente';
        const telefono = String(row['Teléfono'] || '').trim();
        const email = String(row['Email'] || '').trim();
        if (!nombre) { saltados++; return; }
        const cat = resolverCategoriaExterna(modalidadTexto, sistemaTexto, fechaNacimiento);
        if (!cat) { saltados++; motivos.push('Fila ' + (idx + 2) + ': categoría no reconocida (revisa Modalidad, Sistema y fecha de nacimiento).'); return; }
        if (!cat.enabled) cat.enabled = true;
        const nombreCompleto = (nombre + ' ' + apellidos).trim();
        upsertJugadorExterno({ nombre: nombreCompleto, club, fechaNacimiento, sexo, telefono, email });
        if (cat.kind === 'double') {
          const nombrePareja = String(row['Nombre pareja (solo dobles)'] || row['Nombre pareja'] || '').trim();
          const apellidosPareja = String(row['Apellidos pareja (solo dobles)'] || row['Apellidos pareja'] || '').trim();
          const fechaNacimientoPareja = fechaDDMMAAAAaISO(row['Fecha nacimiento pareja (solo dobles)'] || row['Fecha nacimiento pareja'] || '');
          const sexoPareja = String(row['Sexo pareja (solo dobles)'] || row['Sexo pareja'] || '').trim().toUpperCase();
          if (!nombrePareja) { saltados++; motivos.push('Fila ' + (idx + 2) + ': falta el nombre de la pareja (categoría de dobles).'); return; }
          const nombreParejaCompleto = (nombrePareja + ' ' + apellidosPareja).trim();
          upsertJugadorExterno({ nombre: nombreParejaCompleto, club, fechaNacimiento: fechaNacimientoPareja, sexo: sexoPareja });
          const nombreFinal = nombreCompleto + ' / ' + nombreParejaCompleto;
          if (cat.players.some(p => p.name === nombreFinal)) { saltados++; return; }
          cat.players.push({
            id: uid('pl'), name: nombreFinal, seed: false, club, externo: true,
            telefono, email, fechaNacimiento, sexo,
            parejaFechaNacimiento: fechaNacimientoPareja, parejaSexo: sexoPareja,
          });
        } else {
          if (cat.players.some(p => p.name === nombreCompleto)) { saltados++; return; }
          cat.players.push({ id: uid('pl'), name: nombreCompleto, seed: false, club, externo: true, telefono, email, fechaNacimiento, sexo });
        }
        anadidos++;
      });
      saveLocal();
      render();
      let msg = 'Importación completada.\n\nAñadidos: ' + anadidos + '\nSaltados: ' + saltados;
      if (motivos.length) msg += '\n\n' + motivos.slice(0, 8).join('\n');
      alert(msg);
    } catch (err) {
      alert('No se ha podido leer el archivo. Asegúrate de usar la plantilla generada por la app (botón "Generar plantilla").\n\nDetalle: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
function jugadoresDestacadosHistoricos(catId) {
  const destacados = new Set();
  if (!torneosHistorial || !torneosHistorial.length) return destacados;
  const candidatos = torneosHistorial
    .filter(t => t.snapshot && t.snapshot.categories)
    .slice()
    .sort((a, b) => (b.fechaFin || '').localeCompare(a.fechaFin || ''));
  for (const t of candidatos) {
    const cat = t.snapshot.categories.find(c => c.id === catId);
    if (!cat || !cat.players || !cat.players.length) continue;
    cat.players.forEach(p => {
      if (p.seed) {
        if (p.jugadorId) destacados.add(p.jugadorId);
        if (p.jugador1Id) destacados.add(p.jugador1Id);
        if (p.jugador2Id) destacados.add(p.jugador2Id);
      }
    });
    if (cat.knockout && cat.knockout.rounds && cat.knockout.rounds.length) {
      const ultimaRonda = cat.knockout.rounds[cat.knockout.rounds.length - 1];
      const final = ultimaRonda && ultimaRonda[0];
      if (final && final.winner) {
        const ganador = cat.players.find(p => p.id === final.winner);
        if (ganador) {
          if (ganador.jugadorId) destacados.add(ganador.jugadorId);
          if (ganador.jugador1Id) destacados.add(ganador.jugador1Id);
          if (ganador.jugador2Id) destacados.add(ganador.jugador2Id);
        }
      }
    }
    if (destacados.size) break;
  }
  return destacados;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normName(n) { return (n || '').trim().toLowerCase(); }
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minutesToTime(mins) {
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function playerName(cat, playerId) {
  if (playerId === 'BYE') return 'Exento';
  if (!playerId) return '—';
  const p = cat.players.find(p => p.id === playerId);
  return p ? p.name : '—';
}

function drawGroups(catId) {
  const cat = getCategory(catId);
  if (!cat) return;
  const numGroups = Math.max(1, cat.numGroups);
  const groups = Array.from({ length: numGroups }, (_, i) => ({
    name: 'Grupo ' + String.fromCharCode(65 + i),
    playerIds: [],
  }));

  const seeds = cat.players.filter(p => p.seed);
  const rest = shuffle(cat.players.filter(p => !p.seed));

  seeds.forEach((p, idx) => {
    groups[idx % numGroups].playerIds.push(p.id);
  });
  let dir = 1, g = 0;
  rest.forEach((p) => {
    groups[g].playerIds.push(p.id);
    g += dir;
    if (g >= numGroups) { g = numGroups - 1; dir = -1; }
    else if (g < 0) { g = 0; dir = 1; }
  });

  cat.groups = groups;
  cat.matches = generateGroupMatches(cat);
  cat.knockout = null;
}

function sortearEliminatoriaDirecta(catId) {
  const cat = getCategory(catId);
  if (!cat) return;
  const seeds = cat.players.filter(p => p.seed);
  const rest = shuffle(cat.players.filter(p => !p.seed));
  const qualifiers = seeds.map(p => p.id).concat(rest.map(p => p.id));

  const size = nextPow2(qualifiers.length);
  const withByes = qualifiers.slice();
  while (withByes.length < size) withByes.push('BYE');

  const round1 = [];
  for (let i = 0; i < size / 2; i++) {
    round1.push({
      id: uid('ko'), categoryId: cat.id, phase: 'ko', round: roundName(size),
      p1: withByes[i], p2: withByes[size - 1 - i], sets: [], winner: null, court: null, time: null,
    });
  }
  round1.forEach(m => {
    if (m.p1 === 'BYE' && m.p2 !== 'BYE') m.winner = m.p2;
    else if (m.p2 === 'BYE' && m.p1 !== 'BYE') m.winner = m.p1;
  });

  const rounds = [round1];
  let currentSize = size / 2;
  while (currentSize > 1) {
    const nextRound = [];
    for (let i = 0; i < currentSize / 2; i++) {
      nextRound.push({
        id: uid('ko'), categoryId: cat.id, phase: 'ko', round: roundName(currentSize / 2 === 0 ? 2 : currentSize),
        p1: null, p2: null, sets: [], winner: null, court: null, time: null,
        fromMatch1: rounds[rounds.length - 1][i * 2].id,
        fromMatch2: rounds[rounds.length - 1][i * 2 + 1].id,
      });
    }
    rounds.push(nextRound);
    currentSize = currentSize / 2;
  }
  rounds.forEach((round, idx) => {
    const roundSize = size / Math.pow(2, idx);
    round.forEach(m => { m.round = roundName(roundSize); });
  });

  cat.groups = null;
  cat.matches = [];
  cat.knockout = { rounds };
  propagateKnockout(cat);
}
function generateGroupMatches(cat) {
  const matches = [];
  cat.groups.forEach((grp, gIdx) => {
    const ids = grp.playerIds;
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        matches.push({
          id: uid('gm'),
          categoryId: cat.id,
          phase: 'group',
          groupIndex: gIdx,
          p1: ids[i],
          p2: ids[j],
          sets: [],
          winner: null,
          court: null,
          time: null,
        });
      }
    }
  });
  return matches;
}

function buildSchedule() {
  const numCourts = Math.max(1, state.config.courts);
  const duracionPartido = Math.max(5, state.config.matchMinutes);
  const descansoPista = Math.max(0, state.config.bufferMinutes);
  const descansoJugador = Math.max(0, state.config.restMinutes != null ? state.config.restMinutes : 10);
  const startMin = timeToMinutes(state.config.startTime || '09:00');

  enabledCategories().forEach(cat => {
    (cat.matches || []).forEach(m => { m.court = null; m.time = null; });
    if (cat.knockout) {
      cat.knockout.rounds.forEach(round => round.forEach(m => { m.court = null; m.time = null; }));
    }
  });

  const streams = [];
  enabledCategories().forEach(cat => {
    const porGrupo = {};
    (cat.matches || []).forEach(m => {
      const g = m.groupIndex != null ? m.groupIndex : 0;
      if (!porGrupo[g]) porGrupo[g] = [];
      porGrupo[g].push(m);
    });
    Object.keys(porGrupo).forEach(g => {
      streams.push({ cat, partidos: shuffle(porGrupo[g]) });
    });
  });
  const groupQueue = [];
  const maxLen = Math.max.apply(null, [0].concat(streams.map(s => s.partidos.length)));
  for (let i = 0; i < maxLen; i++) {
    shuffle(streams).forEach(s => {
      if (s.partidos[i]) groupQueue.push({ cat: s.cat, match: s.partidos[i] });
    });
  }

  const koQueue = [];
  shuffle(enabledCategories()).forEach(cat => {
    if (cat.knockout) {
      cat.knockout.rounds.forEach(round => {
        shuffle(round).forEach(m => {
          if (m.p1 && m.p2 && m.p1 !== 'BYE' && m.p2 !== 'BYE') koQueue.push({ cat, match: m });
        });
      });
    }
  });

  const pistaLibreEn = new Array(numCourts).fill(0);
  const jugadorLibreEn = {};

  function inicioPosible(item) {
    const n1 = normName(playerName(item.cat, item.match.p1));
    const n2 = normName(playerName(item.cat, item.match.p2));
    const minimoJugadores = Math.max(jugadorLibreEn[n1] || 0, jugadorLibreEn[n2] || 0);
    let mejorInicio = Infinity, mejorPista = 0;
    for (let c = 0; c < numCourts; c++) {
      const inicio = Math.max(pistaLibreEn[c], minimoJugadores);
      if (inicio < mejorInicio) { mejorInicio = inicio; mejorPista = c; }
    }
    return { inicio: mejorInicio, pista: mejorPista, n1, n2 };
  }
  function programarLote(cola) {
    const restantes = cola.slice();
    while (restantes.length) {
      let mejorInicioGlobal = Infinity;
      const evaluaciones = restantes.map(item => inicioPosible(item));
      evaluaciones.forEach(ev => { if (ev.inicio < mejorInicioGlobal) mejorInicioGlobal = ev.inicio; });
      const candidatas = [];
      evaluaciones.forEach((ev, idx) => {
        if (ev.inicio !== mejorInicioGlobal) return;
        for (let c = 0; c < numCourts; c++) {
          const item = restantes[idx];
          const inicioEnEstaPista = Math.max(pistaLibreEn[c], Math.max(jugadorLibreEn[ev.n1] || 0, jugadorLibreEn[ev.n2] || 0));
          if (inicioEnEstaPista === mejorInicioGlobal) candidatas.push({ idx, c });
        }
      });
      const elegido = candidatas[Math.floor(Math.random() * candidatas.length)];
      const item = restantes[elegido.idx];
      const ev = evaluaciones[elegido.idx];
      item.match.court = elegido.c + 1;
      item.match.time = minutesToTime(startMin + mejorInicioGlobal);
      pistaLibreEn[elegido.c] = mejorInicioGlobal + duracionPartido + descansoPista;
      jugadorLibreEn[ev.n1] = mejorInicioGlobal + duracionPartido + descansoJugador;
      jugadorLibreEn[ev.n2] = mejorInicioGlobal + duracionPartido + descansoJugador;
      restantes.splice(elegido.idx, 1);
    }
  }

  programarLote(groupQueue);

  if (koQueue.length) {
    if (groupQueue.length) {
      const finGrupos = Math.max.apply(null, pistaLibreEn);
      for (let c = 0; c < numCourts; c++) { if (pistaLibreEn[c] < finGrupos) pistaLibreEn[c] = finGrupos; }
    }
    programarLote(koQueue);
  }
}

function setWinnerFromSets(match) {
  let w1 = 0, w2 = 0;
  match.sets.forEach(s => {
    if (s[0] > s[1]) w1++;
    else if (s[1] > s[0]) w2++;
  });
  if (w1 === w2) { match.winner = null; return; }
  match.winner = w1 > w2 ? match.p1 : match.p2;
}

function computeStandings(cat, groupIndex) {
  const grp = cat.groups[groupIndex];
  const table = {};
  grp.playerIds.forEach(id => {
    table[id] = { id, PJ: 0, PG: 0, PP: 0, SF: 0, SC: 0, GF: 0, GC: 0, Pts: 0 };
  });
  cat.matches.filter(m => m.groupIndex === groupIndex && m.winner).forEach(m => {
    const r1 = table[m.p1], r2 = table[m.p2];
    if (!r1 || !r2) return;
    let s1 = 0, s2 = 0;
    m.sets.forEach(s => {
      r1.GF += s[0]; r1.GC += s[1];
      r2.GF += s[1]; r2.GC += s[0];
      if (s[0] > s[1]) s1++; else if (s[1] > s[0]) s2++;
    });
    r1.PJ++; r2.PJ++;
    r1.SF += s1; r1.SC += s2;
    r2.SF += s2; r2.SC += s1;
    if (m.winner === m.p1) { r1.PG++; r2.PP++; } else { r2.PG++; r1.PP++; }
    r1.Pts = r1.PG * 2 + r1.PP * 0;
    r2.Pts = r2.PG * 2 + r2.PP * 0;
  });

  const rows = Object.values(table).map(r => {
    const copy = {};
    for (const k in r) copy[k] = r[k];
    copy.name = playerName(cat, r.id);
    copy.diffSets = r.SF - r.SC;
    copy.diffGames = r.GF - r.GC;
    return copy;
  });
  rows.sort((a, b) => (b.Pts - a.Pts) || (b.diffSets - a.diffSets) || (b.diffGames - a.diffGames) || a.name.localeCompare(b.name));
  return rows;
}

function groupStageComplete(cat) {
  return cat.matches.length > 0 && cat.matches.every(m => m.winner);
}

function roundName(size) {
  if (size === 2) return 'Final';
  if (size === 4) return 'Semifinales';
  if (size === 8) return 'Cuartos de Final';
  if (size === 16) return 'Octavos de Final';
  if (size === 32) return 'Dieciseisavos de Final';
  return 'Ronda de ' + size;
}
function nextPow2(n) { let p = 1; while (p < n) p *= 2; return p; }

function buildKnockout(catId) {
  const cat = getCategory(catId);
  if (!cat || !cat.groups) return;

  const q = Math.max(1, cat.qualifiersPerGroup);
  const standingsByGroup = cat.groups.map((g, i) => computeStandings(cat, i));

  let qualifiers = [];
  if (q === 1) {
    qualifiers = standingsByGroup.map(s => s[0] && s[0].id).filter(Boolean);
  } else {
    for (let pos = 0; pos < q; pos++) {
      const ranked = standingsByGroup.map(s => s[pos] && s[pos].id).filter(Boolean);
      ranked.forEach(function(x){ qualifiers.push(x); });
    }
    const byPos = [];
    for (let pos = 0; pos < q; pos++) {
      const block = standingsByGroup.map(s => s[pos] && s[pos].id).filter(Boolean);
      if (pos % 2 === 1) block.reverse();
      byPos.push(block);
    }
    qualifiers = [];
    const numGroups = cat.groups.length;
    for (let i = 0; i < numGroups; i++) {
      for (let pos = 0; pos < q; pos++) {
        if (byPos[pos][i]) qualifiers.push(byPos[pos][i]);
      }
    }
  }

  const size = nextPow2(qualifiers.length);
  const withByes = qualifiers.slice();
  while (withByes.length < size) withByes.push('BYE');

  const round1 = [];
  for (let i = 0; i < size / 2; i++) {
    round1.push({
      id: uid('ko'),
      categoryId: cat.id,
      phase: 'ko',
      round: roundName(size),
      p1: withByes[i],
      p2: withByes[size - 1 - i],
      sets: [],
      winner: null,
      court: null,
      time: null,
    });
  }
  round1.forEach(m => {
    if (m.p1 === 'BYE' && m.p2 !== 'BYE') m.winner = m.p2;
    else if (m.p2 === 'BYE' && m.p1 !== 'BYE') m.winner = m.p1;
  });

  const rounds = [round1];
  let currentSize = size / 2;
  while (currentSize > 1) {
    const nextRound = [];
    for (let i = 0; i < currentSize / 2; i++) {
      nextRound.push({
        id: uid('ko'),
        categoryId: cat.id,
        phase: 'ko',
        round: roundName(currentSize / 2 === 0 ? 2 : currentSize),
        p1: null, p2: null, sets: [], winner: null, court: null, time: null,
        fromMatch1: rounds[rounds.length - 1][i * 2].id,
        fromMatch2: rounds[rounds.length - 1][i * 2 + 1].id,
      });
    }
    rounds.push(nextRound);
    currentSize = currentSize / 2;
  }
  rounds.forEach((round, idx) => {
    const roundSize = size / Math.pow(2, idx);
    round.forEach(m => { m.round = roundName(roundSize); });
  });

  cat.knockout = { rounds };
  propagateKnockout(cat);
}

function propagateKnockout(cat) {
  if (!cat.knockout) return;
  const { rounds } = cat.knockout;
  for (let r = 1; r < rounds.length; r++) {
    rounds[r].forEach(m => {
      const src1 = rounds[r - 1].find(x => x.id === m.fromMatch1);
      const src2 = rounds[r - 1].find(x => x.id === m.fromMatch2);
      m.p1 = src1 && src1.winner ? src1.winner : null;
      m.p2 = src2 && src2.winner ? src2.winner : null;
    });
  }
}

function categoryStats(cat) {
  const stats = {};
  cat.players.forEach(p => { stats[p.id] = { id: p.id, name: p.name, PJ: 0, PG: 0, PP: 0, SF: 0, SC: 0, GF: 0, GC: 0 }; });
  const allMatches = cat.matches.concat(cat.knockout ? cat.knockout.rounds.flat() : []);
  allMatches.forEach(m => {
    if (!m.winner || m.p1 === 'BYE' || m.p2 === 'BYE') return;
    const r1 = stats[m.p1], r2 = stats[m.p2];
    if (!r1 || !r2) return;
    let s1 = 0, s2 = 0, g1 = 0, g2 = 0;
    m.sets.forEach(s => {
      g1 += s[0]; g2 += s[1];
      if (s[0] > s[1]) s1++; else if (s[1] > s[0]) s2++;
    });
    r1.PJ++; r2.PJ++;
    r1.SF += s1; r1.SC += s2; r2.SF += s2; r2.SC += s1;
    r1.GF += g1; r1.GC += g2; r2.GF += g2; r2.GC += g1;
    if (m.winner === m.p1) { r1.PG++; r2.PP++; } else { r2.PG++; r1.PP++; }
  });
  return Object.values(stats).sort((a, b) => b.PG - a.PG || (b.SF - b.SC) - (a.SF - a.SC));
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  const children = Array.prototype.slice.call(arguments, 2);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

function contarPartidosEstimados(cat) {
  const n = cat.players.length;
  if (n < 2) return 0;
  if (cat.eliminatoriaDirecta) return Math.max(0, n - 1);
  const numGrupos = Math.max(1, cat.numGroups || 1);
  const base = Math.floor(n / numGrupos);
  const resto = n % numGrupos;
  let totalGroupMatches = 0, clasificados = 0;
  for (let i = 0; i < numGrupos; i++) {
    const size = base + (i < resto ? 1 : 0);
    if (size >= 2) totalGroupMatches += size * (size - 1) / 2;
    clasificados += Math.min(cat.qualifiersPerGroup || 2, size);
  }
  const partidosKO = Math.max(0, clasificados - 1);
  return totalGroupMatches + partidosKO;
}
function estimarDuracionTotal(nParticipantes, numGrupos, qualifiersPerGroup, courts, matchMinutes, partidosOtrasCategorias) {
  if (numGrupos < 1 || nParticipantes < 2) return null;
  const base = Math.floor(nParticipantes / numGrupos);
  const resto = nParticipantes % numGrupos;
  let totalGroupMatches = 0;
  let clasificados = 0;
  for (let i = 0; i < numGrupos; i++) {
    const size = base + (i < resto ? 1 : 0);
    if (size < 3) return null;
    totalGroupMatches += size * (size - 1) / 2;
    clasificados += Math.min(qualifiersPerGroup, size);
  }
  const partidosKO = Math.max(0, clasificados - 1);
  const totalPartidos = totalGroupMatches + partidosKO;
  const totalConOtras = totalPartidos + (partidosOtrasCategorias || 0);
  const minutosMinimos = Math.ceil(totalConOtras / Math.max(1, courts)) * Math.max(5, matchMinutes);
  return { totalPartidos, minutosMinimos, totalGroupMatches, partidosKO, clasificados };
}
function mejorNumGruposPara(cat, partidosOtras) {
  const n = cat.players.length;
  let mejor = null;
  const maxGrupos = Math.min(Math.floor(n / 3), 16);
  for (let g = 1; g <= maxGrupos; g++) {
    const est = estimarDuracionTotal(n, g, cat.qualifiersPerGroup, state.config.courts, state.config.matchMinutes, partidosOtras);
    if (est && (!mejor || est.minutosMinimos < mejor.est.minutosMinimos)) mejor = { g, est };
  }
  return mejor;
}
function optimizarTodasLasCategorias() {
  const todas = enabledCategories();
  const optimizables = todas.filter(c => !c.eliminatoriaDirecta && c.players.length >= 6);
  const noOptimizables = todas.filter(c => !optimizables.includes(c));
  if (!optimizables.length) { alert('Ninguna categoría activa tiene al menos 6 participantes (mínimo 3 por grupo) para poder optimizar.'); return; }
  for (let pasada = 0; pasada < 3; pasada++) {
    optimizables.forEach(cat => {
      const partidosOtras = todas.filter(c => c.id !== cat.id).reduce((sum, c) => sum + contarPartidosEstimados(c), 0);
      const mejor = mejorNumGruposPara(cat, partidosOtras);
      if (mejor) cat.numGroups = mejor.g;
    });
  }
  render();
  const totalPartidos = todas.reduce((sum, c) => sum + contarPartidosEstimados(c), 0);
  const minutos = Math.ceil(totalPartidos / Math.max(1, state.config.courts)) * Math.max(5, state.config.matchMinutes);
  const inicioMin = timeToMinutes(state.config.startTime || '09:00');
  const horaFinAprox = minutesToTime(inicioMin + minutos);
  let msg = 'Optimizadas ' + optimizables.length + ' categoría(s):\n' +
    optimizables.map(c => '· ' + c.name + ' → ' + c.numGroups + ' grupo(s)').join('\n') + '\n\n' +
    'Partidos totales estimados del torneo: ' + totalPartidos + '\n' +
    'Duración mínima estimada: ' + minutos + ' min con ' + state.config.courts + ' pista(s).\n' +
    'Empezando a las ' + (state.config.startTime || '09:00') + ', terminaría aproximadamente a las ' + horaFinAprox + '.';
  if (noOptimizables.length) {
    msg += '\n\nSin optimizar (menos de 6 participantes o eliminatoria directa): ' + noOptimizables.map(c => c.name).join(', ');
  }
  alert(msg);
}
function optimizarNumGrupos(cat) {
  const n = cat.players.length;
  if (n < 6) { alert('Añade al menos 6 participantes para que merezca la pena optimizar el número de grupos.'); return; }
  const partidosOtras = enabledCategories().filter(c => c.id !== cat.id).reduce((sum, c) => sum + contarPartidosEstimados(c), 0);
  let mejor = null;
  const maxGrupos = Math.min(Math.floor(n / 3), 16);
  for (let g = 1; g <= maxGrupos; g++) {
    const est = estimarDuracionTotal(n, g, cat.qualifiersPerGroup, state.config.courts, state.config.matchMinutes, partidosOtras);
    if (est && (!mejor || est.minutosMinimos < mejor.est.minutosMinimos)) mejor = { g, est };
  }
  if (!mejor) { alert('No se ha podido calcular una combinación válida (hacen falta al menos 6 participantes, 3 por grupo como mínimo).'); return; }
  cat.numGroups = mejor.g;
  render();
  alert('Número de grupos optimizado a ' + mejor.g + ' (con al menos 3 jugadores por grupo, para que siga siendo un torneo real por grupos).\n\n' +
    'Partidos de esta categoría: ' + mejor.est.totalPartidos + ' (' + mejor.est.totalGroupMatches + ' de grupos + ' + mejor.est.partidosKO + ' de eliminatoria)\n' +
    (partidosOtras > 0 ? 'Partidos estimados de las demás categorías activas: ' + partidosOtras + ' (comparten las mismas pistas)\n' : '') +
    'Duración mínima estimada del torneo completo: ' + mejor.est.minutosMinimos + ' min, con ' + state.config.courts + ' pista(s) (sin contar los descansos entre partidos del mismo jugador, que pueden alargarlo algo más).');
}

      if (roster1.length >= 1 && roster2.length >= 1) {

              const seedAuto = seedCheck2.checked || destacadosPareja.has(j1.id) || destacadosPareja.has(j2.id);
              cat.players.push({ id: uid('pl'), name: nombreCompletoJ(j1) + ' / ' + nombreCompletoJ(j2), seed: seedAuto, jugador1Id: j1.id, jugador2Id: j2.id });

        panel.appendChild(el('div', { class: 'sub', style: 'margin-bottom:14px;' }, avisoSexo));

        class: 'btn btn-ghost',

      const seedCheck = seedLabel.querySelector('input');
      const addBtn = el('button', {
        class: 'btn btn-primary',
        onclick: () => {
          const val = nameInput.value.trim();

      addRow.appendChild(seedLabel);
      addRow.appendChild(addBtn);

      if (window.JugadoresGlobal) {
        const rosterCompletoInd = window.JugadoresGlobal.list().filter(j => !yaUsadosEnCategoria.has(j.id) && puedeApuntarseAMasCategorias(j.id) && (!state.config.soloFederados || j.federado));
        const candidatosBase = rosterCompletoInd.filter(j => (!catSexo || j.sexo === catSexo));
        const roster = candidatosBase.filter(j => edadOk(j));
        const sinFechaNacimiento = cat.nivelTipo === 'edad' ? candidatosBase.filter(j => !edadOk(j) && !j.fechaNacimiento) : [];
        const sinSexo = catSexo ? rosterCompletoInd.filter(j => !j.sexo) : [];
        if (roster.length) {
          const rosterRow = el('div', { class: 'row', style: 'margin-bottom:18px;padding:10px;background:#F5F3EB;border-radius:8px;' });

            roster.map(j => { const c2 = window.calcularCategoria ? window.calcularCategoria(j.fechaNacimiento) : ''; const catLabel = c2 && window.nombreCategoria ? window.nombreCategoria(c2) : ''; return el('option', { value: j.id }, j.nombre + (catLabel ? ' · ' + catLabel : '')); }));
          rosterRow.appendChild(el('span', { style: 'font-size:12px;font-weight:700;color:var(--court-dark);white-space:nowrap;' }, '👥 Desde Jugadores' + (catSexo ? ' (' + (catSexo === 'M' ? 'chicos' : 'chicas') + ')' : '') + (etiquetaEdad ? ' · ' + etiquetaEdad : '') + ':'));
          rosterRow.appendChild(rosterSelect);
          rosterRow.appendChild(el('button', {
            class: 'btn btn-ghost btn-sm',

        } else if (catSexo || etiquetaEdad) {

        }
        if (sinFechaNacimiento.length) {
          panel.appendChild(el('div', { class: 'msg msg-warn', style: 'margin-bottom:14px;' },
            `⚠️ ${sinFechaNacimiento.map(j => j.nombre).join(', ')} no aparece${sinFechaNacimiento.length > 1 ? 'n' : ''} aquí porque falta su fecha de nacimiento en su ficha (necesaria para saber su categoría de edad). Ve a Jugadores y complétala.`));
        }
        if (sinSexo.length) {
          panel.appendChild(el('div', { class: 'msg msg-warn', style: 'margin-bottom:14px;' },
            `⚠️ ${sinSexo.map(j => j.nombre).join(', ')} no aparece${sinSexo.length > 1 ? 'n' : ''} aquí porque falta el sexo en su ficha. Ve a Jugadores y complétalo.`));
        }
      }
    }

    if (!cat.players.length) {
      panel.appendChild(el('div', { class: 'empty-state' }, 'Todavía no hay participantes en esta categoría.'));
    } else {
      const hayContacto = cat.players.some(p => p.telefono || p.email);
      const table = el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, '#'), el('th', {}, 'Nombre'), el('th', {}, 'Club'), hayContacto ? el('th', {}, 'Contacto') : null, el('th', {}, 'Cabeza de serie'), el('th', {}, ''))),
      );
      const tbody = el('tbody');
      cat.players.forEach((p, i) => {
        tbody.appendChild(el('tr', { class: p.seed ? 'seed' : '' },

          el('td', {}, p.name),

          hayContacto ? el('td', {}, [p.telefono, p.email].filter(Boolean).join(' · ')) : null,
          el('td', {}, el('input', {
            type: 'checkbox', style: 'width:auto;', checked: p.seed ? 'checked' : null,
            onchange: (e) => { p.seed = e.target.checked; render(); },
          })),
          el('td', {}, el('button', {
            class: 'btn btn-danger btn-sm',

              cat.players = cat.players.filter(x => x.id !== p.id);
              if (cat.groups || (cat.knockout && cat.knockout.rounds && cat.knockout.rounds.length)) {
                if (!confirm('Este participante ya estaba en el sorteo o el cuadro. Al eliminarlo, se borra el sorteo/cuadro de esta categoría para evitar inconsistencias, y habrá que volver a sortear. ¿Continuar?')) {
                  cat.players.push(p);
                  return;
                }
                cat.groups = null;
                cat.matches = [];
                cat.knockout = null;
              }
              render();
            },
          }, 'Eliminar')),
        ));
      });
      table.appendChild(tbody);
      panel.appendChild(table);
      panel.appendChild(el('div', { class: 'sub', style: 'margin-top:10px;' },
        `Total: ${cat.players.length} · Cabezas de serie: ${cat.players.filter(p => p.seed).length} · Grupos configurados: ${cat.numGroups}`));
    }
  }
  wrap.appendChild(panel);

  const activasResumen = enabledCategories();
  if (activasResumen.length) {
    const personasPorClave = new Map();
    function marcarPersonaEnMapa(clave, club) {
      if (!personasPorClave.has(clave)) personasPorClave.set(clave, club || clubGlobal.nombre || 'Sin club');
    }
    function marcarPersona(catRef, p, nombreIndividual, jugadorIdIndividual) {
      const clave = jugadorIdIndividual ? ('id:' + jugadorIdIndividual) : (nombreIndividual.trim() + '|' + (p.club || '') + '|' + catRef.modalidadId).toLowerCase();
      marcarPersonaEnMapa(clave, p.club);
    }
    let totalIndividual = 0, totalDobles = 0, totalMixto = 0;
    const porCategoria = [];
    activasResumen.forEach(cat => {
      const n = cat.players.length;
      porCategoria.push({ nombre: cat.name, n });
      if (cat.kind === 'single') totalIndividual += n;
      else if (cat.modalidadId === 'DX') totalMixto += n;
      else totalDobles += n;
      cat.players.forEach(p => {
        if (cat.kind === 'double') {
          const nombres = p.name.includes(' / ') ? p.name.split(' / ') : [p.name, ''];
          const clave1 = p.jugador1Id ? ('id:' + p.jugador1Id) : (nombres[0].trim() + '|' + (p.club || '') + '|' + cat.modalidadId).toLowerCase();
          const clave2 = p.jugador2Id ? ('id:' + p.jugador2Id) : (nombres[1].trim() + '|' + (p.club || '') + '|' + cat.modalidadId).toLowerCase();
          marcarPersonaEnMapa(clave1, p.club);
          if (nombres[1]) marcarPersonaEnMapa(clave2, p.club);
        } else {
          marcarPersona(cat, p, p.name, p.jugadorId);
        }
      });
    });
    const totalPersonas = personasPorClave.size;
    const porClub = {};
    personasPorClave.forEach(club => { porClub[club] = (porClub[club] || 0) + 1; });
    const clubesOrdenados = Object.keys(porClub).sort((a, b) => porClub[b] - porClub[a]);
    const resumenPanel = el('div', { class: 'panel' },
      el('h2', {}, '📊 Resumen de participantes'),
      el('div', { class: 'sub' }, 'Recuento de inscripciones por categoría, y total de personas distintas jugando en el torneo (sin contar dos veces a quien juegue en varias categorías).'),
    );
    const tablaResumen = el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Categoría'), el('th', {}, 'Inscritos'))));
    const tbodyResumen = el('tbody');
    porCategoria.forEach(c => {
      tbodyResumen.appendChild(el('tr', {}, el('td', {}, c.nombre), el('td', {}, String(c.n))));
    });
    tablaResumen.appendChild(tbodyResumen);
    resumenPanel.appendChild(tablaResumen);
    resumenPanel.appendChild(el('div', { class: 'row', style: 'gap:8px;flex-wrap:wrap;margin-top:12px;' },
      el('span', { class: 'chip' }, 'Individuales: ' + totalIndividual),
      el('span', { class: 'chip' }, 'Parejas de dobles: ' + totalDobles),
      el('span', { class: 'chip' }, 'Parejas de mixto: ' + totalMixto),
      el('span', { class: 'chip chip-gold' }, '👥 Total de personas distintas: ' + totalPersonas),
    ));
    resumenPanel.appendChild(el('h3', { style: 'margin-top:16px;' }, '🏠 Por club'));
    const tablaClubes = el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Club'), el('th', {}, 'Jugadores'))));
    const tbodyClubes = el('tbody');
    clubesOrdenados.forEach(club => {
      tbodyClubes.appendChild(el('tr', {}, el('td', {}, club), el('td', {}, String(porClub[club]))));
    });
    tablaClubes.appendChild(tbodyClubes);
    resumenPanel.appendChild(tablaClubes);
    wrap.appendChild(resumenPanel);
  }

  return wrap;
}

function emptyPanel(title, sub) {
  return el('div', { class: 'panel' }, el('h2', {}, title), el('div', { class: 'sub' }, sub));
}

function viewDraw() {
  const wrap = document.createDocumentFragment();
  if (!enabledCategories().length) {
    wrap.appendChild(emptyPanel('No hay categorías activas', 'Activa categorías en Configuración y añade participantes antes de sortear los grupos.'));
    return wrap;
  }
  const panel = el('div', { class: 'panel' },
    el('h2', {}, 'Sorteo de grupos'),
    el('div', { class: 'sub' }, 'Reparte a los participantes en grupos, separando las cabezas de serie automáticamente.'),
    catSelector('draw')
  );
  const cat = getCategory(activeCatTab.draw);
  if (cat && cat.eliminatoriaDirecta) {
    const minNeeded = 2;
    if (cat.players.length < minNeeded) {
      panel.appendChild(el('div', { class: 'msg msg-warn' }, `Se necesitan al menos 2 participantes para formar el cuadro (hay ${cat.players.length}).`));
    }
    panel.appendChild(el('div', { class: 'sub', style: 'margin-bottom:10px;' }, 'Esta categoría está configurada como eliminatoria directa: todos los participantes entran directamente en el cuadro, sin fase de grupos previa.'));
    panel.appendChild(el('div', { class: 'toolbar' },
      el('button', {
        class: 'btn btn-gold',
        disabled: cat.players.length < minNeeded ? 'disabled' : null,
        onclick: () => { sortearEliminatoriaDirecta(cat.id); render(); },
      }, (cat.knockout && cat.knockout.rounds && cat.knockout.rounds.length) ? '🏆 Repetir sorteo del cuadro' : '🏆 Sortear cuadro directo'),
    ));
    if (cat.knockout && cat.knockout.rounds && cat.knockout.rounds.length) {
      panel.appendChild(el('div', { class: 'msg msg-warn' }, 'Cuadro creado. Ve a la pestaña "🏅 Eliminatoria" para verlo y anotar resultados.'));
    } else {
      panel.appendChild(el('div', { class: 'empty-state' }, 'Aún no se ha sorteado el cuadro de esta categoría.'));
    }
    wrap.appendChild(panel);
    return wrap;
  }
  if (cat) {
    const minNeeded = cat.numGroups * 2;
    if (cat.players.length < minNeeded) {
      panel.appendChild(el('div', { class: 'msg msg-warn' },
        `Se necesitan al menos ${minNeeded} participantes para formar ${cat.numGroups} grupo(s) (hay ${cat.players.length}). Añade más en la pestaña Participantes o reduce el nº de grupos en Configuración.`));
    }
    panel.appendChild(el('div', { class: 'toolbar' },
      el('button', {
        class: 'btn btn-gold',
        disabled: cat.players.length < minNeeded ? 'disabled' : null,
        onclick: () => { drawGroups(cat.id); render(); },
      }, cat.groups ? '🎲 Repetir sorteo' : '🎲 Realizar sorteo'),
    ));
    if (cat.groups) {
      const gg = el('div', { class: 'group-grid' });
      cat.groups.forEach(g => {
        const box = el('div', { class: 'group-box' }, el('h3', {}, g.name + ' · ' + g.playerIds.length + ' participantes'));
        const content = el('div', { class: 'content' });
        g.playerIds.forEach(id => {
          const p = cat.players.find(pl => pl.id === id);
          if (!p) return;
          content.appendChild(el('div', {}, p.name, p.seed ? el('span', { class: 'badge-seed' }, 'CS') : null));
        });
        box.appendChild(content);
        gg.appendChild(box);
      });
      panel.appendChild(gg);
    } else {
      panel.appendChild(el('div', { class: 'empty-state' }, 'Aún no se ha realizado el sorteo de esta categoría.'));
    }
  }
  wrap.appendChild(panel);
  return wrap;
}

function todosLosPartidosDelTorneo() {
  const lista = [];
  enabledCategories().forEach(cat => {
    (cat.matches || []).forEach(m => {
      const nombreGrupo = (cat.groups && cat.groups[m.groupIndex]) ? cat.groups[m.groupIndex].name : '';
      lista.push({ cat, m, ronda: nombreGrupo });
    });
    if (cat.knockout && cat.knockout.rounds) {
      cat.knockout.rounds.forEach(ronda => {
        const rondaLabel = (ronda[0] && ronda[0].round) ? ronda[0].round : '';
        ronda.forEach(m => { if (m.p1 && m.p2 && m.p1 !== 'BYE' && m.p2 !== 'BYE') lista.push({ cat, m, ronda: rondaLabel }); });
      });
    }
  });
  lista.sort((a, b) => String(a.m.time || '99:99').localeCompare(String(b.m.time || '99:99')) || ((a.m.court || 99) - (b.m.court || 99)));
  lista.forEach((item, i) => { item.numero = i + 1; });
  return lista;
}
function formatSetsActa(sets) {
  if (!sets || !sets.length) return '';
  return sets.filter(s => (s[0] || s[1])).map(s => s[0] + '-' + s[1]).join(', ');
}

function contactosDeParticipante(p) {
  const contactos = [];
  function resolverUno(jugadorId, nombreFallback, telFallback, emailFallback) {
    if (jugadorId && window.JugadoresGlobal) {
      const j = window.JugadoresGlobal.list().find(x => x.id === jugadorId);
      if (j) { contactos.push({ nombre: (j.nombre || '') + (j.apellidos ? ' ' + j.apellidos : ''), telefono: j.telefono || '', email: j.email || '' }); return; }
    }
    contactos.push({ nombre: nombreFallback, telefono: telFallback || '', email: emailFallback || '' });
  }
  if (p.jugador1Id || p.jugador2Id) {
    const nombres = p.name.includes(' / ') ? p.name.split(' / ') : [p.name, ''];
    resolverUno(p.jugador1Id, nombres[0], p.telefono, p.email);
    if (p.jugador2Id) resolverUno(p.jugador2Id, nombres[1], p.telefono, p.email);
  } else {
    resolverUno(p.jugadorId, p.name, p.telefono, p.email);
  }
  return contactos;
}
function recopilarContactosDelTorneo() {
  const vistos = new Set();
  const lista = [];
  enabledCategories().forEach(cat => {
    (cat.players || []).forEach(p => {
      contactosDeParticipante(p).forEach(c => {
        const clave = (c.nombre + '|' + c.telefono + '|' + c.email).toLowerCase();
        if (vistos.has(clave) || !c.nombre) return;
        vistos.add(clave);
        lista.push(c);
      });
    });
  });
  return lista;
}
function telefonoParaWhatsapp(tel) {
  let digitos = String(tel || '').replace(/\D/g, '');
  if (!digitos) return '';
  if (digitos.length === 9) digitos = '34' + digitos;
  return digitos;
}

function generarSetAleatorio(ganaP1) {
  const puntosPerdedor = Math.floor(Math.random() * 15) + 5;
  return ganaP1 ? [21, puntosPerdedor] : [puntosPerdedor, 21];
}
function simularResultadosGrupos(cat) {
  (cat.matches || []).filter(m => !m.winner).forEach(m => {
    const ganaP1 = Math.random() < 0.5;
    m.sets = [generarSetAleatorio(ganaP1), generarSetAleatorio(ganaP1)];
    m.winner = ganaP1 ? m.p1 : m.p2;
  });
}
function simularEliminatoria(cat) {
  if (!cat.knockout || !cat.knockout.rounds) return;
  let huboCambios = true;
  let vueltas = 0;
  while (huboCambios && vueltas < 20) {
    huboCambios = false;
    vueltas++;
    cat.knockout.rounds.forEach(ronda => {
      ronda.forEach(m => {
        if (m.winner || !m.p1 || !m.p2 || m.p1 === 'BYE' || m.p2 === 'BYE') return;
        const ganaP1 = Math.random() < 0.5;
        m.sets = [generarSetAleatorio(ganaP1), generarSetAleatorio(ganaP1)];
        m.winner = ganaP1 ? m.p1 : m.p2;
        huboCambios = true;
      });
    });
    if (huboCambios) propagateKnockout(cat);
  }
}

function findMatch(catId, matchId) {
  const cat = getCategory(catId);
  let m = cat.matches.find(x => x.id === matchId);
  if (m) return { cat, m };
  if (cat.knockout) {
    for (const round of cat.knockout.rounds) {
      m = round.find(x => x.id === matchId);
      if (m) return { cat, m };
    }
  }
  return null;
}

function viewStats() {
  const wrap = document.createDocumentFragment();
  if (!enabledCategories().length) {
    wrap.appendChild(emptyPanel('No hay categorías activas', 'Activa categorías para ver estadísticas.'));
    return wrap;
  }
  const totalMatches = enabledCategories().reduce((s, c) => s + c.matches.length + (c.knockout ? c.knockout.rounds.flat().filter(m => m.p1 && m.p2 && m.p1 !== 'BYE' && m.p2 !== 'BYE').length : 0), 0);
  const playedMatches = enabledCategories().reduce((s, c) => s + c.matches.filter(m => m.winner).length + (c.knockout ? c.knockout.rounds.flat().filter(m => m.winner && m.p1 !== 'BYE' && m.p2 !== 'BYE').length : 0), 0);
  const totalPlayers = enabledCategories().reduce((s, c) => s + c.players.length, 0);

  const cards = el('div', { class: 'stat-cards' },
    statCard(totalPlayers, 'Participantes totales'),
    statCard(totalMatches, 'Partidos totales'),
    statCard(playedMatches, 'Partidos jugados'),
    statCard(Math.max(0, totalMatches - playedMatches), 'Partidos pendientes'),

  const panel = el('div', { class: 'panel' }, el('h2', {}, 'Estadísticas por categoría'), catSelector('stats'));

    if (!cat.players.length) {

function statCard(num, label) { return el('div', { class: 'stat-card' }, el('div', { class: 'num' }, String(num)), el('div', { class: 'lab' }, label)); }

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (state.meta.title || 'torneo').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  a.href = url;
  a.download = `torneo_badminton_${safeName || 'datos'}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.config || !parsed.categories) throw new Error('formato no reconocido');
      state = parsed;
      render();
    } catch (err) {
      alert('No se ha podido importar el fichero: formato no válido.');
    }
  };
  reader.readAsText(file);
}

function getState() { return state; }
function setState(s) { state = normalizarCategorias(s); }
function getHistorial() { return torneosHistorial; }
function setHistorial(h) { torneosHistorial = (h || []).map(t => { if (t && t.snapshot) t.snapshot = normalizarCategorias(t.snapshot); return t; }); }
function resultadoDeParticipanteEnCategoria(cat, participantId) {
  if (cat.knockout && cat.knockout.rounds && cat.knockout.rounds.length) {
    const rounds = cat.knockout.rounds;
    let ultimoPartido = null, ultimaRondaIdx = -1;
    for (let r = 0; r < rounds.length; r++) {
      const m = rounds[r].find(x => x.p1 === participantId || x.p2 === participantId);
      if (m) { ultimoPartido = m; ultimaRondaIdx = r; }
    }
    if (ultimoPartido) {
      const esUltimaRonda = ultimaRondaIdx === rounds.length - 1;
      const gano = ultimoPartido.winner === participantId;
      if (esUltimaRonda && ultimoPartido.winner) return gano ? '🥇 Campeón' : '🥈 Subcampeón';
      if (ultimoPartido.winner) return 'Eliminado en ' + (ultimoPartido.round || 'eliminatoria');
      return 'En juego (' + (ultimoPartido.round || 'eliminatoria') + ')';
    }
  }
  if (cat.groups && cat.groups.length) {
    for (let gi = 0; gi < cat.groups.length; gi++) {
      const grp = cat.groups[gi];
      if (grp.playerIds && grp.playerIds.includes(participantId)) {
        if (!groupStageComplete(cat)) return 'Fase de grupos (en curso)';
        const standings = computeStandings(cat, gi);
        const pos = standings.findIndex(r => r.id === participantId) + 1;
        return pos ? (pos + 'º de grupo') : 'Fase de grupos';
      }
    }
  }
  return null;
}
function trayectoriaDeJugador(jugadorId) {
  guardarEstadoActivoEnLista();
  const resultados = [];
  const fuentes = [];
  torneosHistorial.forEach(t => fuentes.push({ nombre: t.nombre, fecha: t.fechaInicio, categorias: (t.snapshot && t.snapshot.categories) || [] }));
  fuentes.forEach(f => {
    (f.categorias || []).forEach(cat => {
      if (!cat.enabled || !cat.players || !cat.players.length) return;
      const participante = cat.players.find(p => p.jugadorId === jugadorId || p.jugador1Id === jugadorId || p.jugador2Id === jugadorId);
      if (!participante) return;
      const resultado = resultadoDeParticipanteEnCategoria(cat, participante.id);
      resultados.push({
        torneo: f.nombre,
        fecha: f.fecha,
        categoria: cat.name,
        pareja: (participante.jugador1Id && participante.jugador2Id) ? participante.name : null,
        resultado: resultado || 'Sin resultado registrado aún',
      });
    });
  });
  resultados.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  return resultados;
}

  tryLoadLocal();
  tryLoadHistorial();
  tryLoadTorneoActivoId();
  asegurarTorneoActivo();
  render();
}
return { render, mount, getState, setState, getHistorial, setHistorial, trayectoriaDeJugador, computeStandings, getTorneoActivoId: () => torneoActivoId, setTorneoActivoId: (id) => { torneoActivoId = id; } };

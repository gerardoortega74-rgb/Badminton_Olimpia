function defaultState() {
  return {
    meta: { club: '', grupo: '', temporadaInicio: '', temporadaFin: '' },
    config: { categoria: 'sub11', nivel: 'iniciacion', sesionesSemana: 3, duracionSesion: 90 },
    mesociclos: [],
    microciclo: diasSemanaDefault(),
    competiciones: [],
    evaluacion: { tests: [], jugadores: [], resultados: {} },
    entrenosIndividuales: [],
  };
}
function diasSemanaDefault() {
  return ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].map(d => ({
    dia: d, activo: false, contenido: CONTENIDO_MICROCICLO[0], duracion: 90, notas: '',
  }));
}

let state = defaultState();
let activeTab = 'config';
let uidCounter = 1;
function uid(prefix) { return prefix + '_' + (uidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }
function shufflePlan(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let rutinaTemporal = null;

function saveLocal() {
  try { localStorage.setItem('badmintonPlanState', JSON.stringify(state)); } catch (e) { }
  if (typeof programarSyncNube === 'function') programarSyncNube();
}
function tryLoadLocal() {
  try {
    const raw = localStorage.getItem('badmintonPlanState');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.config && parsed.meta) {
        if (!parsed.entrenosIndividuales) parsed.entrenosIndividuales = [];
        state = parsed;
      }
    }
  } catch (e) { }
}

function getCategoria(id) { return CATEGORIES.find(c => c.id === id); }
function getNivel(id) { return NIVELES.find(n => n.id === id); }
function datosVaciosGrupo() {
  return { mesociclos: [], microciclo: diasSemanaDefault(), competiciones: [], evaluacion: { tests: [], jugadores: [], resultados: {} }, entrenosIndividuales: [] };
}
function nuevoGrupoVacio(nombre) {
  return { id: uid('grp'), nombre: nombre || 'Grupo nuevo', nivel: 'iniciacion', horasSemanales: 0, horario: [], alumnos: [], asistencia: {}, datos: datosVaciosGrupo() };
}
function defaultGrupoEntreno() { return nuevoGrupoVacio('Grupo nuevo'); }
function migrarGrupos() {
  if (!Array.isArray(state.config.grupos) || !state.config.grupos.length) {
    const catVieja = getCategoria(state.config.categoria || 'sub11');
    state.config.grupos = [{ id: uid('grp'), nombre: catVieja ? catVieja.nombre : 'Grupo principal', nivel: state.config.nivel || 'iniciacion', horasSemanales: state.config.sesionesSemana || 3 }];
  }
  if (!state.config.grupoActivoId || !state.config.grupos.some(g => g.id === state.config.grupoActivoId)) {
    state.config.grupoActivoId = state.config.grupos[0].id;
  }
  state.config.grupos.forEach(g => {
    if (!Array.isArray(g.horario)) g.horario = [];
    if (!Array.isArray(g.alumnos)) g.alumnos = [];
    if (!g.asistencia || typeof g.asistencia !== 'object') g.asistencia = {};
    if (g.id === state.config.grupoActivoId) g.datos = null;
    else if (!g.datos) g.datos = datosVaciosGrupo();
    g.alumnos.forEach(a => {
      if (!a.docs || typeof a.docs !== 'object') a.docs = {};
      if (!Array.isArray(a.historialGrupos)) a.historialGrupos = [];
      if (a.telefonoEmergencia === undefined) a.telefonoEmergencia = '';
    });
  });
  if (!state.config.docsUrl || typeof state.config.docsUrl !== 'object') state.config.docsUrl = {};
  if (!Array.isArray(state.mesociclos)) state.mesociclos = [];
  if (!Array.isArray(state.microciclo) || !state.microciclo.length) state.microciclo = diasSemanaDefault();
  if (!Array.isArray(state.competiciones)) state.competiciones = [];
  if (!state.evaluacion || typeof state.evaluacion !== 'object') state.evaluacion = { tests: [], jugadores: [], resultados: {} };
  if (!Array.isArray(state.entrenosIndividuales)) state.entrenosIndividuales = [];
}
function grupoActivo() { return state.config.grupos.find(g => g.id === state.config.grupoActivoId) || state.config.grupos[0]; }
function minutosHorario(h) {
  const a = /^(\d{1,2}):(\d{2})$/.exec(h.inicio || ''), b = /^(\d{1,2}):(\d{2})$/.exec(h.fin || '');
  if (!a || !b) return 0;
  const m = (parseInt(b[1], 10) * 60 + parseInt(b[2], 10)) - (parseInt(a[1], 10) * 60 + parseInt(a[2], 10));
  return m > 0 ? m : 0;
}
function aplicarGrupoActivo() {
  const g = grupoActivo();
  if (!g) return;
  state.config.nivel = g.nivel;
  if (g.horario && g.horario.length) {
    state.config.sesionesSemana = g.horario.length;
    const mins = g.horario.map(minutosHorario).filter(m => m > 0);
    if (mins.length) state.config.duracionSesion = Math.round(mins.reduce((x, y) => x + y, 0) / mins.length);
  } else {
    state.config.sesionesSemana = g.horasSemanales || state.config.sesionesSemana || 1;
  }
  refActiveNivel = g.nivel;
}
// El grupo "activo" tiene sus datos de planificación en state.mesociclos, state.microciclo, etc.
// Los demás grupos guardan los suyos aparcados en grupo.datos. Al cambiar de grupo se intercambian.
function aparcarGrupoActivo() {
  const g = grupoActivo();
  if (!g) return;
  g.datos = { mesociclos: state.mesociclos, microciclo: state.microciclo, competiciones: state.competiciones, evaluacion: state.evaluacion, entrenosIndividuales: state.entrenosIndividuales };
}
function cargarDatosGrupo(g) {
  const d = g.datos || datosVaciosGrupo();
  state.mesociclos = Array.isArray(d.mesociclos) ? d.mesociclos : [];
  state.microciclo = (Array.isArray(d.microciclo) && d.microciclo.length) ? d.microciclo : diasSemanaDefault();
  state.competiciones = Array.isArray(d.competiciones) ? d.competiciones : [];
  state.evaluacion = (d.evaluacion && typeof d.evaluacion === 'object') ? d.evaluacion : { tests: [], jugadores: [], resultados: {} };
  state.entrenosIndividuales = Array.isArray(d.entrenosIndividuales) ? d.entrenosIndividuales : [];
  g.datos = null;
}
function activarGrupo(id) {
  if (id === state.config.grupoActivoId) return;
  const nuevo = state.config.grupos.find(g => g.id === id);
  if (!nuevo) return;
  aparcarGrupoActivo();
  state.config.grupoActivoId = id;
  cargarDatosGrupo(nuevo);
  aplicarGrupoActivo();
  entrenoUI.jugadorNombre = '';
  entrenoUI.nivel = '';
  entrenoUI.numDias = null;
}
function parseDate(s) { return s ? new Date(s + 'T00:00:00') : null; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function weeksBetween(a, b) { return Math.max(0, Math.round(daysBetween(a, b) / 7)); }
function fmtDate(s) {
  if (!s) return '—';
  const partes = String(s).slice(0, 10).split('-');
  if (partes.length !== 3) return s;
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}

function sortedMesociclos() {
  return state.mesociclos.slice().sort((a, b) => (a.fechaInicio || '').localeCompare(b.fechaInicio || ''));
}
function totalWeeksTemporada() {
  const a = parseDate(state.meta.temporadaInicio), b = parseDate(state.meta.temporadaFin);
  if (!a || !b || b <= a) return 0;
  return weeksBetween(a, b);
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  const children = Array.prototype.slice.call(arguments, 2);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}
function field(labelText, inputNode) { return el('div', { class: 'field' }, el('label', {}, labelText), inputNode); }
function inputEl(type, value, onChange, extraAttrs) {
  const attrs = Object.assign({ type, value: value === undefined || value === null ? '' : value, onchange: (e) => onChange(e.target.value) }, extraAttrs || {});
  return el('input', attrs);
}
function selectEl(options, value, onChange) {
  const sel = el('select', { onchange: (e) => onChange(e.target.value) });
  options.forEach(opt => {
    const optEl = el('option', { value: opt.value }, opt.label);
    if (opt.value === value) optEl.setAttribute('selected', 'selected');
    sel.appendChild(optEl);
  });
  return sel;
}

function viewMacrociclo() {
  const wrap = document.createDocumentFragment();
  const panel = el('div', { class: 'panel' },
    el('h2', {}, 'Macrociclo de temporada'),
    el('div', { class: 'sub' }, 'Divide la temporada en mesociclos (preparatorio, competitivo, transición) con fechas y objetivos concretos.')
  );
  if (!state.meta.temporadaInicio || !state.meta.temporadaFin) {
    panel.appendChild(el('div', { class: 'msg msg-warn' }, 'Define primero el inicio y fin de temporada en la pestaña Configuración para poder situar bien los mesociclos.'));
  }
  panel.appendChild(el('div', { class: 'toolbar' }, el('button', { class: 'btn btn-gold', onclick: () => { addMesociclo(); render(); } }, '+ Añadir mesociclo')));

  const meso = sortedMesociclos();
  if (!meso.length) {
    panel.appendChild(el('div', { class: 'empty-state' }, 'Todavía no has definido ningún mesociclo.'));
  } else {
    const tIni = parseDate(state.meta.temporadaInicio), tFin = parseDate(state.meta.temporadaFin);
    if (tIni && tFin && tFin > tIni) {
      const totalDays = daysBetween(tIni, tFin) || 1;
      const bar = el('div', { class: 'phase-bar' });
      meso.forEach(m => {
        const mi = parseDate(m.fechaInicio), mf = parseDate(m.fechaFin);
        if (!mi || !mf || mf <= mi) return;
        const widthPct = Math.max(2, (daysBetween(mi, mf) / totalDays) * 100);
        bar.appendChild(el('div', { class: 'phase-seg', style: `width:${widthPct}%;background:${TIPO_COLOR[m.tipo] || '#888'};` }, m.nombre));
      });
      panel.appendChild(bar);
      panel.appendChild(el('div', { class: 'sub', style: 'margin-bottom:16px;' }, `Temporada: ${fmtDate(state.meta.temporadaInicio)} — ${fmtDate(state.meta.temporadaFin)} (${totalWeeksTemporada()} semanas aprox.)`));
    }
    meso.forEach(m => panel.appendChild(mesocicloCard(m)));
  }
  wrap.appendChild(panel);
  return wrap;
}

const PERFILES_DIA = [
  { nombre: 'Técnica + físico', pesos: { tecnica: 2, tactica: 1, fisica: 1, psicologica: 0 } },
  { nombre: 'Táctica + físico', pesos: { tecnica: 1, tactica: 2, fisica: 1, psicologica: 0 } },
  { nombre: 'Físico + técnica', pesos: { tecnica: 1, tactica: 1, fisica: 2, psicologica: 0 } },
  { nombre: 'Integral + mental', pesos: { tecnica: 1, tactica: 1, fisica: 1, psicologica: 1 } },
];
function elegirSinRepetirPlan(lista, cantidad, usados) {
  if (!lista || !lista.length || cantidad <= 0) return [];
  const disponibles = lista.filter(x => !usados.has(x));
  const pool = disponibles.length >= cantidad ? disponibles : lista.slice();
  const barajado = shufflePlan(pool);
  return barajado.slice(0, Math.min(cantidad, barajado.length));
}
function generarRutina(nivelId, numDias, jugadorNombre) {
  const contenido = CONTENT_REF[nivelId] || CONTENT_REF.iniciacion;
  const anteriores = state.entrenosIndividuales.filter(r => r.jugadorNombre === jugadorNombre).slice(-2);
  const usadosEstaSemana = new Set();
  anteriores.forEach(r => r.dias.forEach(d => d.bloques.forEach(b => usadosEstaSemana.add(b.texto))));
  const dias = [];
  for (let i = 0; i < numDias; i++) {
    const perfil = PERFILES_DIA[i % PERFILES_DIA.length];
    const bloques = [];
    ['tecnica', 'tactica', 'fisica', 'psicologica'].forEach(area => {
      const cantidad = perfil.pesos[area] || 0;
      if (cantidad > 0) {
        const elegidos = elegirSinRepetirPlan(contenido[area], cantidad, usadosEstaSemana);
        elegidos.forEach(texto => { bloques.push({ area, texto }); usadosEstaSemana.add(texto); });
      }
    });
    dias.push({ dia: 'Día ' + (i + 1), perfil: perfil.nombre, bloques });
  }
  return dias;
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.config || !parsed.meta) throw new Error('formato no reconocido');
      state = parsed;
      render();
    } catch (err) {
      alert('No se ha podido importar el fichero: formato no válido.');
    }
  };
  reader.readAsText(file);
}

function sumarDiasISO(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function nombreDiaDeFecha(iso) { return ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][new Date(iso + 'T12:00:00').getDay()]; }
function ordenHorario(a, b) { return DIAS_SEMANA_GRUPO.indexOf(a.dia) - DIAS_SEMANA_GRUPO.indexOf(b.dia) || (a.inicio || '').localeCompare(b.inicio || ''); }

  const grupos = state.config.grupos;

const HELV_ANCHOS = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584];
function pdfBinPlan(s) {
  let out = '';
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    if (c < 128 || (c >= 160 && c < 256)) out += String.fromCharCode(c);
    else if (c === 0x20AC) out += '\x80';
    else if (c === 0x2013) out += '\x96';

}
function pdfEscPlan(s) { return pdfBinPlan(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
function anchoTextoPlan(str, size, negrita) {
  let w = 0;
  for (const ch of String(str)) {
    let c = ch.charCodeAt(0);
    if (c < 32 || c > 126) { const base = ch.normalize('NFD').charCodeAt(0); c = (base >= 32 && base <= 126) ? base : 65; }
    w += HELV_ANCHOS[c - 32] || 556;
  }

}
function envolverPlan(texto, size, anchoMax) {
  const palabras = String(texto).split(/\s+/).filter(Boolean);
  const lineas = [];
  let actual = '';
  palabras.forEach(p => {
    const prueba = actual ? actual + ' ' + p : p;
    if (anchoTextoPlan(prueba, size) <= anchoMax || !actual) actual = prueba;
    else { lineas.push(actual); actual = p; }

}
function ensamblarPdfPlan(paginas) {
  const PW = 595.28, PH = 841.89;
  const objs = [];
  const kids = paginas.map((_, i) => (5 + 2 * i + 1) + ' 0 R').join(' ');
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push('<< /Type /Pages /Kids [ ' + kids + ' ] /Count ' + paginas.length + ' >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const recursos = '/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >>';
  paginas.forEach((ops, i) => {
    const cs = ops.join('\n');
    objs.push('<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] ' + recursos + ' /Contents ' + (5 + 2 * i) + ' 0 R >>');
  });
  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets = [];
  objs.forEach((body, i) => { offsets.push(out.length); out += (i + 1) + ' 0 obj\n' + body + '\nendobj\n'; });
  const xrefPos = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
  offsets.forEach(o => { out += String(o).padStart(10, '0') + ' 00000 n \n'; });
  out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF';
  const u8 = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) u8[i] = out.charCodeAt(i) & 255;

}
function pdfDocumentoPlan(docKey, alumno, grupo) {

function comprimirImagen(file, maxWidth, calidad) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('No se pudo leer la imagen'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function arrayBufferABase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function leerPDF(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onerror = () => resolve({ texto: '', imagenDataUrl: null, paginasTotales: 0 });
    reader.onload = async () => {
      try {
        if (!window.pdfjsLib) { resolve({ texto: '', imagenDataUrl: null, paginasTotales: 0 }); return; }
        const typedArray = new Uint8Array(reader.result);
        const pdf = await pdfjsLib.getDocument({ data: typedArray }).promise;
        const page = await pdf.getPage(1);
        const contenido = await page.getTextContent();
        const texto = contenido.items.map(it => it.str).join(' ');
        // Convertimos la primera página en una imagen comprimida: así el adjunto
        // ocupa poco y cabe en el documento compartido de Firebase.
        const viewportBase = page.getViewport({ scale: 1 });
        const anchoObjetivo = 1100;
        const escala = Math.min(2.5, anchoObjetivo / viewportBase.width);
        const viewport = page.getViewport({ scale: escala });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        const imagenDataUrl = canvas.toDataURL('image/jpeg', 0.65);
        resolve({ texto, imagenDataUrl, paginasTotales: pdf.numPages });
      } catch (e) { resolve({ texto: '', imagenDataUrl: null, paginasTotales: 0 }); }
    };
    reader.readAsArrayBuffer(file);
  });
}

function aNumeroImporte(str) {
  let s = str.trim();
  if (s.includes(',') && s.includes('.')) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function parsearRecibo(texto) {
  const resultado = { importe: null, concepto: null, fecha: null, proveedorCandidato: null };
  if (!texto) return resultado;
  const lineas = texto.split(/\n/).map(l => l.trim()).filter(Boolean);
  const numeroRegex = /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})/g;
  const totalLinea = lineas.find(l => /total/i.test(l) && !/subtotal/i.test(l));
  let importe = null;
  if (totalLinea) {
    const m = totalLinea.match(numeroRegex);
    if (m && m.length) importe = aNumeroImporte(m[m.length - 1]);
  }
  if (importe === null) {
    const todos = (texto.match(numeroRegex) || []).map(aNumeroImporte).filter(n => n !== null);
    if (todos.length) importe = Math.max.apply(null, todos);
  }
  resultado.importe = importe;
  const conceptoLinea = lineas.find(l => l.length > 2 && !/^\d/.test(l));
  resultado.concepto = conceptoLinea ? conceptoLinea.slice(0, 70) : null;
  const fechaMatch = texto.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (fechaMatch) {
    let d = fechaMatch[1], mth = fechaMatch[2], y = fechaMatch[3];
    if (y.length === 2) y = '20' + y;
    d = d.padStart(2, '0'); mth = mth.padStart(2, '0');
    const anioNum = parseInt(y, 10);
    if (anioNum >= 2000 && anioNum <= 2100) resultado.fecha = y + '-' + mth + '-' + d;
  }
  resultado.proveedorCandidato = lineas.length ? lineas[0].slice(0, 60) : null;
  return resultado;
}

function aplicarDatosDetectados(mov, texto) {
  mov.ocrTexto = texto || '';

  if (datos.concepto) mov.concepto = datos.concepto;

    if (coincide) mov.proveedorId = coincide.id;
    else mov.proveedorCandidato = datos.proveedorCandidato;
  }
}

async function procesarArchivoRecibo(file, tipoMovimiento) {
  procesandoRecibo = true; render();
  const mov = { id: uid('mov'), fecha: new Date().toISOString().slice(0, 10), tipo: tipoMovimiento, categoria: (tipoMovimiento === 'ingreso' ? CATEGORIAS_INGRESO[0] : CATEGORIAS_GASTO[0]), concepto: '', importe: 0, adjunto: null, origenOCR: false, ocrTexto: '', errorProceso: '' };
  try {
    if (file.type === 'application/pdf') {
      const r = await leerPDF(file);
      if (r.imagenDataUrl) {
        mov.adjunto = { tipo: 'imagen', dataUrl: r.imagenDataUrl, nombre: file.name.replace(/\.pdf$/i, '') + ' (pág. 1).jpg', origenPDF: true };
        if (r.paginasTotales > 1) {
          mov.errorProceso = 'El PDF tenía ' + r.paginasTotales + ' páginas; solo se guardó la primera (como imagen) para no superar el límite de tamaño de la nube.';
        }
      } else {
        mov.errorProceso = 'No se pudo leer el PDF; adjúntalo como foto si lo necesitas.';
      }
      let textoFinal = r.texto;
      if ((!textoFinal || textoFinal.trim().length < 25) && r.imagenDataUrl && window.Tesseract) {
        textoFinal = await ocrDesdeImagen(r.imagenDataUrl);
      }
      aplicarDatosDetectados(mov, textoFinal);
    } else if (file.type.startsWith('image/')) {
      const dataUrl = await comprimirImagen(file, 1100, 0.65);
      mov.adjunto = { tipo: 'imagen', dataUrl, nombre: file.name };
      const texto = await ocrDesdeImagen(dataUrl);
      aplicarDatosDetectados(mov, texto);
    } else {
      throw new Error('Formato no admitido: usa una foto o un PDF.');
    }
  } catch (e) {
    mov.errorProceso = (e && e.message) ? e.message : 'No se pudieron leer los datos automáticamente; revisa los campos a mano.';
  }
  state.contabilidad.movimientos.unshift(mov);
  if (window.guardarReciboEnNube) window.guardarReciboEnNube(mov.id, mov.adjunto);
  procesandoRecibo = false;
  render();
  if (mov.proveedorCandidato) abrirModalProveedorDetectado(mov);
}

function adjuntarArchivoAMovimiento(m, file) {
  if (!file) return;
  procesandoRecibo = true; render();
  const promesa = file.type === 'application/pdf'
    ? leerPDF(file).then(r => {
        if (!r.imagenDataUrl) throw new Error('No se pudo convertir el PDF a imagen.');
        if (r.paginasTotales > 1) m.errorProceso = 'El PDF tenía ' + r.paginasTotales + ' páginas; solo se guardó la primera (como imagen) para no superar el límite de tamaño de la nube.';
        return { tipo: 'imagen', dataUrl: r.imagenDataUrl, nombre: file.name.replace(/\.pdf$/i, '') + ' (pág. 1).jpg', origenPDF: true };
      })
    : comprimirImagen(file, 1100, 0.65).then(dataUrl => ({ tipo: 'imagen', dataUrl, nombre: file.name }));
  promesa.then(adjunto => { m.adjunto = adjunto; if (window.guardarReciboEnNube) window.guardarReciboEnNube(m.id, adjunto); })
    .catch(() => { alert('No se pudo adjuntar el archivo.'); })
    .then(() => { procesandoRecibo = false; render(); });
}

function verAdjunto(adjunto) {
  if (!adjunto || !adjunto.dataUrl) return;
  try {
    const partes = adjunto.dataUrl.split(',');
    const mimeMatch = partes[0].match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : (adjunto.tipo === 'pdf' ? 'application/pdf' : 'image/jpeg');
    const binario = atob(partes[1]);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch (e) { alert('No se pudo abrir el adjunto.'); }
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs) {
    if (k === 'class') node.className = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
  }
  children.flat(Infinity).forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return node;
}
function field(label, inputNode) { return el('div', { class: 'field' }, el('label', {}, label), inputNode); }

  const node = el('input', attrs);

}
function selectEl(options, value, onChange) {

function fmtFechaDMY(s) {
  if (!s) return '—';
  const partes = String(s).slice(0, 10).split('-');

function fmtTension(p) {

}
function fmtHora(ts) {

function comprimirImagen(file, maxWidth, calidad) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function calcularInformeCoste(p) {
  let costeCordajes = 0;
  const detalleCordajes = [];
  if (p.cordajeId) {
    const cor = cordajeDe(p.cordajeId);
    const cant = p.cantidadCordaje || 1;
    const coste = cor ? (cor.precioCoste || 0) * cant : 0;
    costeCordajes += coste;
    detalleCordajes.push({ nombre: cor ? cor.nombre : 'Cordaje', cantidad: cant, coste });
  }
  if (p.cordajeIdH) {
    const corH = cordajeDe(p.cordajeIdH);
    const cant = p.cantidadCordajeH || 1;
    const coste = corH ? (corH.precioCoste || 0) * cant : 0;
    costeCordajes += coste;
    detalleCordajes.push({ nombre: corH ? corH.nombre : 'Cordaje horizontal', cantidad: cant, coste });
  }
  let costeArticulos = 0;
  const detalleArticulos = [];
  (p.articulosAdicionales || []).forEach(it => {
    const art = state.articulos.find(a => a.id === it.articuloId);
    const coste = art ? (art.precioCoste || 0) * it.cantidad : 0;
    costeArticulos += coste;
    detalleArticulos.push({ nombre: it.nombre || (art ? art.nombre : 'Artículo'), cantidad: it.cantidad, coste });
  });
  const costeMaterial = costeCordajes + costeArticulos;
  const duracionHoras = (p.horaInicio && p.horaFin) ? Math.max(0, (p.horaFin - p.horaInicio) / 3600000) : 0;
  const precioHora = state.config.precioHoraOperario || 0;
  const costeManoObra = duracionHoras * precioHora;
  const costeTotal = costeMaterial + costeManoObra;
  const precioCobrado = p.precio || 0;
  const beneficio = precioCobrado - costeTotal;
  return { detalleCordajes, detalleArticulos, costeMaterial, duracionHoras, precioHora, costeManoObra, costeTotal, precioCobrado, beneficio };
}

function pedirPermisoNotificaciones() {
  if (typeof Notification === 'undefined') { alert('Tu navegador no admite notificaciones.'); return; }
  Notification.requestPermission().then(() => render());
}
function reproducirPitido() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 350);
  } catch (e) {}
}
function dispararAviso5min(p) {
  const cli = clienteDe(p.clienteId);
  const texto = `Quedan 5 min para terminar la raqueta de ${cli ? cli.nombre : '(cliente eliminado)'} (${p.marcaModelo || ''}). Prepara la siguiente.`;
  if (permisoNotificacionesConcedido()) {
    try { new Notification('🏸 5 minutos para terminar', { body: texto }); } catch (e) {}
  }
  reproducirPitido();
  avisosPersonalesPendientes.push({ id: p.id, texto });
  render();
}
function comprobarAvisos5min() {
  const enProceso = state.pedidos.filter(p => p.estado === 'en_proceso' && p.horaInicio);
  enProceso.forEach(p => {
    const finEstimado = p.horaInicio + (state.config.tiempoMedioMinutos || 35) * 60000;
    const faltan = finEstimado - Date.now();
    if (faltan <= 5 * 60000 && faltan > -5 * 60000 && !pedidosYaAvisados5min.has(p.id)) {
      pedidosYaAvisados5min.add(p.id);
      dispararAviso5min(p);
    }
  });
}

    el('div', { class: 'row', style: 'gap:8px;flex-wrap:wrap;margin:8px 0;' },

    if (fotoInput.files[0]) {
      try { fotoAntes = await comprimirImagen(fotoInput.files[0], 1100, 0.65); } catch (e) {}
    }
    const nuevo = addPedido({
      clienteId: clienteElegidoId, marcaModelo: marcaModeloFinal(), cordajeId: cordajeSelect.value || null,
      tensionVertical: tensionVInput.value ? parseFloat(tensionVInput.value) : null,
      tensionHorizontal: tensionHInput.value ? parseFloat(tensionHInput.value) : (tensionVInput.value ? parseFloat(tensionVInput.value) : null),
      precio: (parseFloat(precioInput.value) || 0) + subtotalArticulosAdicionales(),

      fotoAntes, notas: notasInput.value.trim(),

    clientePreseleccionadoId = irACola ? null : clienteElegidoId;
    activeTab = irACola ? 'cola' : 'nuevo';
    render();
  }

  panel.appendChild(el('div', { class: 'toolbar', style: 'margin-top:16px;' },
    el('button', { class: 'btn btn-gold', onclick: () => guardarPedido(false) }, '➕ Añadir y meter otra raqueta de este cliente'),
    el('button', { class: 'btn btn-primary', onclick: () => guardarPedido(true) }, '✅ Añadir y terminar (ir a la cola)'),
  ));
  wrap.appendChild(panel);
  return wrap;
}

function viewClientes() {
  const wrap = document.createDocumentFragment();
  const panel = el('div', { class: 'panel' },
    el('h2', {}, '👤 Clientes'),
    el('div', { class: 'sub' }, 'Clientes del taller (pueden coincidir o no con jugadores del club). Pincha en uno para ver su historial.'),
  );
  const buscador = el('input', { type: 'text', placeholder: 'Buscar por nombre o teléfono…', value: filtroClienteTexto });
  buscador.addEventListener('input', (e) => { filtroClienteTexto = e.target.value; render(); });
  panel.appendChild(field('Buscar', buscador));

  const nombreInput = el('input', { type: 'text', placeholder: 'Nombre' });
  const telInput = el('input', { type: 'tel', placeholder: 'Teléfono' });
  const emailInput = el('input', { type: 'email', placeholder: 'Email' });
  const dniInput = el('input', { type: 'text', placeholder: 'DNI/NIF' });
  const direccionInput = el('input', { type: 'text', placeholder: 'Calle y número' });
  const cpInput = el('input', { type: 'text', placeholder: 'Código postal' });
  const localidadInput = el('input', { type: 'text', placeholder: 'Localidad' });
  const provinciaInput = el('input', { type: 'text', placeholder: 'Provincia' });
  panel.appendChild(el('div', { class: 'grid', style: 'margin-top:10px;' },
    field('Nombre', nombreInput), field('Teléfono', telInput), field('Email', emailInput), field('DNI/NIF', dniInput),
    field('Dirección', direccionInput), field('Código postal', cpInput), field('Localidad', localidadInput), field('Provincia', provinciaInput),
  ));
  panel.appendChild(el('div', { class: 'toolbar', style: 'margin-bottom:16px;' },
    el('button', { class: 'btn btn-gold btn-sm', onclick: () => {
      if (!nombreInput.value.trim()) { alert('Escribe al menos el nombre.'); return; }
      addCliente({
        nombre: nombreInput.value.trim(), telefono: telInput.value.trim(), email: emailInput.value.trim(), dni: dniInput.value.trim(),
        direccion: direccionInput.value.trim(), codigoPostal: cpInput.value.trim(), localidad: localidadInput.value.trim(), provincia: provinciaInput.value.trim(),
      });
      render();
    } }, '+ Añadir cliente'),
  ));

  const q = filtroClienteTexto.trim().toLowerCase();
  const lista = q ? state.clientes.filter(c => (c.nombre || '').toLowerCase().includes(q) || (c.telefono || '').includes(q) || (c.numeroCliente || '').includes(q) || (c.dni || '').toLowerCase().includes(q)) : state.clientes;
  if (!lista.length) {
    panel.appendChild(el('div', { class: 'empty-state' }, q ? 'No hay clientes que coincidan.' : 'Todavía no hay clientes guardados.'));
  } else {
    lista.forEach(c => {
      const expandido = clienteSeleccionadoId === c.id;
      const card = el('div', { class: 'card', style: 'cursor:pointer;' },
        el('div', { class: 'card-head', onclick: () => { clienteSeleccionadoId = expandido ? null : c.id; render(); } },
          el('span', { class: 'card-title' }, (expandido ? '▾ ' : '▸ ') + c.nombre),
          el('button', { class: 'btn btn-danger btn-sm', onclick: (e) => { e.stopPropagation(); if (confirm('¿Eliminar este cliente?')) { removeCliente(c.id); render(); } } }, 'Eliminar'),
        ),
        el('div', { class: 'sub' }, `Nº cliente: ${c.numeroCliente || '—'}` + (c.dni ? ' · DNI: ' + c.dni : '')),
        el('div', { class: 'sub' }, [c.telefono, c.email].filter(Boolean).join(' · ') || 'Sin contacto'),
      );
      if (expandido) {
        card.appendChild(el('h4', { style: 'margin:12px 0 6px;' }, '📇 Datos de contacto y envío'));
        card.appendChild(el('div', { class: 'grid', onclick: e => e.stopPropagation() },
          field('Nº de cliente', inputEl('text', c.numeroCliente || '', v => { c.numeroCliente = v.trim(); render(); })),
          field('DNI/NIF', inputEl('text', c.dni || '', v => { c.dni = v; render(); })),
          field('Nombre', inputEl('text', c.nombre, v => { c.nombre = v; render(); })),
          field('Teléfono', inputEl('tel', c.telefono, v => { c.telefono = v; render(); })),
          field('Email', inputEl('email', c.email, v => { c.email = v; render(); })),
          field('Dirección', inputEl('text', c.direccion || '', v => { c.direccion = v; render(); })),
          field('Código postal', inputEl('text', c.codigoPostal || '', v => { c.codigoPostal = v; render(); })),
          field('Localidad', inputEl('text', c.localidad || '', v => { c.localidad = v; render(); })),
          field('Provincia', inputEl('text', c.provincia || '', v => { c.provincia = v; render(); })),
        ));
        const pedidos = pedidosDeCliente(c.id);
        const totalGastado = pedidos.reduce((s, p) => s + (p.precio || 0), 0);
        const totalPendiente = pedidos.filter(p => !p.pagado).reduce((s, p) => s + (p.precio || 0), 0);
        card.appendChild(el('h4', { style: 'margin:12px 0 6px;' }, `Historial (${pedidos.length} raqueta(s)) · Total: ${euros(totalGastado)}${totalPendiente > 0 ? ' · Pendiente: ' + euros(totalPendiente) : ''}`));
        if (!pedidos.length) {
          card.appendChild(el('div', { class: 'sub' }, 'Todavía no ha traído ninguna raqueta.'));
        } else {
          const tabla = el('table', {}, el('thead', {}, el('tr', {},
            el('th', {}, 'Fecha'), el('th', {}, 'Raqueta'), el('th', {}, 'Cordaje'), el('th', {}, 'Tensión'), el('th', {}, 'Precio'), el('th', {}, 'Pago'), el('th', {}, 'Estado'))));
          const tbody = el('tbody');
          pedidos.forEach(p => {
            const cor = cordajeDe(p.cordajeId);
            tbody.appendChild(el('tr', {},
              el('td', {}, fmtFechaHora(p.horaLlegada)),
              el('td', {}, p.marcaModelo || '—'),
              el('td', {}, nombreCordajeDe(p)),
              el('td', {}, fmtTension(p)),
              el('td', {}, euros(p.precio)),
              el('td', {}, p.pagado ? el('span', { class: 'chip chip-gold' }, 'Pagado') : el('span', { class: 'chip chip-muted' }, 'Pendiente')),
              el('td', {}, p.estado === 'entregado' ? el('span', { class: 'chip chip-gold' }, 'Entregado') : p.estado === 'terminado' ? el('span', { class: 'chip chip-gold' }, 'Terminado') : (p.aplazado ? el('span', { class: 'chip chip-muted' }, 'Aplazado') : el('span', { class: 'chip chip-muted' }, 'En curso'))),
            ));
          });
          tabla.appendChild(tbody);
          card.appendChild(tabla);
        }
      }
      panel.appendChild(card);
    });
  }
  wrap.appendChild(panel);
  return wrap;
}

    const checkFila = el('input', { type: 'checkbox', style: 'width:auto;', checked: articulosSeleccionados.has(a.id) ? 'checked' : null,

    ));

function listaArticulosCompacta(listaCompleta) {
  const wrap = document.createDocumentFragment();
  const buscadorInput = el('input', { type: 'text', placeholder: 'Buscar por código o nombre…', value: busquedaArticulo });
  const tablaDiv = el('div', {});
  function aplicarFiltro() {
    const q = busquedaArticulo.trim().toLowerCase();
    const filtrada = q ? listaCompleta.filter(a => (a.nombre || '').toLowerCase().includes(q) || (a.codigo || '').toLowerCase().includes(q)) : listaCompleta;
    tablaDiv.innerHTML = '';
    tablaDiv.appendChild(construirTablaArticulos(filtrada));
  }
  buscadorInput.addEventListener('input', () => { busquedaArticulo = buscadorInput.value; aplicarFiltro(); });
  wrap.appendChild(field('🔎 Buscar', buscadorInput));
  const idsEnEstaLista = new Set(listaCompleta.map(a => a.id));
  const seleccionadosAqui = Array.from(articulosSeleccionados).filter(id => idsEnEstaLista.has(id));
  if (seleccionadosAqui.length) {
    wrap.appendChild(el('div', { class: 'toolbar', style: 'margin:6px 0;' },
      el('span', { class: 'sub', style: 'font-weight:700;' }, seleccionadosAqui.length + ' seleccionado(s)'),
      el('button', { class: 'btn btn-danger btn-sm', onclick: () => {
        if (!confirm('¿Borrar los ' + seleccionadosAqui.length + ' artículos seleccionados? No se puede deshacer.')) return;
        seleccionadosAqui.forEach(id => { removeArticulo(id); articulosSeleccionados.delete(id); });
        if (seleccionadosAqui.includes(articuloAbiertoId)) articuloAbiertoId = null;
        render();
      } }, '🗑️ Borrar seleccionados'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { seleccionadosAqui.forEach(id => articulosSeleccionados.delete(id)); render(); } }, 'Quitar selección'),
    ));
  }
  // La ficha completa del artículo abierto se pone AQUÍ, justo encima de la lista,
  // para que no haya que bajar entre decenas o cientos de filas para verla.
  const lista = listaCompleta;
  const abierto = lista.find(a => a.id === articuloAbiertoId);
  if (abierto) {
    const fichaDiv = el('div', { id: 'ficha-articulo-abierto' }, articuloCard(abierto));
    wrap.appendChild(fichaDiv);
    setTimeout(() => { const el2 = document.getElementById('ficha-articulo-abierto'); if (el2) el2.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
  }
  aplicarFiltro();
  wrap.appendChild(tablaDiv);
  return wrap;
}

// Tarjeta compartida por cordajes y artículos: mismo modelo de datos (state.articulos), solo cambia qué campos se muestran.
function precioCosteMedio(a) {
  if (!a.proveedores || !a.proveedores.length) return null;
  const suma = a.proveedores.reduce((s, r) => s + (r.precioCompra || 0), 0);
  return suma / a.proveedores.length;
}
function sincronizarPrecioCoste(a) {
  const media = precioCosteMedio(a);
  if (media !== null) a.precioCoste = Math.round(media * 100) / 100;
}
function articuloCard(a) {
  sincronizarPrecioCoste(a);
  const beneficioUd = (a.precio || 0) - (a.precioCoste || 0);
  const tieneProveedores = a.proveedores && a.proveedores.length > 0;
  const campoPrecioCoste = tieneProveedores
    ? field('Precio de coste (€) — media de ' + a.proveedores.length + ' proveedor(es)', inputEl('number', a.precioCoste || 0, () => {}, { min: 0, step: '0.5', disabled: 'disabled', title: 'Se calcula solo a partir del precio de compra de cada proveedor' }))
    : field('Precio de coste (€)', inputEl('number', a.precioCoste || 0, v => { a.precioCoste = parseFloat(v) || 0; render(); }, { min: 0, step: '0.5' }));
  const card = el('div', { class: 'card' },
    el('div', { class: 'grid' },

      field('Nombre', inputEl('text', a.nombre, v => { a.nombre = v; render(); })),
      !a.esCordaje ? field('Tipo', selectEl(tipoArticuloOptions(), a.tipo || 'Otro', v => { a.tipo = v; render(); })) : null,
      campoPrecioCoste,
      field('Precio de venta (€)', inputEl('number', a.precio, v => { a.precio = parseFloat(v) || 0; render(); }, { min: 0, step: '0.5' })),
      field('Unidad', selectEl(unidadArticuloOptions(), a.unidad || (a.esCordaje ? 'metros' : 'unidades'), v => { a.unidad = v; render(); })),
      field('Stock (' + (a.unidad || 'unidades') + ')', inputEl('number', a.stock, v => { a.stock = parseFloat(v) || 0; render(); }, { min: 0 })),
    ),
    el('div', { style: 'margin-top:10px;' },
      el('h4', { style: 'margin:0 0 6px;' }, '📷 Foto del artículo'),
      a.foto ? el('img', { src: a.foto, style: 'max-width:160px;border-radius:8px;display:block;margin-bottom:6px;' }) : null,
      (() => {
        const fotoArticuloInput = el('input', { type: 'file', accept: 'image/*' });
        return el('div', { class: 'row', style: 'gap:8px;flex-wrap:wrap;align-items:center;' },
          fotoArticuloInput,
          el('button', { class: 'btn btn-gold btn-sm', onclick: async () => {
            if (!fotoArticuloInput.files[0]) { alert('Elige antes una foto.'); return; }
            try {
              a.foto = await comprimirImagen(fotoArticuloInput.files[0], 700, 0.65);
              if (window.guardarFotoArticuloTallerEnNube) window.guardarFotoArticuloTallerEnNube(a.id, a.foto);
              render();
            } catch (e) { alert('No se pudo procesar la foto.'); }
          } }, a.foto ? 'Cambiar foto' : '+ Añadir foto'),
          a.foto ? el('button', { class: 'btn btn-danger btn-sm', onclick: () => {
            a.foto = null;
            if (window.guardarFotoArticuloTallerEnNube) window.guardarFotoArticuloTallerEnNube(a.id, null);

      ));

  ));

}

// ---------- Importar artículos desde Excel ----------
function viewImportarArticulos() {
  const panel = el('div', { class: 'panel' },
    el('h2', {}, '📥 Importar artículos desde Excel'),
    el('div', { class: 'sub' }, 'Sube un archivo .xlsx con una columna de código y otra de nombre del artículo (usa las cabeceras que quieras, la app las busca sola). Si el código ya existe, actualiza el nombre; si no, crea el artículo nuevo. Los cordajes se marcan solos si el nombre empieza por "CORDAJE". Luego rellenas precios, stock y proveedor a mano.'),
  );
  const fileInput = el('input', { type: 'file', accept: '.xlsx,.xls' });
  const resultado = el('div', { style: 'margin-top:8px;' });
  panel.appendChild(el('div', { class: 'toolbar' },
    fileInput,
    el('button', { class: 'btn btn-gold btn-sm', onclick: () => {
      if (!fileInput.files[0]) { alert('Elige antes un archivo .xlsx.'); return; }
      importarArticulosExcel(fileInput.files[0], resultado);
    } }, '📥 Importar'),
  ));
  panel.appendChild(resultado);
  return panel;
}
function importarArticulosExcel(file, resultadoDiv) {
  resultadoDiv.innerHTML = '';
  if (typeof XLSX === 'undefined') { resultadoDiv.appendChild(el('div', { class: 'msg msg-warn' }, 'No se pudo cargar el lector de Excel. Comprueba tu conexión y vuelve a intentarlo.')); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const nombreHoja = wb.SheetNames.find(n => /art[ií]culo/i.test(n)) || wb.SheetNames[0];
      const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, defval: '' });
      let filaCabecera = -1, colCodigo = -1, colNombre = -1;
      for (let i = 0; i < Math.min(filas.length, 15); i++) {
        const fila = filas[i].map(v => String(v || '').toLowerCase().trim());
        const iCod = fila.findIndex(v => v.includes('código') || v.includes('codigo'));
        const iNom = fila.findIndex((v, idx) => idx !== iCod && (v.includes('artículo') || v.includes('articulo') || v.includes('nombre') || v.includes('descripci')));
        if (iCod >= 0 && iNom >= 0) { filaCabecera = i; colCodigo = iCod; colNombre = iNom; break; }
      }
      if (filaCabecera < 0) { resultadoDiv.appendChild(el('div', { class: 'msg msg-warn' }, 'No he encontrado una columna de código y otra de nombre/artículo en el archivo. Revisa las cabeceras.')); return; }
      let creados = 0, actualizados = 0;
      for (let i = filaCabecera + 1; i < filas.length; i++) {
        const fila = filas[i];
        const codigo = String(fila[colCodigo] || '').trim();
        const nombre = String(fila[colNombre] || '').trim();
        if (!codigo && !nombre) continue;
        const existente = state.articulos.find(a => a.codigo && codigo && a.codigo.toLowerCase() === codigo.toLowerCase());
        if (existente) { existente.nombre = nombre || existente.nombre; actualizados++; }
        else {
          const esCordaje = /^cordaje/i.test(nombre);
          const nuevo = addArticulo(esCordaje);
          nuevo.codigo = codigo;
          nuevo.nombre = nombre || 'Sin nombre';
        }
        if (!existente) creados++;
      }
      resultadoDiv.appendChild(el('div', { class: 'msg msg-info' }, `Importación terminada: ${creados} artículo(s) nuevo(s), ${actualizados} actualizado(s) por coincidir el código.`));
      render();
    } catch (err) {
      resultadoDiv.appendChild(el('div', { class: 'msg msg-warn' }, 'No se pudo leer el archivo: ' + err.message));
    }
  };
  reader.readAsArrayBuffer(file);
}

function pedidosPendientesDeCobro() {
  return state.pedidos
    .filter(p => (p.estado === 'terminado' || p.estado === 'entregado') && !p.pagado)
    .sort((a, b) => {
      const ca = (clienteDe(a.clienteId) || {}).nombre || '';
      const cb = (clienteDe(b.clienteId) || {}).nombre || '';
      return ca.localeCompare(cb, 'es') || (a.horaLlegada - b.horaLlegada);
    });
}

// ===== Generador de PDF sin librerías (Helvetica estándar, codificación WinAnsi) =====
function pdfBin(s) {
  let out = '';
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    if (c < 128 || (c >= 160 && c < 256)) out += String.fromCharCode(c);
    else if (c === 0x20AC) out += '\x80';
    else if (c === 0x2026) out += '\x85';
    else if (c === 0x2013) out += '\x96';
    else if (c === 0x2014) out += '\x97';
    else out += '?';
  }
  return out;
}
function pdfEsc(s) { return pdfBin(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
function pdfAnchoNumero(str, size) {
  let w = 0;
  for (const ch of String(str)) w += (ch === '.' || ch === ',' || ch === ' ') ? 0.278 : 0.556;
  return w * size;
}
function pdfRecortar(str, max) { str = String(str || ''); return str.length > max ? str.slice(0, max - 3) + '...' : str; }
function pdfInfoJpeg(bin) {
  if (bin.charCodeAt(0) !== 0xFF || bin.charCodeAt(1) !== 0xD8) return null;
  let i = 2;
  while (i < bin.length) {
    if (bin.charCodeAt(i) !== 0xFF) { i++; continue; }
    const m = bin.charCodeAt(i + 1);
    if (m === 0xFF) { i++; continue; }
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
      return { bits: bin.charCodeAt(i + 4), h: (bin.charCodeAt(i + 5) << 8) | bin.charCodeAt(i + 6), w: (bin.charCodeAt(i + 7) << 8) | bin.charCodeAt(i + 8), comp: bin.charCodeAt(i + 9) };
    }
    if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { i += 2; continue; }
    i += 2 + ((bin.charCodeAt(i + 2) << 8) | bin.charCodeAt(i + 3));
  }
  return null;
}
function pdfPendientesDeCobro() {
  const PW = 595.28, PH = 841.89, M = 40;
  const pend = pedidosPendientesDeCobro();
  const total = pend.reduce((sum, p) => sum + (p.precio || 0), 0);
  let img = null;
  try {
    const foto = state.config.tarjetaVisitaFoto;
    if (foto && foto.indexOf('data:image/jpeg') === 0) {
      const bin = atob(foto.split(',')[1]);
      const info = pdfInfoJpeg(bin);
      if (info && (info.comp === 1 || info.comp === 3) && info.bits === 8 && info.w > 0 && info.h > 0) img = { bin, w: info.w, h: info.h, comp: info.comp };
    }
  } catch (e) { img = null; }

  const pages = [];
  let ops = [];
  let y = 0;
  const cols = [
    { t: 'Fecha', x: M, max: 10 }, { t: 'Cliente', x: M + 52, max: 24 }, { t: 'Teléfono', x: M + 170, max: 13 },
    { t: 'Raqueta', x: M + 236, max: 26 }, { t: 'Estado', x: M + 366, max: 12 },
  ];
  const T = (x, yy, str, size, bold) => ops.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' Td (' + pdfEsc(str) + ') Tj ET');
  const TR = (xr, yy, str, size, bold) => T(xr - pdfAnchoNumero(str, size), yy, str, size, bold);
  const LINE = (x1, yy, x2, gris) => ops.push(gris + ' G 0.5 w ' + x1.toFixed(2) + ' ' + yy.toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + yy.toFixed(2) + ' l S');
  const RECT = (x, yy, w, h, gris) => ops.push(gris + ' g ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re f 0 g');
  function cabeceraTabla() {
    RECT(M, y - 4, PW - 2 * M, 16, '0.9');
    cols.forEach(c => T(c.x + 2, y, c.t, 9, true));
    TR(PW - M - 2, y, 'Importe', 9, true);
    y -= 18;
  }
  function nuevaPagina(primera) {
    ops = []; pages.push(ops); y = PH - M;
    if (primera) {
      let altoCab = 0;
      if (img) {
        const esc = Math.min(180 / img.w, 70 / img.h);
        const iw = img.w * esc, ih = img.h * esc;
        ops.push('q ' + iw.toFixed(2) + ' 0 0 ' + ih.toFixed(2) + ' ' + (PW - M - iw).toFixed(2) + ' ' + (PH - M - ih).toFixed(2) + ' cm /Im1 Do Q');
        altoCab = ih;
      }
      T(M, PH - M - 14, 'Pendientes de cobro', 18, true);
      T(M, PH - M - 32, 'Taller de raquetas · Generado el ' + fmtFechaTs(Date.now()), 10, false);
      y = PH - M - Math.max(altoCab, 40) - 14;
    }
  }

  nuevaPagina(true);
  if (!pend.length) {
    T(M, y, 'No hay ninguna raqueta pendiente de cobro.', 11, false);
  } else {
    cabeceraTabla();
    pend.forEach(p => {
      if (y < M + 50) { nuevaPagina(false); cabeceraTabla(); }
      const cli = clienteDe(p.clienteId);
      T(cols[0].x + 2, y, fmtFechaTs(p.horaLlegada), 9, false);
      T(cols[1].x + 2, y, pdfRecortar(cli ? cli.nombre : '(cliente eliminado)', cols[1].max), 9, false);
      T(cols[2].x + 2, y, pdfRecortar(cli && cli.telefono ? cli.telefono : '', cols[2].max), 9, false);
      T(cols[3].x + 2, y, pdfRecortar(p.marcaModelo || '—', cols[3].max), 9, false);
      T(cols[4].x + 2, y, p.estado === 'entregado' ? 'Entregada' : 'Sin recoger', 9, false);
      TR(PW - M - 2, y, euros(p.precio), 9, false);
      LINE(M, y - 5, PW - M, '0.85');
      y -= 16;
    });
    if (y < M + 90) nuevaPagina(false);
    y -= 8;
    T(cols[3].x + 2, y, 'TOTAL PENDIENTE', 12, true);
    TR(PW - M - 2, y, euros(total), 12, true);
    y -= 30;

    const porCliente = {};
    pend.forEach(p => {
      const cli = clienteDe(p.clienteId);
      const clave = p.clienteId || '_';
      if (!porCliente[clave]) porCliente[clave] = { nombre: cli ? cli.nombre : '(cliente eliminado)', n: 0, total: 0 };
      porCliente[clave].n += 1; porCliente[clave].total += (p.precio || 0);
    });
    const grupos = Object.keys(porCliente).map(k => porCliente[k]);
    if (y < M + 60) nuevaPagina(false);
    T(M, y, 'Resumen por cliente', 12, true);
    y -= 20;
    grupos.forEach(g => {
      if (y < M + 30) nuevaPagina(false);
      T(M + 2, y, pdfRecortar(g.nombre, 34), 10, false);
      T(cols[3].x + 2, y, g.n + ' raqueta(s)', 10, false);
      TR(PW - M - 2, y, euros(g.total), 10, true);
      LINE(M, y - 5, PW - M, '0.9');
      y -= 16;
    });
  }
  pages.forEach((pg, i) => {
    ops = pg;
    T(PW - M - 60, 22, 'Página ' + (i + 1) + ' de ' + pages.length, 8, false);
  });

  const objs = [];
  const nImg = img ? 5 : 0;
  const primeraPag = img ? 6 : 5;
  const kids = pages.map((_, i) => (primeraPag + 2 * i + 1) + ' 0 R').join(' ');
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push('<< /Type /Pages /Kids [ ' + kids + ' ] /Count ' + pages.length + ' >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  if (img) {
    objs.push('<< /Type /XObject /Subtype /Image /Width ' + img.w + ' /Height ' + img.h + ' /ColorSpace /' + (img.comp === 1 ? 'DeviceGray' : 'DeviceRGB') + ' /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.bin.length + ' >>\nstream\n' + img.bin + '\nendstream');
  }
  const recursos = '/Resources << /Font << /F1 3 0 R /F2 4 0 R >>' + (img ? ' /XObject << /Im1 ' + nImg + ' 0 R >>' : '') + ' >>';
  pages.forEach((pg, i) => {
    const cs = pg.join('\n');
    objs.push('<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] ' + recursos + ' /Contents ' + (primeraPag + 2 * i) + ' 0 R >>');
  });
  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets = [];
  objs.forEach((body, i) => { offsets.push(out.length); out += (i + 1) + ' 0 obj\n' + body + '\nendobj\n'; });
  const xrefPos = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
  offsets.forEach(o => { out += String(o).padStart(10, '0') + ' 00000 n \n'; });
  out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF';
  const u8 = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) u8[i] = out.charCodeAt(i) & 255;
  return u8;
}
function abrirPdfPendientes() {

function getState() { return state; }
function setState(s) {

  state.clientes.forEach(c => {
    if (c.dni === undefined) c.dni = '';
    if (!c.numeroCliente) c.numeroCliente = siguienteNumeroCliente();
  });
  if (!Array.isArray(state.articulos)) state.articulos = [];
  if (!Array.isArray(state.proveedores)) state.proveedores = [];
  state.proveedores.forEach(p => { if (p.razonSocial === undefined) p.razonSocial = ''; });
  if (!Array.isArray(state.pedidosProveedor)) state.pedidosProveedor = [];
  state.pedidosProveedor.forEach(p => {
    if (!Array.isArray(p.recepciones)) p.recepciones = [];
    p.items.forEach(it => { if (it.cantidadRecibida === undefined) it.cantidadRecibida = 0; });
    if (p.estado === 'recibido' && !p.recepciones.length) {
      // Pedido antiguo (todo o nada): lo convertimos en una única recepción ya hecha.
      p.items.forEach(it => { it.cantidadRecibida = it.cantidad; });
      p.recepciones.push({ id: uid('recp'), fecha: p.fechaRecibido || p.fecha, items: p.items.map(it => ({ articuloId: it.articuloId, cantidad: it.cantidad })), movimientoId: p.movimientoId || null });
    }
    delete p.fechaRecibido;
    delete p.movimientoId;
  });
  // Pedidos a proveedor antiguos sin numerar: se numeran por orden cronologico dentro de cada año.
  const pedidosSinNumero = state.pedidosProveedor.filter(p => !p.numeroPedido);
  if (pedidosSinNumero.length) {
    pedidosSinNumero.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    const contadorPorAño = {};
    pedidosSinNumero.forEach(p => {
      const año = String(new Date(p.fecha || Date.now()).getFullYear()).slice(-2);
      contadorPorAño[año] = (contadorPorAño[año] || 0) + 1;
      p.numeroPedido = año + String(contadorPorAño[año]).padStart(3, '0');
    });
  }
  state.proveedores.forEach(p => {
    if (p.dni === undefined) p.dni = '';
    if (!p.numeroProveedor) p.numeroProveedor = siguienteNumeroProveedor();
    if (!Array.isArray(p.contactos)) {
      p.contactos = (p.contacto && p.contacto.trim()) ? [{ id: uid('cont'), nombre: p.contacto.trim(), telefono: '', email: '' }] : [];
    }
  });
  if (!Array.isArray(state.pedidos)) state.pedidos = [];
  if (!state.contabilidad) state.contabilidad = { movimientos: [] };
  if (!Array.isArray(state.contabilidad.movimientos)) state.contabilidad.movimientos = [];
  if (!Array.isArray(state.raquetasExtra)) state.raquetasExtra = [];
  // Migración: los cordajes vivían en un catálogo aparte; ahora son artículos marcados con "es cordaje".
  if (Array.isArray(s && s.cordajes) && s.cordajes.length) {
    s.cordajes.forEach(c => {
      state.articulos.push(Object.assign({ codigo: '', esCordaje: true, tipo: 'Cordaje', proveedores: [] }, c));
    });
  }
  delete state.cordajes;
  state.articulos.forEach(a => {
    if (a.codigo === undefined) a.codigo = '';
    if (a.esCordaje === undefined) a.esCordaje = false;
    if (!Array.isArray(a.proveedores)) a.proveedores = [];
    if (!a.unidad) a.unidad = a.esCordaje ? 'metros' : 'unidades';
    if (a.foto === undefined) a.foto = null;
    if (a.ventaOnline === undefined) a.ventaOnline = false;
  });
}

<script>
function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  const children = Array.prototype.slice.call(arguments, 2);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}
function field(labelText, inputNode) { return el('div', { class: 'field' }, el('label', {}, labelText), inputNode); }
function inputEl(type, value, onChange, extraAttrs) {
  const attrs = Object.assign({ type, value: value === undefined || value === null ? '' : value, onchange: (e) => onChange(e.target.value) }, extraAttrs || {});
  return el('input', attrs);
}
function selectEl(options, value, onChange) {
  const sel = el('select', { onchange: (e) => onChange(e.target.value) });
  options.forEach(opt => {
    const optEl = el('option', { value: opt.value }, opt.label);
    if (opt.value === value) optEl.setAttribute('selected', 'selected');
    sel.appendChild(optEl);
  });
  return sel;
}

  if (!fechaNacimiento) return '';
  const anoNac = parseInt(fechaNacimiento.slice(0, 4), 10);
  if (isNaN(anoNac)) return '';
  const edad = anoReferenciaTemporada() - anoNac;

  if (edad <= 12) return 'sub13';

function redimensionarImagen(file, maxAncho, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxAncho) { h = Math.round(h * maxAncho / w); w = maxAncho; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => callback(e.target.result);
    img.src = e.target.result;
  };
  reader.onerror = () => callback('');
  reader.readAsDataURL(file);
}
function normalizarNombre(str) {
  return String(str || '').trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}
function separarNombreApellidos(completo) {
  const partes = String(completo || '').trim().split(/\s+/);
  return partes.length > 1 ? { nombre: partes[0], apellidos: partes.slice(1).join(' ') } : { nombre: completo || '', apellidos: '' };
}

function nombreParticipantePublico(cat, id) {
  if (!id) return 'Por determinar';
  const p = (cat.players || []).find(x => x.id === id);
  return p ? p.name : '?';
}
function formatearSetsPublico(sets) {
  if (!sets || !sets.length) return '';
  return sets.filter(s => (s[0] || s[1])).map(s => s[0] + '-' + s[1]).join(', ');
}
function nombrePartidoPublico(p1n, p2n, ganadorEsP1, ganadorEsP2, onClickP1, onClickP2) {
  const estiloBase = 'cursor:pointer;text-decoration:underline;';
  const estiloGanador = estiloBase + 'font-weight:800;font-size:1.08em;color:var(--court-dark);';
  return el('span', {},
    el('span', { style: ganadorEsP1 ? estiloGanador : estiloBase, onclick: onClickP1 }, (ganadorEsP1 ? '🏆 ' : '') + p1n),
    ' vs ',
    el('span', { style: ganadorEsP2 ? estiloGanador : estiloBase, onclick: onClickP2 }, (ganadorEsP2 ? '🏆 ' : '') + p2n),
  );
}
let jugadorSeleccionadoPublico = '';
let mostrarTodoPublico = false;
let jugadorUrlAplicado = false;
function todosLosPartidosDePublico(st) {
  const partidos = [];
  (st.categories || []).filter(c => c.enabled).forEach(cat => {
    (cat.matches || []).forEach(m => {
      const nombreGrupo = (cat.groups && cat.groups[m.groupIndex]) ? cat.groups[m.groupIndex].name : null;
      partidos.push({ cat, m, ronda: nombreGrupo });
    });
    if (cat.knockout && cat.knockout.rounds) {
      cat.knockout.rounds.forEach(ronda => {
        const rondaLabel = (ronda[0] && ronda[0].round) ? ronda[0].round : '';
        ronda.forEach(m => partidos.push({ cat, m, ronda: rondaLabel }));
      });
    }
  });
  return partidos;
}
function nombresParticipantesPublico(st) {
  const nombres = new Set();
  (st.categories || []).filter(c => c.enabled).forEach(cat => {
    (cat.players || []).forEach(p => { if (p.name) nombres.add(p.name); });
  });
  return Array.from(nombres).sort((a, b) => a.localeCompare(b, 'es'));
}
function obtenerEstadoParaVistaPublica() {
  const params = new URLSearchParams(location.search);
  const torneoId = params.get('torneo');
  const historial = TorneoApp.getHistorial();
  if (torneoId) {
    const entrada = historial.find(t => t.id === torneoId);
    if (entrada && entrada.snapshot) {
      const esElActivo = torneoId === TorneoApp.getTorneoActivoId();
      return { st: esElActivo ? TorneoApp.getState() : entrada.snapshot, entrada };
    }
  }
  const idActivo = TorneoApp.getTorneoActivoId();
  const entradaActiva = historial.find(t => t.id === idActivo);
  return { st: TorneoApp.getState(), entrada: entradaActiva };
}
function todosLosTorneosParaBusqueda() {
  const historial = TorneoApp.getHistorial();
  const idActivo = TorneoApp.getTorneoActivoId();
  return historial.map(t => ({
    id: t.id, nombre: t.nombre, fechaInicio: t.fechaInicio, estado: t.estado,
    st: t.id === idActivo ? TorneoApp.getState() : t.snapshot,
  })).filter(t => t.st);
}
function historialDeJugadorGlobal(nombreJugador) {
  const torneos = todosLosTorneosParaBusqueda();
  const resultado = [];
  torneos.forEach(t => {
    const partidos = [];
    (t.st.categories || []).filter(c => c.enabled).forEach(cat => {
      const revisar = (m) => {
        const p1n = nombreParticipantePublico(cat, m.p1);
        const p2n = nombreParticipantePublico(cat, m.p2);
        if (p1n === nombreJugador) partidos.push({ cat, m, esP1: true });
        else if (p2n === nombreJugador) partidos.push({ cat, m, esP1: false });
      };
      (cat.matches || []).forEach(revisar);
      if (cat.knockout && cat.knockout.rounds) cat.knockout.rounds.forEach(ronda => ronda.forEach(revisar));
    });
    if (partidos.length) resultado.push({ torneo: t, partidos });
  });
  return resultado;
}
function calcularEstadisticasGlobales(historialJugador) {
  let jugados = 0, ganados = 0, perdidos = 0, pendientes = 0, setsGanados = 0, setsPerdidos = 0;
  historialJugador.forEach(({ partidos }) => {
    partidos.forEach(({ m, esP1 }) => {
      if (!m.winner) { pendientes++; return; }
      jugados++;
      const gane = (esP1 && m.winner === m.p1) || (!esP1 && m.winner === m.p2);
      if (gane) ganados++; else perdidos++;
      (m.sets || []).forEach(s => {
        if (!s) return;
        const misPts = esP1 ? s[0] : s[1];
        const susPts = esP1 ? s[1] : s[0];
        if (misPts > susPts) setsGanados++; else if (susPts > misPts) setsPerdidos++;
      });
    });
  });
  return { jugados, ganados, perdidos, pendientes, setsGanados, setsPerdidos };
}

function exportAll() {
  const combined = {
    club: clubGlobal,
    jugadoresGlobal: jugadoresGlobal,
    torneo: TorneoApp.getState(),
    torneosHistorial: TorneoApp.getHistorial(),
    torneoActivoId: TorneoApp.getTorneoActivoId(),
    planificacion: PlanApp.getState(),
    pagos: PagosApp.getState(),
    taller: TallerApp.getState(),
    planSensibles: PlanApp.getSensibles(),
  };
  const blob = new Blob([JSON.stringify(combined, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (clubGlobal.nombre || 'club').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  a.href = url;
  a.download = `badminton_${safeName || 'datos'}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importAll(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.torneo || !parsed.planificacion) throw new Error('formato no reconocido');
      clubGlobal = Object.assign({ nombre: '', localidad: '', temporadaInicio: '', temporadaFin: '', logo: '' }, parsed.club || {});
      jugadoresGlobal = parsed.jugadoresGlobal || [];
      saveClubGlobal(); saveJugadoresGlobal();
      TorneoApp.setState(parsed.torneo);
      if (parsed.torneosHistorial) TorneoApp.setHistorial(parsed.torneosHistorial);
      if (parsed.torneoActivoId) TorneoApp.setTorneoActivoId(parsed.torneoActivoId);
      PlanApp.setState(parsed.planificacion);
      if (parsed.planSensibles) PlanApp.setSensibles(parsed.planSensibles);
      if (parsed.pagos) PagosApp.setState(parsed.pagos);
      if (parsed.taller) TallerApp.setState(parsed.taller);
      showSection('home');
    } catch (err) {
      alert('No se ha podido importar el fichero: formato no válido.');
    }
  };
  reader.readAsText(file);
}

// la propia app genera cada vez que se guardan cambios.
function docPublico() { return firebaseDb.collection('publico').doc('datos'); }
const CLAVES_PRIVADAS_PUBLICO = /^(email.*|telefono.*|movil|phone|dni|nif|nie|fechaNacimiento.*|parejaFechaNacimiento|direccion|iban|pin|nss)$/i;
function sanearPublico(v) {
  if (Array.isArray(v)) return v.map(sanearPublico);
  if (v && typeof v === 'object') {
    const out = {};
    Object.keys(v).forEach(k => { if (!CLAVES_PRIVADAS_PUBLICO.test(k)) out[k] = sanearPublico(v[k]); });
    return out;
  }
  return v;
}
function estadoPublicoParaNube() {
  const t = TallerApp.getState() || {};
  const cfg = t.config || {};
  const taller = {
    config: {
      nombreTaller: cfg.nombreTaller || '', tiempoMedioMinutos: cfg.tiempoMedioMinutos || 35,
      enlacePago: cfg.enlacePago || '', telefonoTienda: cfg.telefonoTienda || '',
      tieneLogoTaller: !!cfg.logoTaller, tieneTarjetaVisita: !!cfg.tarjetaVisitaFoto, logoTaller: null, tarjetaVisitaFoto: null,
    },
    pedidos: (t.pedidos || []).map(p => ({
      id: p.id, estado: p.estado, marcaModelo: p.marcaModelo, clienteId: p.clienteId, cordajeId: p.cordajeId, cordajeIdH: p.cordajeIdH,
      tensionVertical: p.tensionVertical, tensionHorizontal: p.tensionHorizontal, horaLlegada: p.horaLlegada, fechaEntrega: p.fechaEntrega,
      precio: p.precio, pagado: p.pagado, aplazado: p.aplazado, tieneFotoDespues: !!p.fotoDespues, fotoAntes: null, fotoDespues: null,
    })),
    clientes: (t.clientes || []).map(c => ({ id: c.id, nombre: c.nombre })),
    articulos: (t.articulos || []).map(a => {
      const o = Object.assign({}, a, { foto: null, tieneFoto: !!a.foto });
      Object.keys(o).forEach(k => { if (/coste|costo|compra|proveedor|margen/i.test(k)) delete o[k]; });
      return o;
    }),
  };
  // El taller ya va filtrado campo a campo arriba; a los torneos se les quitan los datos personales de los participantes.
  return {
    club: { nombre: clubGlobal.nombre || '', localidad: clubGlobal.localidad || '', logo: clubGlobal.logo || '', temporadaInicio: clubGlobal.temporadaInicio || '', temporadaFin: clubGlobal.temporadaFin || '' },
    torneo: sanearPublico(TorneoApp.getState()),
    torneosHistorial: sanearPublico(TorneoApp.getHistorial()),
    torneoActivoId: TorneoApp.getTorneoActivoId(),
    taller,
    actualizadoEn: Date.now(),
  };
}
let publicoTimer = null;
function subirCopiaPublica() {
  if (!firebaseDisponible || esVistaPublica()) return;
  if (typeof esTrabajador === 'function' && esTrabajador()) return;
  clearTimeout(publicoTimer);
  publicoTimer = setTimeout(() => {
    try {
      const payload = envolverArraysAnidados(JSON.parse(JSON.stringify(estadoPublicoParaNube())));
      if (JSON.stringify(payload).length > 900000) { console.warn('Copia pública demasiado grande'); return; }
      docPublico().set(payload).catch(err => console.warn('No se pudo actualizar la copia pública:', err));
    } catch (e) { console.warn('Error preparando la copia pública:', e); }
  }, 1500);
}

// cada persona tiene su propia cuenta de Firebase, creada automáticamente por el administrador.
// Mientras no exista la lista pública de accesos (publico/acceso), la app funciona como antes (PIN local).
const ADMIN_EMAIL = 'gerardoortega74@gmail.com';
const DOMINIO_CUENTAS = 'cuentas.badminton-olimpia.app';
let authDisponible = false;
let modoAuth = false;
let accesoPublico = [];
let estadosCuentas = {};
function authFb() { return firebase.auth(); }
function inicializarAuth() {
  try { if (firebaseDisponible && typeof firebase.auth === 'function') { firebase.auth(); authDisponible = true; } }
  catch (e) { console.warn('Cuentas no disponibles:', e); authDisponible = false; }
}
function derivarClave(pin, usuarioId) { return 'Olimpia#' + pin + '#' + usuarioId; }
function docAccesoPublico() { return firebaseDb.collection('publico').doc('acceso'); }
function coleccionRoles() { return firebaseDb.collection('roles'); }

function docHorarioTrabajador(usuarioId) { return docNube().collection('ch_horarios').doc(usuarioId); }
function mensajeErrorAuth(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Datos incorrectos.';
  if (/too-many-requests/.test(c)) return 'Demasiados intentos seguidos. Espera unos minutos y vuelve a probar.';
  if (/network/.test(c)) return 'Sin conexión. Comprueba internet.';
  if (/email-already-in-use/.test(c)) return 'Esa cuenta ya existe: usa "Entrar".';
  if (/weak-password/.test(c)) return 'La contraseña es demasiado débil (mínimo 8 caracteres).';
  if (/invalid-email/.test(c)) return 'El email no es válido.';
  if (/requires-recent-login/.test(c)) return 'Por seguridad, sal y vuelve a entrar antes de cambiar el PIN.';
  return 'Error: ' + ((e && e.message) || c || 'desconocido');
}
function adminEnAccessControl() { return accessControl.usuarios.find(u => u.rol === 'admin') || null; }

// ---------- Arranque con cuentas ----------
function arranqueConCuentas(arranqueLegado) {
  marcarEstadoNube('☁️ Conectando…');
  let primera = true;
  authFb().onAuthStateChanged(user => {
    if (!primera) { if (user && modoAuth && !sesionActual) entrarConCuenta(user); return; }
    primera = false;
    if (user) { modoAuth = true; entrarConCuenta(user); return; }
    docAccesoPublico().get().then(d => {
      const lista = d.exists ? desenvolverArraysAnidados(d.data()).usuarios : null;
      if (Array.isArray(lista)) {
        modoAuth = true; accesoPublico = lista; sesionActual = null; saveSesion();
        cargarClubPublico().then(() => { marcarEstadoNube(''); mostrarLogin(); });
      } else arranqueLegado();
    }).catch(() => arranqueLegado());
  });
}

function entrarConCuenta(user) {
  marcarEstadoNube('☁️ Conectando…');
  const pantallaLogin = document.getElementById('loginScreen');
  pantallaLogin.innerHTML = ''; pantallaLogin.style.display = 'none';
  if ((user.email || '').toLowerCase() === ADMIN_EMAIL) {
    sesionActual = { id: 'admin', nombre: 'Administrador', rol: 'admin', uid: user.uid };
    cargarDatosClubCompletos().then(() => {
      const a = adminEnAccessControl();
      sesionActual = { id: a ? a.id : 'admin', nombre: a ? a.nombre : 'Administrador', rol: 'admin', uid: user.uid };
      saveSesion();
      arrancarAppLocal();
      sincronizarCuentas();
      chCargarConfig().then(publicarHorariosTrabajadores).catch(() => {});
    }).catch(e => errorDeEntrada('No se pudieron cargar los datos del club: ' + mensajeErrorAuth(e)));
    return;
  }
  coleccionRoles().doc(user.uid).get().then(r => {
    if (!r.exists) { errorDeEntrada('Tu acceso no está activo. Avisa al administrador del club.'); return; }
    const d = r.data();
    sesionActual = { id: d.usuarioId, nombre: d.nombre, rol: d.rol, uid: user.uid };
    saveSesion();
    const continuar = () => {
      if (d.rol === 'trabajador') { limpiarDatosLocalesClub(); cargarClubPublico().then(() => { marcarEstadoNube(''); showSection('fichar'); }); }
      else cargarDatosClubCompletos().then(arrancarAppLocal).catch(e => errorDeEntrada('No se pudieron cargar los datos del club: ' + mensajeErrorAuth(e)));
    };
    if (!d.provisional) { continuar(); return; }
    coleccionEstadoCuentas().doc(d.usuarioId).get().then(e => {
      if (e.exists && e.data().version === d.version) continuar();
      else pantallaCambiarPinCuenta(d, continuar);
    }).catch(() => pantallaCambiarPinCuenta(d, continuar));
  }).catch(e => errorDeEntrada(mensajeErrorAuth(e)));
}
function pantallaCambiarPinCuenta(d, alTerminar) {
  const root = document.getElementById('loginScreen');
  SCREENS.forEach(id => { const e = document.getElementById(id); if (e) e.style.display = 'none'; });
  root.style.display = 'block'; root.innerHTML = '';
  const p1 = el('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: 'Nuevo PIN (4 a 8 cifras)', style: 'font-size:20px;text-align:center;-webkit-text-security:disc;' });
  const p2 = el('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: 'Repite el PIN', style: 'font-size:20px;text-align:center;-webkit-text-security:disc;' });
  const err = el('div', { class: 'sub', style: 'color:#B3261E;min-height:18px;' });
  const btn = el('button', { class: 'btn btn-primary', onclick: () => {
    err.textContent = '';
    if (!/^\d{4,8}$/.test(p1.value)) { err.textContent = 'El PIN debe tener entre 4 y 8 cifras.'; return; }
    if (p1.value !== p2.value) { err.textContent = 'Los dos PIN no coinciden.'; return; }
    btn.disabled = true;
    authFb().currentUser.updatePassword(derivarClave(p1.value, d.usuarioId))
      .then(() => coleccionEstadoCuentas().doc(d.usuarioId).set({ version: d.version, cambiadoEn: Date.now() }))
      .then(() => { root.style.display = 'none'; alTerminar(); })
      .catch(e => { btn.disabled = false; err.textContent = mensajeErrorAuth(e); });
  } }, 'Guardar mi PIN');
  root.appendChild(el('div', { class: 'login-card' }, el('h2', {}, 'Hola, ' + d.nombre),
    el('div', { class: 'sub', style: 'margin-bottom:10px;' }, 'Es tu primera vez. Elige tu PIN personal: lo usarás siempre para entrar.'),
    field('Nuevo PIN', p1), field('Repítelo', p2), err, el('div', { class: 'toolbar' }, btn)));
  p1.focus();

function formularioCuentaAdmin(contenedor, opciones) {

    if ((email.value || '').trim().toLowerCase() !== ADMIN_EMAIL) { ponMsg('Solo se puede crear la cuenta del administrador del club.'); return; }

      .then(cred => cred.user.emailVerified ? null : cred.user.sendEmailVerification().catch(() => {}))
      .then(() => { ponMsg('✅ Cuenta lista. Te hemos enviado un email para confirmarla. Recargando…', true); setTimeout(() => location.reload(), 1800); })
      .catch(e => ponMsg(mensajeErrorAuth(e)));

      el('button', { class: 'btn btn-primary', onclick: entrar }, 'Entrar'),

    contenedor.appendChild(el('details', { style: 'margin-top:8px;' }, el('summary', { style: 'cursor:pointer;font-size:13px;' }, 'Es mi primera vez: crear mi cuenta'),
      el('div', { class: 'sub', style: 'margin:6px 0;' }, 'Escribe arriba la contraseña que quieras, repítela aquí y pulsa Crear.'),

// ---------- Cuentas de los usuarios (las crea el administrador) ----------
let appSecundaria = null;
function obtenerAppSecundaria() {
  if (!appSecundaria) appSecundaria = firebase.initializeApp(firebaseConfig, 'cuentas');
  return appSecundaria;
}
let sincronizandoCuentas = false, sincronizarCuentasTimer = null;
function programarSincronizarCuentas() { clearTimeout(sincronizarCuentasTimer); sincronizarCuentasTimer = setTimeout(sincronizarCuentas, 800); }
async function sincronizarCuentas() {
  if (!modoAuth || !esAdmin() || sincronizandoCuentas) return;
  sincronizandoCuentas = true;
  let cambios = false;
  try {
    const app2 = obtenerAppSecundaria();
    for (const u of accessControl.usuarios) {
      if (u.rol === 'admin') continue;
      if (!u.authEmail) {
        const version = (u.authVersion || 0) + 1;
        const email = ('u' + version + '-' + u.id).toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@' + DOMINIO_CUENTAS;
        let uid = null;
        try { uid = (await app2.auth().createUserWithEmailAndPassword(email, derivarClave(u.pin, u.id))).user.uid; }
        catch (e) {
          if (/email-already-in-use/.test(e.code || '')) {
            try { uid = (await app2.auth().signInWithEmailAndPassword(email, derivarClave(u.pin, u.id))).user.uid; }
            catch (e2) { u.authVersion = version; cambios = true; continue; } // la próxima vez se crea con otra versión
          } else throw e;
        }
        await app2.auth().signOut().catch(() => {});
        await coleccionRoles().doc(uid).set({ rol: u.rol, usuarioId: u.id, nombre: u.nombre, version, provisional: !!u.provisional });
        if (u.authUid && u.authUid !== uid) await coleccionRoles().doc(u.authUid).delete().catch(() => {});
        Object.assign(u, { authEmail: email, authUid: uid, authVersion: version, authRol: u.rol, authNombre: u.nombre });
        cambios = true;
      } else if (u.authRol !== u.rol || u.authNombre !== u.nombre) {
        await coleccionRoles().doc(u.authUid).set({ rol: u.rol, usuarioId: u.id, nombre: u.nombre, version: u.authVersion, provisional: !!u.provisional });
        u.authRol = u.rol; u.authNombre = u.nombre; cambios = true;
      }
    }
    const vivos = new Set(accessControl.usuarios.map(u => u.authUid).filter(Boolean));
    const snap = await coleccionRoles().get();
    const borrar = []; snap.forEach(d => { if (!vivos.has(d.id)) borrar.push(d.id); });
    for (const id of borrar) await coleccionRoles().doc(id).delete().catch(() => {});
  } catch (e) {
    console.warn('No se pudieron sincronizar las cuentas:', e);
  } finally {
    sincronizandoCuentas = false;
    if (cambios) saveAccessControl(); else subirAccesoPublico();
  }
}
function subirAccesoPublico() {
  if (!modoAuth || !esAdmin() || !firebaseDisponible) return;
  const usuarios = accessControl.usuarios.filter(u => u.rol !== 'admin' && u.authEmail).map(u => ({ id: u.id, nombre: u.nombre, rol: u.rol, authEmail: u.authEmail }));
  docAccesoPublico().set({ usuarios, actualizadoEn: Date.now() }).catch(e => console.warn('No se pudo publicar la lista de accesos:', e));
}
// Horario de cada trabajador en su propio documento: así su móvil no necesita leer la configuración de todos.

    chMensajePendiente = (tipo === 'entrada' ? 'Entrada' : 'Salida') + ' fichada a las ' + chHora(ahora) + (gps.error ? '. No se pudo guardar la ubicación: ' + gps.error : '.');

// Se guarda en un documento aparte (club/datos/ch_config/general), solo lo edita el administrador.
const CH_DIAS = [['1', 'Lunes'], ['2', 'Martes'], ['3', 'Miércoles'], ['4', 'Jueves'], ['5', 'Viernes'], ['6', 'Sábado'], ['7', 'Domingo']];

}
function chCargarConfig() {

}
function chMinutos(hhmm) { if (!hhmm || hhmm.indexOf(':') < 0) return null; const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }

  if (!chConfig) return null;

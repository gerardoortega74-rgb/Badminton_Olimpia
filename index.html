<title>Bádminton · Club</title>
<style>
:root{
  --court:#1B4332; --court-dark:#0F2A1E; --line:#F7F5F0; --gold:#E8B924; --gold-dark:#C9971A;
  --ink:#1C1C1C; --muted:#6B7A72; --panel:#FFFFFF; --bg:#F2F1EA; --danger:#B3261E; --ok:#2D6A4F;
  --info:#2B6CB0; --info-bg:#E7F0FA; --radius:10px; --shadow:0 2px 8px rgba(15,42,30,0.12);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;}
header.app-header{
  background:linear-gradient(135deg,var(--court) 0%,var(--court-dark) 100%);color:var(--line);
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  box-shadow:var(--shadow);position:relative;
}
header.app-header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 24px, transparent 24px 40px);opacity:.9;}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-badge{width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.brand h1{font-size:18px;margin:0;letter-spacing:.3px;font-weight:700;}
.brand small{display:block;color:#CFE8DA;font-weight:400;font-size:12px;}
nav.tabs{display:flex;gap:4px;background:var(--court-dark) linear-gradient(to left, rgba(0,0,0,0.4), rgba(0,0,0,0) 28px) right center no-repeat;background-size:34px 100%;padding:6px 14px;overflow-x:auto;}
nav.tabs button{border:none;background:transparent;color:#CFE8DA;padding:10px 13px;font-size:12.5px;font-weight:600;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;}
nav.tabs button.active{background:var(--bg);color:var(--court-dark);}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}

.panel h2{margin:0 0 4px;font-size:17px;color:var(--court-dark);}
.panel h3{font-size:14px;color:var(--court-dark);margin:16px 0 6px;}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
label{display:block;font-size:12px;font-weight:700;color:var(--court-dark);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:9px 10px;border:1px solid #D8D5CB;border-radius:7px;font-size:14px;background:#FBFAF7;font-family:inherit;
}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.field{margin-bottom:10px;}
.btn{border:none;border-radius:7px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--court);color:#fff;}
.btn-primary:hover{background:var(--court-dark);}
.btn-gold{background:var(--gold);color:var(--court-dark);}
.btn-gold:hover{background:var(--gold-dark);}
.btn-ghost{background:transparent;color:var(--court);border:1px solid var(--court);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;max-width:100%;}
body.solo-lectura input:not([type=file]), body.solo-lectura select, body.solo-lectura textarea{pointer-events:none;background:#ECE9DE;opacity:0.75;}
body.solo-lectura .btn-danger{display:none !important;}
.lectura-banner{background:#7A5B00;color:#fff;text-align:center;padding:8px;font-size:12.5px;font-weight:700;}
.login-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:360px;margin:40px auto;}
.login-userbtn{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:8px;border:1px solid #E4E1D6;background:#FBFAF7;font-size:14px;font-weight:700;color:var(--court-dark);cursor:pointer;}
.login-userbtn:hover{border-color:var(--gold);}
th,td{padding:7px 8px;border-bottom:1px solid #ECE9DE;text-align:left;vertical-align:top;}
th{background:#F5F3EB;color:var(--court-dark);font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
.chip{display:inline-block;background:var(--court);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
.chip-gold{background:var(--gold);color:var(--court-dark);}
.chip-muted{background:#DEDBD0;color:var(--muted);}
.card{border:1px solid #E4E1D6;border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card-title{font-weight:700;color:var(--court-dark);font-size:14px;}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted);font-size:14px;}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;}
.msg-warn{background:#FBF1D9;color:#7A5B00;border:1px solid #F0D98A;}
.msg-ok{background:#E4F3E9;color:#1E5B3C;border:1px solid #B7DEC5;}
.msg-info{background:var(--info-bg);color:var(--info);border:1px solid #BBD6EE;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat-card{background:var(--court);color:#fff;border-radius:var(--radius);padding:14px;}
.stat-card .num{font-size:24px;font-weight:800;color:var(--gold);}
.stat-card .lab{font-size:11.5px;color:#CFE8DA;text-transform:uppercase;}
footer.hint{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
.phase-bar{display:flex;border-radius:8px;overflow:hidden;margin-bottom:6px;height:34px;box-shadow:var(--shadow);}
.phase-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.source-note{font-size:11.5px;color:var(--muted);margin-top:14px;border-top:1px dashed #DDD8C9;padding-top:10px;}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.day-box{border:1px solid #E4E1D6;border-radius:8px;padding:10px;background:#FBFAF7;}
.day-box h4{margin:0 0 6px;font-size:12.5px;color:var(--court-dark);text-transform:uppercase;}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.group-box{border:1px solid #E4E1D6;border-radius:var(--radius);overflow:hidden;}
.group-box h3{margin:0;background:var(--court);color:#fff;padding:8px 12px;font-size:13px;}
.group-box .content{padding:10px;}
.match-card{border:1px solid #E4E1D6;border-radius:8px;padding:10px;margin-bottom:8px;background:#FBFAF7;}
.match-card.done{border-color:var(--ok);background:#F1F8F4;}
.match-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;font-weight:700;}
.match-players{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;}
.match-players .vs{color:var(--muted);font-weight:400;font-size:12px;}
.sched-grid{display:grid;border:1px solid #E4E1D6;border-radius:var(--radius);overflow:hidden;}
.sched-row{display:grid;grid-template-columns:90px repeat(var(--ncourts,1),1fr);border-bottom:1px solid #ECE9DE;}
.sched-row:last-child{border-bottom:none;}
.sched-time{background:#F5F3EB;padding:8px;font-size:12px;font-weight:700;color:var(--court-dark);display:flex;align-items:center;}
.sched-cell{padding:8px;border-left:1px solid #ECE9DE;font-size:12px;min-height:52px;}
.sched-match{background:var(--court);color:#fff;border-radius:6px;padding:6px 8px;font-size:11.5px;line-height:1.35;}
.sched-match.ko{background:var(--gold);color:var(--court-dark);}
.bracket{display:flex;gap:26px;overflow-x:auto;padding:10px 4px 20px;}
.bracket-round{display:flex;flex-direction:column;justify-content:space-around;gap:16px;min-width:180px;}
.bracket-round h4{font-size:11px;color:var(--muted);text-transform:uppercase;margin:0 0 4px;}
.bracket-match{border:1px solid #E4E1D6;border-radius:8px;background:#FBFAF7;font-size:12.5px;overflow:hidden;}
.bracket-match .p{padding:6px 8px;border-bottom:1px solid #ECE9DE;display:flex;justify-content:space-between;}
.bracket-match .p:last-child{border-bottom:none;}
.bracket-match .p.winner{background:#EAF5EE;font-weight:700;}
.modal-bg{position:fixed;inset:0;background:rgba(15,42,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto;}
.modal h3{margin-top:0;color:var(--court-dark);}
.set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.set-row input{width:70px;text-align:center;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:6px;}

.home-card p{margin:0;color:var(--muted);font-size:13px;}
.club-banner{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.club-banner .info{font-size:13.5px;color:var(--court-dark);display:flex;align-items:center;gap:14px;}
.club-banner .info b{font-size:19px;}
.club-banner .logo-big{width:64px;height:64px;border-radius:12px;object-fit:cover;box-shadow:var(--shadow);flex-shrink:0;}
.club-banner .logo-big-emoji{width:64px;height:64px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
@media print{header.app-header,nav.tabs,.toolbar,.no-print{display:none !important;}body{background:#fff;}}

<script>
window.TorneoApp = (function () {
const CATEGORY_DEFS = [
  { id: 'IM', name: 'Individual Masculino', kind: 'single' },
  { id: 'IF', name: 'Individual Femenino', kind: 'single' },
  { id: 'DM', name: 'Dobles Masculino', kind: 'double' },
  { id: 'DF', name: 'Dobles Femenino', kind: 'double' },
  { id: 'DX', name: 'Dobles Mixto', kind: 'double' },
];

function defaultCategoryState(def) {
  return {
    id: def.id,
    name: def.name,
    kind: def.kind,
    enabled: false,
    numGroups: 2,
    qualifiersPerGroup: 2,
    players: [],
    groups: null,
    matches: [],
    knockout: null,
  };
}

function loadState() {
  return {
    meta: { title: '', date: '' },
    config: {
      courts: 4,
      matchMinutes: 25,
      bufferMinutes: 5,
      startTime: '09:00',
    },
    categories: CATEGORY_DEFS.map(defaultCategoryState),
  };
}

let state = loadState();
let activeTab = 'config';
let uidCounter = 1;
function uid(prefix) { return prefix + '_' + (uidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }

function getCategory(catId) { return state.categories.find(c => c.id === catId); }
function generarPlantillaExcelExterno() {
  if (typeof XLSX === 'undefined') { alert('No se ha podido cargar el generador de Excel. Comprueba tu conexión a internet e inténtalo de nuevo.'); return; }
  const datos = [
    ['Categoría', 'Nombre', 'Apellidos', 'Sexo (M/F)', 'Club', 'Nombre pareja (solo dobles)', 'Apellidos pareja (solo dobles)', 'Teléfono', 'Email'],
    ['Individual Masculino', 'Juan', 'Pérez López', 'M', 'CB Ejemplo', '', '', '600111222', 'juan@ejemplo.com'],
    ['Dobles Mixto', 'Ana', 'García Ruiz', 'F', 'CB Ejemplo', 'Luis', 'Martín Soto', '600333444', 'ana@ejemplo.com'],
  ];
  const ws = XLSX.utils.aoa_to_sheet(datos);
  ws['!cols'] = [{ wch: 22 }, { wch: 14 }, { wch: 18 }, { wch: 12 }, { wch: 20 }, { wch: 24 }, { wch: 24 }, { wch: 14 }, { wch: 22 }];
  const instrucciones = XLSX.utils.aoa_to_sheet([
    ['Instrucciones para rellenar esta plantilla'],
    [''],
    ['1. Una fila por jugador (o por pareja, en categorías de dobles).'],
    ['2. En la columna "Categoría" escribe exactamente uno de estos nombres:'],
    ['   Individual Masculino'],
    ['   Individual Femenino'],
    ['   Dobles Masculino'],
    ['   Dobles Femenino'],
    ['   Dobles Mixto'],
    ['3. En categorías de dobles, rellena también el Nombre y Apellidos de la pareja en la misma fila.'],
    ['4. Borra las 2 filas de ejemplo de la hoja "Participantes" antes de enviarnos el archivo.'],
    ['5. No cambies los nombres de las columnas ni el nombre de la hoja "Participantes".'],
  ]);
  instrucciones['!cols'] = [{ wch: 80 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, instrucciones, 'Instrucciones');

  const nombreArchivo = 'plantilla_participantes_' + (clubGlobal.nombre || 'torneo').replace(/[^a-z0-9]+/gi, '_').toLowerCase() + '.xlsx';
  XLSX.writeFile(wb, nombreArchivo);
}
function importarParticipantesExternos(file) {
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('No se ha podido cargar el lector de Excel. Comprueba tu conexión a internet e inténtalo de nuevo.'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheetName = workbook.SheetNames.find(n => n.toLowerCase().includes('particip')) || workbook.SheetNames[workbook.SheetNames.length - 1];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      let anadidos = 0, saltados = 0;
      const mapaCategorias = {};
      CATEGORY_DEFS.forEach(c => { mapaCategorias[c.name.toLowerCase()] = c; });
      rows.forEach(row => {
        const catNombre = String(row['Categoría'] || row['Categoria'] || '').trim().toLowerCase();
        const def = mapaCategorias[catNombre];
        if (!def) { saltados++; return; }
        let cat = getCategory(def.id);
        if (!cat) { saltados++; return; }
        if (!cat.enabled) cat.enabled = true;
        const nombre = String(row['Nombre'] || '').trim();
        const apellidos = String(row['Apellidos'] || '').trim();
        const club = String(row['Club'] || '').trim();
        if (!nombre) { saltados++; return; }
        const nombreCompleto = (nombre + ' ' + apellidos).trim();
        if (def.kind === 'double') {
          const nombrePareja = String(row['Nombre pareja (solo dobles)'] || row['Nombre pareja'] || '').trim();
          const apellidosPareja = String(row['Apellidos pareja (solo dobles)'] || row['Apellidos pareja'] || '').trim();
          if (!nombrePareja) { saltados++; return; }
          const nombreParejaCompleto = (nombrePareja + ' ' + apellidosPareja).trim();
          const nombreFinal = nombreCompleto + ' / ' + nombreParejaCompleto;
          if (cat.players.some(p => p.name === nombreFinal)) { saltados++; return; }
          cat.players.push({ id: uid('pl'), name: nombreFinal, seed: false, club: club, externo: true });
        } else {
          if (cat.players.some(p => p.name === nombreCompleto)) { saltados++; return; }
          cat.players.push({ id: uid('pl'), name: nombreCompleto, seed: false, club: club, externo: true });
        }
        anadidos++;
      });
      saveLocal();
      render();
      alert('Importación completada.\n\nAñadidos: ' + anadidos + '\nSaltados (categoría no reconocida, fila vacía o ya existente): ' + saltados);
    } catch (err) {
      alert('No se ha podido leer el archivo. Asegúrate de usar la plantilla generada por la app (botón "Generar plantilla").\n\nDetalle: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
function jugadoresDestacadosHistoricos(catId) {
  const destacados = new Set();
  if (!torneosHistorial || !torneosHistorial.length) return destacados;
  const candidatos = torneosHistorial
    .filter(t => t.snapshot && t.snapshot.categories)
    .slice()
    .sort((a, b) => (b.fechaFin || '').localeCompare(a.fechaFin || ''));
  for (const t of candidatos) {
    const cat = t.snapshot.categories.find(c => c.id === catId);
    if (!cat || !cat.players || !cat.players.length) continue;
    cat.players.forEach(p => {
      if (p.seed) {
        if (p.jugadorId) destacados.add(p.jugadorId);
        if (p.jugador1Id) destacados.add(p.jugador1Id);
        if (p.jugador2Id) destacados.add(p.jugador2Id);
      }
    });
    if (cat.knockout && cat.knockout.rounds && cat.knockout.rounds.length) {
      const ultimaRonda = cat.knockout.rounds[cat.knockout.rounds.length - 1];
      const final = ultimaRonda && ultimaRonda[0];
      if (final && final.winner) {
        const ganador = cat.players.find(p => p.id === final.winner);
        if (ganador) {
          if (ganador.jugadorId) destacados.add(ganador.jugadorId);
          if (ganador.jugador1Id) destacados.add(ganador.jugador1Id);
          if (ganador.jugador2Id) destacados.add(ganador.jugador2Id);
        }
      }
    }
    if (destacados.size) break;
  }
  return destacados;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normName(n) { return (n || '').trim().toLowerCase(); }
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minutesToTime(mins) {
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function playerName(cat, playerId) {
  if (playerId === 'BYE') return 'Exento';
  if (!playerId) return '—';
  const p = cat.players.find(p => p.id === playerId);
  return p ? p.name : '—';
}

function drawGroups(catId) {
  const cat = getCategory(catId);
  if (!cat) return;
  const numGroups = Math.max(1, cat.numGroups);
  const groups = Array.from({ length: numGroups }, (_, i) => ({
    name: 'Grupo ' + String.fromCharCode(65 + i),
    playerIds: [],
  }));

  const seeds = cat.players.filter(p => p.seed);
  const rest = shuffle(cat.players.filter(p => !p.seed));

  seeds.forEach((p, idx) => {
    groups[idx % numGroups].playerIds.push(p.id);
  });
  let dir = 1, g = 0;
  rest.forEach((p) => {
    groups[g].playerIds.push(p.id);
    g += dir;
    if (g >= numGroups) { g = numGroups - 1; dir = -1; }
    else if (g < 0) { g = 0; dir = 1; }
  });

  cat.groups = groups;
  cat.matches = generateGroupMatches(cat);
  cat.knockout = null;
}

function generateGroupMatches(cat) {
  const matches = [];
  cat.groups.forEach((grp, gIdx) => {
    const ids = grp.playerIds;
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        matches.push({
          id: uid('gm'),
          categoryId: cat.id,
          phase: 'group',
          groupIndex: gIdx,
          p1: ids[i],
          p2: ids[j],
          sets: [],
          winner: null,
          court: null,
          time: null,
        });
      }
    }
  });
  return matches;
}

function buildSchedule() {
  const numCourts = Math.max(1, state.config.courts);
  const slotLen = Math.max(5, state.config.matchMinutes) + Math.max(0, state.config.bufferMinutes);
  const startMin = timeToMinutes(state.config.startTime || '09:00');

  enabledCategories().forEach(cat => {
    (cat.matches || []).forEach(m => { m.court = null; m.time = null; });
    if (cat.knockout) {
      cat.knockout.rounds.forEach(round => round.forEach(m => { m.court = null; m.time = null; }));
    }
  });

  const groupQueue = [];
  const maxLen = Math.max.apply(null, [0].concat(enabledCategories().map(c => c.matches.length)));
  for (let i = 0; i < maxLen; i++) {
    enabledCategories().forEach(cat => {
      if (cat.matches[i]) groupQueue.push({ cat, match: cat.matches[i] });
    });
  }

  const koQueue = [];
  enabledCategories().forEach(cat => {
    if (cat.knockout) {
      cat.knockout.rounds.forEach(round => {
        round.forEach(m => {
          if (m.p1 && m.p2 && m.p1 !== 'BYE' && m.p2 !== 'BYE') koQueue.push({ cat, match: m });
        });
      });
    }
  });

  const slots = [];
  function ensureSlot(i) {
    while (slots.length <= i) slots.push({ courtsUsed: 0, busyNames: new Set() });
    return slots[i];
  }

  function scheduleQueue(queue, startSlotIndex) {
    let lastUsedSlot = startSlotIndex - 1;
    queue.forEach(({ cat, match }) => {
      const n1 = normName(playerName(cat, match.p1));
      const n2 = normName(playerName(cat, match.p2));
      let placed = false;
      let i = startSlotIndex;
      while (!placed) {
        const slot = ensureSlot(i);
        const conflict = slot.busyNames.has(n1) || slot.busyNames.has(n2);
        if (!conflict && slot.courtsUsed < numCourts) {
          match.court = slot.courtsUsed + 1;
          match.time = minutesToTime(startMin + i * slotLen);
          slot.courtsUsed += 1;
          slot.busyNames.add(n1);
          slot.busyNames.add(n2);
          placed = true;
          if (i > lastUsedSlot) lastUsedSlot = i;
        }
        i++;
      }
    });
    return lastUsedSlot;
  }

  const lastGroupSlot = scheduleQueue(groupQueue, 0);
  scheduleQueue(koQueue, lastGroupSlot + 1);
}

function setWinnerFromSets(match) {
  let w1 = 0, w2 = 0;
  match.sets.forEach(s => {
    if (s[0] > s[1]) w1++;
    else if (s[1] > s[0]) w2++;
  });
  if (w1 === w2) { match.winner = null; return; }
  match.winner = w1 > w2 ? match.p1 : match.p2;
}

function computeStandings(cat, groupIndex) {
  const grp = cat.groups[groupIndex];
  const table = {};
  grp.playerIds.forEach(id => {
    table[id] = { id, PJ: 0, PG: 0, PP: 0, SF: 0, SC: 0, GF: 0, GC: 0, Pts: 0 };
  });
  cat.matches.filter(m => m.groupIndex === groupIndex && m.winner).forEach(m => {
    const r1 = table[m.p1], r2 = table[m.p2];
    if (!r1 || !r2) return;
    let s1 = 0, s2 = 0;
    m.sets.forEach(s => {
      r1.GF += s[0]; r1.GC += s[1];
      r2.GF += s[1]; r2.GC += s[0];
      if (s[0] > s[1]) s1++; else if (s[1] > s[0]) s2++;
    });
    r1.PJ++; r2.PJ++;
    r1.SF += s1; r1.SC += s2;
    r2.SF += s2; r2.SC += s1;
    if (m.winner === m.p1) { r1.PG++; r2.PP++; } else { r2.PG++; r1.PP++; }
    r1.Pts = r1.PG * 2 + r1.PP * 0;
    r2.Pts = r2.PG * 2 + r2.PP * 0;
  });

  const rows = Object.values(table).map(r => {
    const copy = {};
    for (const k in r) copy[k] = r[k];
    copy.name = playerName(cat, r.id);
    copy.diffSets = r.SF - r.SC;
    copy.diffGames = r.GF - r.GC;
    return copy;
  });
  rows.sort((a, b) => (b.Pts - a.Pts) || (b.diffSets - a.diffSets) || (b.diffGames - a.diffGames) || a.name.localeCompare(b.name));
  return rows;
}

function groupStageComplete(cat) {
  return cat.matches.length > 0 && cat.matches.every(m => m.winner);
}

function roundName(size) {
  if (size === 2) return 'Final';
  if (size === 4) return 'Semifinales';
  if (size === 8) return 'Cuartos de Final';
  if (size === 16) return 'Octavos de Final';
  if (size === 32) return 'Dieciseisavos de Final';
  return 'Ronda de ' + size;
}
function nextPow2(n) { let p = 1; while (p < n) p *= 2; return p; }

function buildKnockout(catId) {
  const cat = getCategory(catId);
  if (!cat || !cat.groups) return;

  const q = Math.max(1, cat.qualifiersPerGroup);
  const standingsByGroup = cat.groups.map((g, i) => computeStandings(cat, i));

  let qualifiers = [];
  if (q === 1) {
    qualifiers = standingsByGroup.map(s => s[0] && s[0].id).filter(Boolean);
  } else {
    for (let pos = 0; pos < q; pos++) {
      const ranked = standingsByGroup.map(s => s[pos] && s[pos].id).filter(Boolean);
      ranked.forEach(function(x){ qualifiers.push(x); });
    }
    const byPos = [];
    for (let pos = 0; pos < q; pos++) {
      const block = standingsByGroup.map(s => s[pos] && s[pos].id).filter(Boolean);
      if (pos % 2 === 1) block.reverse();
      byPos.push(block);
    }
    qualifiers = [];
    const numGroups = cat.groups.length;
    for (let i = 0; i < numGroups; i++) {
      for (let pos = 0; pos < q; pos++) {
        if (byPos[pos][i]) qualifiers.push(byPos[pos][i]);
      }
    }
  }

  const size = nextPow2(qualifiers.length);
  const withByes = qualifiers.slice();
  while (withByes.length < size) withByes.push('BYE');

  const round1 = [];
  for (let i = 0; i < size / 2; i++) {
    round1.push({
      id: uid('ko'),
      categoryId: cat.id,
      phase: 'ko',
      round: roundName(size),
      p1: withByes[i],
      p2: withByes[size - 1 - i],
      sets: [],
      winner: null,
      court: null,
      time: null,
    });
  }
  round1.forEach(m => {
    if (m.p1 === 'BYE' && m.p2 !== 'BYE') m.winner = m.p2;
    else if (m.p2 === 'BYE' && m.p1 !== 'BYE') m.winner = m.p1;
  });

  const rounds = [round1];
  let currentSize = size / 2;
  while (currentSize > 1) {
    const nextRound = [];
    for (let i = 0; i < currentSize / 2; i++) {
      nextRound.push({
        id: uid('ko'),
        categoryId: cat.id,
        phase: 'ko',
        round: roundName(currentSize / 2 === 0 ? 2 : currentSize),
        p1: null, p2: null, sets: [], winner: null, court: null, time: null,
        fromMatch1: rounds[rounds.length - 1][i * 2].id,
        fromMatch2: rounds[rounds.length - 1][i * 2 + 1].id,
      });
    }
    rounds.push(nextRound);
    currentSize = currentSize / 2;
  }
  rounds.forEach((round, idx) => {
    const roundSize = size / Math.pow(2, idx);
    round.forEach(m => { m.round = roundName(roundSize); });
  });

  cat.knockout = { rounds };
  propagateKnockout(cat);
}

function propagateKnockout(cat) {
  if (!cat.knockout) return;
  const { rounds } = cat.knockout;
  for (let r = 1; r < rounds.length; r++) {
    rounds[r].forEach(m => {
      const src1 = rounds[r - 1].find(x => x.id === m.fromMatch1);
      const src2 = rounds[r - 1].find(x => x.id === m.fromMatch2);
      m.p1 = src1 && src1.winner ? src1.winner : null;
      m.p2 = src2 && src2.winner ? src2.winner : null;
    });
  }
}

function categoryStats(cat) {
  const stats = {};
  cat.players.forEach(p => { stats[p.id] = { id: p.id, name: p.name, PJ: 0, PG: 0, PP: 0, SF: 0, SC: 0, GF: 0, GC: 0 }; });
  const allMatches = cat.matches.concat(cat.knockout ? cat.knockout.rounds.flat() : []);
  allMatches.forEach(m => {
    if (!m.winner || m.p1 === 'BYE' || m.p2 === 'BYE') return;
    const r1 = stats[m.p1], r2 = stats[m.p2];
    if (!r1 || !r2) return;
    let s1 = 0, s2 = 0, g1 = 0, g2 = 0;
    m.sets.forEach(s => {
      g1 += s[0]; g2 += s[1];
      if (s[0] > s[1]) s1++; else if (s[1] > s[0]) s2++;
    });
    r1.PJ++; r2.PJ++;
    r1.SF += s1; r1.SC += s2; r2.SF += s2; r2.SC += s1;
    r1.GF += g1; r1.GC += g2; r2.GF += g2; r2.GC += g1;
    if (m.winner === m.p1) { r1.PG++; r2.PP++; } else { r2.PG++; r1.PP++; }
  });
  return Object.values(stats).sort((a, b) => b.PG - a.PG || (b.SF - b.SC) - (a.SF - a.SC));
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  const children = Array.prototype.slice.call(arguments, 2);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

      )
    );
    card.appendChild(head);
    if (cat.enabled) {
      card.appendChild(el('div', { class: 'grid', style: 'margin-top:10px;' },
        field('Nº de grupos', inputEl('number', cat.numGroups, v => { cat.numGroups = Math.max(1, parseInt(v) || 1); }, { min: 1 })),
        field('Clasificados por grupo a eliminatoria', inputEl('number', cat.qualifiersPerGroup, v => { cat.qualifiersPerGroup = Math.max(1, parseInt(v) || 1); }, { min: 1 })),
      ));
    }
    catsPanel.appendChild(card);
  });
  wrap.appendChild(catsPanel);

  return wrap;
}

function field(labelText, inputNode) {
  return el('div', { class: 'field' }, el('label', {}, labelText), inputNode);
}
function inputText(value, onChange) {
  return inputEl('text', value, onChange);
}
function inputEl(type, value, onChange, extraAttrs) {
  const attrs = Object.assign({ type, value: value === undefined || value === null ? '' : value, onchange: (e) => onChange(e.target.value) }, extraAttrs || {});
  return el('input', attrs);
}

function catSelector(tabKey, onPick) {
  const list = enabledCategories();
  if (!activeCatTab[tabKey] || !list.find(c => c.id === activeCatTab[tabKey])) {
    activeCatTab[tabKey] = list.length ? list[0].id : null;
  }
  const row = el('div', { class: 'row', style: 'margin-bottom:14px;' });
  list.forEach(c => {
    row.appendChild(el('button', {
      class: 'btn btn-sm ' + (activeCatTab[tabKey] === c.id ? 'btn-primary' : 'btn-ghost'),
      onclick: () => { activeCatTab[tabKey] = c.id; onPick && onPick(c.id); render(); },
    }, c.name));
  });
  return row;
}

function viewParticipants() {
  const wrap = document.createDocumentFragment();

    const catSexo = sexoDeCategoria(cat);
    const yaUsadosEnCategoria = new Set();
    cat.players.forEach(p => { if (p.jugadorId) yaUsadosEnCategoria.add(p.jugadorId); if (p.jugador1Id) yaUsadosEnCategoria.add(p.jugador1Id); if (p.jugador2Id) yaUsadosEnCategoria.add(p.jugador2Id); });
    if (cat.kind === 'double') {
      const rosterAll = (window.JugadoresGlobal ? window.JugadoresGlobal.list() : []);
      let roster1, roster2, avisoSexo;
      if (cat.id === 'DX') {
        roster1 = rosterAll.filter(j => j.sexo === 'M' && !yaUsadosEnCategoria.has(j.id));
        roster2 = rosterAll.filter(j => j.sexo === 'F' && !yaUsadosEnCategoria.has(j.id));
        avisoSexo = 'Dobles mixto: Jugador 1 debe ser chico y Jugador 2 chica.';
      } else {
        const base = rosterAll.filter(j => (!catSexo || j.sexo === catSexo) && !yaUsadosEnCategoria.has(j.id));
        roster1 = base; roster2 = base;
        avisoSexo = catSexo ? `Solo se muestran jugadores de sexo ${catSexo === 'M' ? 'masculino' : 'femenino'} para esta categoría, y ya no aparece quien ya esté apuntado aquí.` : 'Ya no aparece en la lista quién esté apuntado en esta categoría.';
      }
      if (roster1.length >= 1 && roster2.length >= 1) {
        const p1Select = el('select', { style: 'min-width:160px;' }, roster1.map(j => el('option', { value: j.id }, j.nombre)));
        const p2Select = el('select', { style: 'min-width:160px;' }, roster2.map(j => el('option', { value: j.id }, j.nombre)));
        const seedLabel2 = el('label', { style: 'display:flex;align-items:center;gap:6px;text-transform:none;margin:0;' },
          el('input', { type: 'checkbox', style: 'width:auto;' }), 'Cabeza de serie');
        const seedCheck2 = seedLabel2.querySelector('input');
        const pairRow = el('div', { class: 'row', style: 'margin-bottom:6px;align-items:center;' },

            onclick: () => {
              if (p1Select.value === p2Select.value) { alert('Elige dos jugadores distintos para formar la pareja.'); return; }
              const j1 = roster1.find(j => j.id === p1Select.value);
              const j2 = roster2.find(j => j.id === p2Select.value);
              if (!j1 || !j2) return;
              const destacadosPareja = jugadoresDestacadosHistoricos(cat.id);
              const seedAuto = seedCheck2.checked || destacadosPareja.has(j1.id) || destacadosPareja.has(j2.id);
              cat.players.push({ id: uid('pl'), name: j1.nombre + ' / ' + j2.nombre, seed: seedAuto, jugador1Id: j1.id, jugador2Id: j2.id });

      const addBtn = el('button', {
        class: 'btn btn-primary',
        onclick: () => {

            roster.map(j => { const c2 = window.calcularCategoria ? window.calcularCategoria(j.fechaNacimiento) : ''; const catLabel = c2 && window.nombreCategoria ? window.nombreCategoria(c2) : ''; return el('option', { value: j.id }, j.nombre + (catLabel ? ' · ' + catLabel : '')); }));
          rosterRow.appendChild(el('span', { style: 'font-size:12px;font-weight:700;color:var(--court-dark);white-space:nowrap;' }, '👥 Desde Jugadores' + (catSexo ? ' (' + (catSexo === 'M' ? 'chicos' : 'chicas') + ')' : '') + ':'));

      panel.appendChild(el('div', { class: 'empty-state' }, 'Todavía no hay participantes en esta categoría.'));

      const table = el('table', {},

  wrap.appendChild(panel);
  return wrap;
}

function viewDraw() {

  }

    catSelector('draw')
  );
  const cat = getCategory(activeCatTab.draw);
  if (cat) {
    const minNeeded = cat.numGroups * 2;
    if (cat.players.length < minNeeded) {
      panel.appendChild(el('div', { class: 'msg msg-warn' },
        `Se necesitan al menos ${minNeeded} participantes para formar ${cat.numGroups} grupo(s) (hay ${cat.players.length}). Añade más en la pestaña Participantes o reduce el nº de grupos en Configuración.`));
    }
    panel.appendChild(el('div', { class: 'toolbar' },
      el('button', {
        class: 'btn btn-gold',
        disabled: cat.players.length < minNeeded ? 'disabled' : null,
        onclick: () => { drawGroups(cat.id); render(); },
      }, cat.groups ? '🎲 Repetir sorteo' : '🎲 Realizar sorteo'),
    ));
    if (cat.groups) {
      const gg = el('div', { class: 'group-grid' });
      cat.groups.forEach(g => {
        const box = el('div', { class: 'group-box' }, el('h3', {}, g.name + ' · ' + g.playerIds.length + ' participantes'));

      panel.appendChild(gg);

function viewSchedule() {
  const wrap = document.createDocumentFragment();
  const pending = enabledCategories().filter(c => !c.groups);
  const panel = el('div', { class: 'panel' },
    el('h2', {}, 'Calendario de partidos'),
    el('div', { class: 'sub' }, `Se generan horarios para ${state.config.courts} pista(s), partidos de ${state.config.matchMinutes} min + ${state.config.bufferMinutes} min de descanso, comenzando a las ${state.config.startTime}.`)
  );
  if (pending.length) {
    panel.appendChild(el('div', { class: 'msg msg-warn' },
      'Faltan por sortear: ' + pending.map(c => c.name).join(', ') + '. Ve a la pestaña Sorteo antes de generar el calendario completo.'));
  }
  panel.appendChild(el('div', { class: 'toolbar' },
    el('button', {
      class: 'btn btn-gold',
      disabled: !enabledCategories().some(c => c.groups) ? 'disabled' : null,
      onclick: () => { buildSchedule(); render(); },
    }, '🗓 Generar / actualizar calendario'),
    el('button', { class: 'btn btn-ghost no-print', onclick: () => window.print() }, '🖨 Imprimir calendario'),
  ));

  const allMatches = [];
  enabledCategories().forEach(cat => {
    cat.matches.forEach(m => { if (m.time) allMatches.push({ cat, m, label: cat.name + ' · Grupo ' + cat.groups[m.groupIndex].name.split(' ')[1] }); });
    if (cat.knockout) cat.knockout.rounds.forEach(round => round.forEach(m => { if (m.time) allMatches.push({ cat, m, label: cat.name + ' · ' + m.round }); }));
  });

  if (!allMatches.length) {
    panel.appendChild(el('div', { class: 'empty-state' }, 'Todavía no hay partidos programados. Genera el calendario cuando tengas al menos un sorteo hecho.'));
    wrap.appendChild(panel);
    return wrap;
  }

  const times = Array.from(new Set(allMatches.map(x => x.m.time))).sort();
  const numCourts = state.config.courts;
  const grid = el('div', { class: 'sched-grid', style: `--ncourts:${numCourts};` });
  const headerRow = el('div', { class: 'sched-row' }, el('div', { class: 'sched-time' }, 'Hora'));
  for (let c = 1; c <= numCourts; c++) headerRow.appendChild(el('div', { class: 'sched-cell', style: 'font-weight:700;color:var(--court-dark);' }, 'Pista ' + c));
  grid.appendChild(headerRow);

  times.forEach(t => {
    const row = el('div', { class: 'sched-row' }, el('div', { class: 'sched-time' }, t));
    for (let c = 1; c <= numCourts; c++) {
      const cell = el('div', { class: 'sched-cell' });
      const match = allMatches.find(x => x.m.time === t && x.m.court === c);
      if (match) {
        const p1 = playerName(match.cat, match.m.p1);
        const p2 = playerName(match.cat, match.m.p2);
        cell.appendChild(el('div', { class: 'sched-match' + (match.m.phase === 'ko' ? ' ko' : '') },
          el('div', { style: 'font-weight:800;' }, match.label),
          el('div', {}, p1 + ' vs ' + p2)));
      }
      row.appendChild(cell);
    }
    grid.appendChild(row);
  });
  panel.appendChild(grid);
  wrap.appendChild(panel);
  return wrap;
}

function viewResults() {
  const wrap = document.createDocumentFragment();
  if (!enabledCategories().length) {
    wrap.appendChild(emptyPanel('No hay categorías activas', 'Activa categorías y realiza el sorteo para poder introducir resultados.'));
    return wrap;
  }
  const panel = el('div', { class: 'panel' },
    el('h2', {}, 'Resultados de la fase de grupos'),
    el('div', { class: 'sub' }, 'Pulsa en un partido para introducir el resultado por sets.'),
    catSelector('results')
  );
  const cat = getCategory(activeCatTab.results);
  if (cat) {
    if (!cat.groups) {
      panel.appendChild(el('div', { class: 'empty-state' }, 'Realiza primero el sorteo de esta categoría.'));
    } else {
      cat.groups.forEach((g, gIdx) => {
        panel.appendChild(el('h3', { style: 'margin:18px 0 8px;color:var(--court-dark);' }, g.name));

      });

function matchCard(cat, m) {
  const p1 = playerName(cat, m.p1), p2 = playerName(cat, m.p2);
  const scoreTxt = m.sets.length ? m.sets.map(s => s[0] + '-' + s[1]).join(', ') : 'Sin jugar';
  return el('div', { class: 'match-card' + (m.winner ? ' done' : ''), onclick: () => openResultModal(cat.id, m.id) },
    el('div', { class: 'match-top' },
      el('span', {}, m.court ? ('Pista ' + m.court + ' · ' + m.time) : 'Sin horario'),
      el('span', {}, m.winner ? '✔ Jugado' : 'Pendiente')),
    el('div', { class: 'match-players' },
      el('span', { style: m.winner === m.p1 ? 'color:var(--ok);font-weight:800;' : '' }, p1),
      el('span', { class: 'vs' }, 'vs'),
      el('span', { style: m.winner === m.p2 ? 'color:var(--ok);font-weight:800;' : '' }, p2)),
    el('div', { style: 'margin-top:6px;font-size:12px;color:var(--muted);' }, scoreTxt)
  );
}

function standingsTable(cat, gIdx) {
  const rows = computeStandings(cat, gIdx);
  const table = el('table', { style: 'margin-bottom:8px;' },
    el('thead', {}, el('tr', {}, el('th', {}, 'Jugador/Pareja'), el('th', {}, 'PJ'), el('th', {}, 'G'), el('th', {}, 'P'), el('th', {}, 'Sets'), el('th', {}, 'Juego'), el('th', {}, 'Pts'))));
  const tbody = el('tbody');
  rows.forEach((r, i) => {
    tbody.appendChild(el('tr', {},
      el('td', {}, (i + 1) + '. ' + r.name),
      el('td', {}, String(r.PJ)),
      el('td', {}, String(r.PG)),
      el('td', {}, String(r.PP)),
      el('td', {}, r.SF + '-' + r.SC),
      el('td', {}, r.GF + '-' + r.GC),
      el('td', { style: 'font-weight:800;' }, String(r.Pts)),
    ));
  });
  table.appendChild(tbody);
  return table;
}

function findMatch(catId, matchId) {
  const cat = getCategory(catId);
  let m = cat.matches.find(x => x.id === matchId);
  if (m) return { cat, m };
  if (cat.knockout) {
    for (const round of cat.knockout.rounds) {
      m = round.find(x => x.id === matchId);
      if (m) return { cat, m };
    }
  }
  return null;
}

function openResultModal(catId, matchId) {
  const found = findMatch(catId, matchId);
  if (!found) return;
  const { cat, m } = found;
  const root = document.getElementById('torneoModalRoot');
  let sets = m.sets.length ? m.sets.map(s => s.slice()) : [[0, 0], [0, 0]];

  function draw() {
    root.innerHTML = '';
    const setsWrap = el('div', {});
    sets.forEach((s, i) => {
      setsWrap.appendChild(el('div', { class: 'set-row' },
        el('span', { style: 'width:60px;font-weight:700;color:var(--muted);' }, 'Set ' + (i + 1)),
        el('input', { type: 'number', min: '0', value: s[0], onchange: (e) => { sets[i][0] = parseInt(e.target.value) || 0; } }),
        el('span', {}, '-'),
        el('input', { type: 'number', min: '0', value: s[1], onchange: (e) => { sets[i][1] = parseInt(e.target.value) || 0; } }),
        sets.length > 1 ? el('button', { class: 'btn btn-danger btn-sm', onclick: () => { sets.splice(i, 1); draw(); } }, '✕') : null,
      ));
    });
    const modal = el('div', { class: 'modal' },
      el('h3', {}, playerName(cat, m.p1) + ' vs ' + playerName(cat, m.p2)),
      el('div', { class: 'sub' }, cat.name + (m.phase === 'ko' ? (' · ' + m.round) : '') + (m.court ? (' · Pista ' + m.court + ' · ' + m.time) : '')),
      setsWrap,
      el('div', { class: 'row', style: 'margin-bottom:14px;' },
        el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { sets.push([0, 0]); draw(); } }, '+ Añadir set')),
      el('div', { class: 'row' },
        el('button', { class: 'btn btn-primary', onclick: () => {
          m.sets = sets;
          setWinnerFromSets(m);
          if (m.phase === 'ko') propagateKnockout(cat);
          closeModal();
          render();
        } }, 'Guardar resultado'),
        el('button', { class: 'btn btn-ghost', onclick: closeModal }, 'Cancelar'),
        m.winner ? el('button', { class: 'btn btn-danger', style: 'margin-left:auto;', onclick: () => {
          m.sets = []; m.winner = null;
          if (m.phase === 'ko') propagateKnockout(cat);
          closeModal(); render();
        } }, 'Borrar resultado') : null,
      )
    );

function viewStats() {
  const wrap = document.createDocumentFragment();

    wrap.appendChild(emptyPanel('No hay categorías activas', 'Activa categorías para ver estadísticas.'));

  }
  const totalMatches = enabledCategories().reduce((s, c) => s + c.matches.length + (c.knockout ? c.knockout.rounds.flat().filter(m => m.p1 && m.p2 && m.p1 !== 'BYE' && m.p2 !== 'BYE').length : 0), 0);

  const cards = el('div', { class: 'stat-cards' },

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (state.meta.title || 'torneo').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  a.href = url;
  a.download = `torneo_badminton_${safeName || 'datos'}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.config || !parsed.categories) throw new Error('formato no reconocido');
      state = parsed;
      render();
    } catch (err) {
      alert('No se ha podido importar el fichero: formato no válido.');
    }
  };
  reader.readAsText(file);
}

function getState() { return state; }
function setState(s) { state = s; }
function getHistorial() { return torneosHistorial; }
function setHistorial(h) { torneosHistorial = h || []; }
function resultadoDeParticipanteEnCategoria(cat, participantId) {
  if (cat.knockout && cat.knockout.rounds && cat.knockout.rounds.length) {
    const rounds = cat.knockout.rounds;
    let ultimoPartido = null, ultimaRondaIdx = -1;
    for (let r = 0; r < rounds.length; r++) {
      const m = rounds[r].find(x => x.p1 === participantId || x.p2 === participantId);
      if (m) { ultimoPartido = m; ultimaRondaIdx = r; }
    }
    if (ultimoPartido) {
      const esUltimaRonda = ultimaRondaIdx === rounds.length - 1;
      const gano = ultimoPartido.winner === participantId;
      if (esUltimaRonda && ultimoPartido.winner) return gano ? '🥇 Campeón' : '🥈 Subcampeón';
      if (ultimoPartido.winner) return 'Eliminado en ' + (ultimoPartido.round || 'eliminatoria');
      return 'En juego (' + (ultimoPartido.round || 'eliminatoria') + ')';
    }
  }
  if (cat.groups && cat.groups.length) {
    for (let gi = 0; gi < cat.groups.length; gi++) {
      const grp = cat.groups[gi];
      if (grp.playerIds && grp.playerIds.includes(participantId)) {
        if (!groupStageComplete(cat)) return 'Fase de grupos (en curso)';
        const standings = computeStandings(cat, gi);
        const pos = standings.findIndex(r => r.id === participantId) + 1;
        return pos ? (pos + 'º de grupo') : 'Fase de grupos';
      }
    }
  }
  return null;
}
function trayectoriaDeJugador(jugadorId) {
  const resultados = [];
  const fuentes = [];
  torneosHistorial.forEach(t => fuentes.push({ nombre: t.nombre, fecha: t.fechaInicio, categorias: (t.snapshot && t.snapshot.categories) || [] }));
  fuentes.push({ nombre: state.meta.title || 'Torneo actual', fecha: state.meta.date, categorias: state.categories });
  fuentes.forEach(f => {
    (f.categorias || []).forEach(cat => {
      if (!cat.enabled || !cat.players || !cat.players.length) return;
      const participante = cat.players.find(p => p.jugadorId === jugadorId || p.jugador1Id === jugadorId || p.jugador2Id === jugadorId);
      if (!participante) return;
      const resultado = resultadoDeParticipanteEnCategoria(cat, participante.id);
      resultados.push({
        torneo: f.nombre,
        fecha: f.fecha,
        categoria: cat.name,
        pareja: (participante.jugador1Id && participante.jugador2Id) ? participante.name : null,
        resultado: resultado || 'Sin resultado registrado aún',
      });
    });
  });
  resultados.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  return resultados;
}

  tryLoadLocal();
  tryLoadHistorial();
  render();
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  const children = Array.prototype.slice.call(arguments, 2);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

function inputEl(type, value, onChange, extraAttrs) {

  return el('input', attrs);
}
function selectEl(options, value, onChange) {
  const sel = el('select', { onchange: (e) => onChange(e.target.value) });
  options.forEach(opt => {
    const optEl = el('option', { value: opt.value }, opt.label);
    if (opt.value === value) optEl.setAttribute('selected', 'selected');
    sel.appendChild(optEl);
  });
  return sel;
}

function fichaCard(f) {

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (state.meta.grupo || 'planificacion').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  a.href = url;
  a.download = `planificacion_badminton_${safeName || 'datos'}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.config || !parsed.meta) throw new Error('formato no reconocido');
      state = parsed;
      render();
    } catch (err) {
      alert('No se ha podido importar el fichero: formato no válido.');
    }
  };
  reader.readAsText(file);
}

function getState() { return state; }
function setState(s) { state = s; }
function mount() {
  tryLoadLocal();
  refActiveNivel = state.config.nivel;
  render();
}
return { render, mount, getState, setState };
})();

    competiciones: [],
  };
}
let state = defaultState();
let activeTab = 'cuotas';
let uidCounter = 1;
function uid(prefix) { return prefix + '_' + (uidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }

function saveLocal() { try { localStorage.setItem('badmintonPagosState', JSON.stringify(state)); } catch (e) { } if (typeof programarSyncNube === 'function') programarSyncNube(); }
function tryLoadLocal() {

    if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.config) state = parsed; }
  } catch (e) { }
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  const children = Array.prototype.slice.call(arguments, 2);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}
function field(labelText, inputNode) { return el('div', { class: 'field' }, el('label', {}, labelText), inputNode); }
function inputEl(type, value, onChange, extraAttrs) {

}

  const sel = el('select', { onchange: (e) => onChange(e.target.value) });
  options.forEach(opt => {
    const optEl = el('option', { value: opt.value }, opt.label);

}

}

function periodoActualDefault() {
  const now = new Date();
  if (state.config.tipoCuota === 'anual') return String(now.getFullYear());
  return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
}

function esMenorDeEdad(fechaNacimiento) {
  if (!fechaNacimiento) return false;
  const nacimiento = new Date(fechaNacimiento);
  if (isNaN(nacimiento.getTime())) return false;
  const hoy = new Date();
  let edad = hoy.getFullYear() - nacimiento.getFullYear();
  const m = hoy.getMonth() - nacimiento.getMonth();
  if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) edad--;
  return edad < 18;
}

function cuotaDe(jugador) {
  return esMenorDeEdad(jugador.fechaNacimiento) ? state.config.cuotaMenorClub : state.config.cuotaMensual;

function precioInscripcion(comp, insc) {

  if (n === 1) return comp.precio1;
  return comp.precio2;
}

            target: '_blank',
          }, 'Aviso de pago') : null,

<script>
function el(tag, attrs) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  const children = Array.prototype.slice.call(arguments, 2);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

}

function calcularCategoria(fechaNacimiento) {
  if (!fechaNacimiento) return '';

function redimensionarImagen(file, maxAncho, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxAncho) { h = Math.round(h * maxAncho / w); w = maxAncho; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => callback(e.target.result);
    img.src = e.target.result;
  };
  reader.onerror = () => callback('');
  reader.readAsDataURL(file);
}
function normalizarNombre(str) {
  return String(str || '').trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}
function separarNombreApellidos(completo) {
  const partes = String(completo || '').trim().split(/\s+/);
  return partes.length > 1 ? { nombre: partes[0], apellidos: partes.slice(1).join(' ') } : { nombre: completo || '', apellidos: '' };
}

function exportAll() {
  const combined = {
    club: clubGlobal,
    jugadoresGlobal: jugadoresGlobal,
    torneo: TorneoApp.getState(),
    torneosHistorial: TorneoApp.getHistorial(),
    planificacion: PlanApp.getState(),
    pagos: PagosApp.getState(),
  };
  const blob = new Blob([JSON.stringify(combined, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (clubGlobal.nombre || 'club').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  a.href = url;
  a.download = `badminton_${safeName || 'datos'}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importAll(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.torneo || !parsed.planificacion) throw new Error('formato no reconocido');
      clubGlobal = Object.assign({ nombre: '', localidad: '', temporadaInicio: '', temporadaFin: '', logo: '' }, parsed.club || {});
      jugadoresGlobal = parsed.jugadoresGlobal || [];
      saveClubGlobal(); saveJugadoresGlobal();
      TorneoApp.setState(parsed.torneo);
      if (parsed.torneosHistorial) TorneoApp.setHistorial(parsed.torneosHistorial);
      PlanApp.setState(parsed.planificacion);
      if (parsed.pagos) PagosApp.setState(parsed.pagos);
      showSection('home');
    } catch (err) {
      alert('No se ha podido importar el fichero: formato no válido.');
    }
  };
  reader.readAsText(file);
}

function envolverArraysAnidados(valor) {
  if (Array.isArray(valor)) {
    return valor.map(v => Array.isArray(v) ? { __arr: envolverArraysAnidados(v) } : envolverArraysAnidados(v));
  } else if (valor && typeof valor === 'object') {
    const out = {};
    for (const k in valor) { if (Object.prototype.hasOwnProperty.call(valor, k)) out[k] = envolverArraysAnidados(valor[k]); }
    return out;
  }
  return valor;
}
function desenvolverArraysAnidados(valor) {
  if (Array.isArray(valor)) {
    return valor.map(v => (v && typeof v === 'object' && Array.isArray(v.__arr) && Object.keys(v).length === 1) ? desenvolverArraysAnidados(v.__arr) : desenvolverArraysAnidados(v));
  } else if (valor && typeof valor === 'object') {
    const out = {};
    for (const k in valor) { if (Object.prototype.hasOwnProperty.call(valor, k)) out[k] = desenvolverArraysAnidados(valor[k]); }
    return out;
  }
  return valor;
}
function programarSyncNube() {
  if (!firebaseDisponible) return;
  marcarEstadoNube('☁️ Guardando en la nube…');
  clearTimeout(nubeSyncTimer);
  nubeSyncTimer = setTimeout(() => {
    const payloadLimpio = envolverArraysAnidados(JSON.parse(JSON.stringify(estadoCompletoParaNube())));
    const tamanoAprox = JSON.stringify(payloadLimpio).length;
    if (tamanoAprox > 900000) {
      marcarEstadoNube('⚠️ Nube: los datos pesan demasiado (' + Math.round(tamanoAprox / 1024) + ' KB, máximo ~900 KB). Revisa si algún jugador tiene una foto muy pesada.');
      return;
    }
    docNube().set(payloadLimpio).then(() => {
      marcarEstadoNube('☁️ Sincronizado');
    }).catch(err => {
      console.warn('Error subiendo a la nube:', err);
      marcarEstadoNube('⚠️ Nube: ' + (err && err.code ? err.code : (err && err.message) || 'error desconocido') + (err && err.message ? ' - ' + err.message : ''));
    });
  }, 900);
}
function aplicarDatosDeNube(dataOriginal) {

  if (data.planificacion) PlanApp.setState(data.planificacion);
  if (data.pagos) PagosApp.setState(data.pagos);
  if (data.accessControl) { accessControl = data.accessControl; saveAccessControl(); }
}
function arrancarAppLocal() {
  const hadClubAhora = !!clubGlobal.nombre;
  syncClubIntoModules();
  if (accesoActivo() && !sesionActual) {
    mostrarLogin();
  } else if (!hadClubAhora) {
    currentSection = 'onboarding';
    renderOnboarding();
    document.getElementById('onboardingScreen').style.display = 'block';
    renderShellHeader();
  } else {
    showSection('home');
  }
}

document.getElementById('shellBrand').addEventListener('click', () => showSection('home'));
document.getElementById('btnMenu').addEventListener('click', () => showSection('home'));
document.getElementById('btnExport').addEventListener('click', exportAll);
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', (e) => { if (e.target.files[0]) importAll(e.target.files[0]); e.target.value = ''; });
document.getElementById('btnLogout').addEventListener('click', () => { if (confirm('¿Cerrar sesión?')) cerrarSesion(); });

loadClubGlobal();
loadJugadoresGlobal();
loadAccessControl();
loadSesion();
TorneoApp.mount();
PlanApp.mount();
PagosApp.mount();

inicializarFirebase();
if (firebaseDisponible) {
  marcarEstadoNube('☁️ Conectando…');
  docNube().get().then(doc => {
    if (doc.exists) {
      aplicarDatosDeNube(doc.data());
      marcarEstadoNube('☁️ Sincronizado');
    } else {
      marcarEstadoNube('☁️ Sincronizado');
      if (clubGlobal.nombre) programarSyncNube();
    }
    arrancarAppLocal();
  }).catch(err => {
    console.warn('No se pudo conectar a la nube, usando datos guardados en este dispositivo:', err);
    marcarEstadoNube('⚠️ Nube: ' + (err && err.code ? err.code : (err && err.message) || 'error desconocido'));
    arrancarAppLocal();
  });
} else {
  arrancarAppLocal();
}
</script>
</body>

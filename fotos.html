<style>body{margin:0;font-family:system-ui,sans-serif;background:#15191c;color:#fff;padding:16px}h1{font-size:22px;margin:4px 0 4px}p{color:#aab;margin:0 0 16px}

<b>7. Volante sobre fondo negro</b><br>Saif71.com</figcaption></figure><figure><span>8</span><img src="https://images.unsplash.com/photo-1564226803380-91139fdcb4d0?auto=format&fit=crop&w=900&q=70" alt="Volante blanco" loading="lazy"><figcaption><b>8. Volante blanco</b><br>Siora Photography</figcaption></figure><figure><span>9</span><img src="https://images.unsplash.com/photo-1765544581327-b5e9055d986c?auto=format&fit=crop&w=900&q=70" alt="Volante sobre pista verde" loading="lazy"><figcaption><b>9. Volante sobre pista verde</b><br>Ogie</figcaption></figure><figure><span>10</span><img src="https://images.unsplash.com/photo-1696250530563-70f39e532e10?auto=format&fit=crop&w=900&q=70" alt="Raqueta amarilla en el aire" loading="lazy"><figcaption><b>10. Raqueta amarilla en el aire</b><br>Sleeba Thomas</figcaption></figure><figure><span>11</span><img src="https://images.unsplash.com/photo-1708312604109-16c0be9326cd?auto=format&fit=crop&w=900&q=70" alt="La anterior (la «cutre»)" loading="lazy"><figcaption><b>11. La anterior (la «cutre»)</b><br>Allison Saeng</figcaption></figure></main></body></html>
